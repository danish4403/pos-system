  /* Compact live clock: a calm glass status panel that matches the rest of the dashboard. */
  .identity-clock{gap:7px;padding:9px 12px;}
  .clock-date-row{display:flex;align-items:center;gap:9px;min-width:0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
  .clock-date-value{color:var(--brass-ink);}
  .clock-day{overflow:hidden;text-overflow:ellipsis;}
  .clock-live{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:8px;letter-spacing:.1em;color:var(--moss);}
  .clock-live i{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent);}
  .clock-time-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-width:0;}
  .clock-time-value{font-family:'IBM Plex Mono',monospace;font-size:clamp(28px,3.2vw,38px);font-weight:700;line-height:1;letter-spacing:.08em;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55);transition:color .2s ease,transform .2s ease;}
  .clock-time-value.is-ticking{color:var(--brass-ink);transform:translateY(-1px);}
  .clock-time-zone{font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--ink-soft);white-space:nowrap;}
  .clock-accent-line{display:block;width:100%;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--brass),color-mix(in srgb,var(--brass) 20%,transparent));opacity:.8;}
  :root[data-appearance="dark"] .clock-time-value{text-shadow:0 1px 0 rgba(0,0,0,.25);}
  @media (max-width:480px){.clock-date-row{gap:6px;font-size:8px}.clock-live{font-size:7px}.clock-time-value{font-size:27px}.clock-time-zone{font-size:7px}.identity-clock{padding:9px 10px;}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important;}}

  /* ---------- Role-based sign-in ---------- */
  .main-login{display:flex;padding:0;overflow:hidden;background:#eef5ff;}
  .login-experience{display:grid;grid-template-columns:minmax(0,61%) minmax(360px,39%);width:100%;min-height:100%;color:#102c60;background:#eff6ff;}
  .login-left{position:relative;display:flex;justify-content:center;align-items:center;min-width:0;overflow:hidden;padding:36px clamp(28px,6vw,84px);background:radial-gradient(ellipse at 4% 0%,rgba(108,158,255,.17),transparent 31%),radial-gradient(ellipse at 100% 100%,rgba(112,171,255,.12),transparent 38%),linear-gradient(135deg,#f5f9ff 0%,#eaf3ff 54%,#f4f8ff 100%);}
  .login-left::before,.login-left::after{position:absolute;content:"";pointer-events:none;border-radius:50%;border:1px solid rgba(112,160,238,.12);}
  .login-left::before{width:450px;height:450px;left:-300px;top:-285px;box-shadow:0 0 0 34px rgba(255,255,255,.12),0 0 0 70px rgba(255,255,255,.08);}
  .login-left::after{width:560px;height:560px;right:-425px;bottom:-415px;box-shadow:0 0 0 36px rgba(255,255,255,.12);}
  .login-content{position:relative;z-index:1;width:min(100%,500px);}
  .login-brand{display:flex;align-items:center;gap:14px;margin:0 0 30px 10px;}
  .login-brand-mark{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:14px;color:#fff;background:linear-gradient(145deg,#5d91ff,#2370f5);box-shadow:0 8px 18px rgba(42,112,239,.25);}
  .login-brand-mark svg{width:26px;height:26px;}
  .login-brand img{width:48px;height:48px;object-fit:contain;border-radius:13px;background:#fff;box-shadow:0 6px 18px rgba(48,91,153,.12);}
  .login-brand-copy{display:flex;min-width:0;flex-direction:column;}
  .login-brand-name{font-size:21px;font-weight:750;letter-spacing:-.045em;color:#102c60;}
  .login-brand-tagline{margin-top:3px;color:#6680ac;font-size:11px;letter-spacing:.01em;}
  .login-panel{padding:25px 21px 20px;border:1px solid rgba(255,255,255,.95);border-radius:17px;background:rgba(255,255,255,.52);box-shadow:0 18px 42px rgba(46,87,151,.09),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
  .login-panel-heading{text-align:center;margin-bottom:21px;}
  .login-panel-heading h1{margin:0;color:#102c60;font-size:20px;font-weight:700;letter-spacing:-.035em;}
  .login-panel-heading p{margin:5px 0 0;color:#6e83a9;font-size:12.5px;}
  .login-role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .login-role-card{display:flex;min-width:0;flex-direction:column;align-items:center;padding:21px 14px 15px;border:1px solid rgba(213,226,249,.82);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(243,248,255,.62));text-align:center;transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;}
  .login-role-card.is-active{border-color:#4c88ff;box-shadow:0 0 0 1px rgba(76,136,255,.12),0 8px 20px rgba(46,112,237,.08);}
  .login-role-card:hover{transform:translateY(-2px);}
  .login-role-icon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:12px;border-radius:50%;background:#dceaff;color:#2674f5;}
  .login-role-icon svg{width:28px;height:28px;}
  .login-role-card--employee .login-role-icon{background:#eee8ff;color:#8057ee;}
  .login-role-name{color:#132f65;font-size:14px;font-weight:700;}
  .login-role-description{min-height:35px;margin:7px 0 14px;color:#6a80a8;font-size:10.5px;line-height:1.5;}
  .login-role-button{width:100%;min-height:38px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #4f86ff;border-radius:999px;background:transparent;color:#4773c4;font:600 12px Inter,sans-serif;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease;}
  .login-role-card.is-active .login-role-button,.login-role-button:hover:not(:disabled){border-color:#2874f4;background:linear-gradient(100deg,#3882fa,#2168e9);color:#fff;box-shadow:0 5px 12px rgba(39,109,235,.2);}
  .login-role-button:disabled{opacity:.5;cursor:not-allowed;}
  .login-role-button svg{width:14px;height:14px;}
  .login-panel-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:15px 0 0;border-top:1px solid rgba(168,190,227,.24);}
  .login-security{display:flex;align-items:center;gap:9px;color:#476594;}
  .login-security-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:rgba(210,226,251,.72);color:#5679b1;}
  .login-security-icon svg{width:15px;height:15px;}
  .login-security strong,.login-security small{display:block;}
  .login-security strong{font-size:9.5px;font-weight:650;}
  .login-security small{margin-top:2px;color:#7c91b4;font-size:9px;}
  .login-theme{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:#60799f;font:500 10px Inter,sans-serif;cursor:pointer;}
  .login-theme-switch{width:29px;height:16px;display:flex;align-items:center;padding:2px;border-radius:99px;background:#c8d6ee;}
  .login-theme-switch::before{width:12px;height:12px;content:"";border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(30,54,91,.22);transition:transform .18s ease;}
  :root[data-appearance="dark"] .login-theme-switch{background:#3478eb;}
  :root[data-appearance="dark"] .login-theme-switch::before{transform:translateX(13px);}
  .login-store{display:flex;align-items:center;gap:10px;margin:34px 0 0 0;color:#294a7d;}
  .login-store-icon{width:25px;height:25px;display:grid;place-items:center;color:#5575a7;}
  .login-store-icon svg{width:24px;height:24px;}
  .login-store-name{font-size:10px;font-weight:650;}
  .login-store-meta{margin-top:3px;color:#788fb6;font-size:9px;}
  .login-store-name,.login-store-meta{display:block;}
  .login-guest-link{display:block;margin:14px auto 0;border:0;background:transparent;color:#7186aa;font:500 10px Inter,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
  .main-setup{padding:0;overflow-y:auto;overflow-x:hidden;background:radial-gradient(ellipse at 0% 0%,rgba(108,158,255,.15),transparent 34%),linear-gradient(135deg,#f5f9ff,#eaf3ff 58%,#f4f8ff);}
  .setup-shell{min-height:100%;padding:30px clamp(16px,4vw,56px) 50px;color:#102c60;}
  .setup-brand{display:flex;align-items:center;gap:12px;width:min(100%,980px);margin:0 auto 24px;}
  .setup-brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#5d91ff,#2370f5);color:white;box-shadow:0 8px 18px rgba(42,112,239,.2);}
  .setup-brand-mark svg{width:23px;height:23px;}
  .setup-brand-copy{display:flex;flex-direction:column;}
  .setup-brand-name{font-size:18px;font-weight:750;letter-spacing:-.04em;}
  .setup-brand-subtitle{margin-top:3px;color:#7187aa;font-size:11px;}
  .setup-content{width:min(100%,980px);margin:0 auto;}
  .setup-intro{margin-bottom:18px;padding:24px 26px;border:1px solid rgba(255,255,255,.92);border-radius:17px;background:rgba(255,255,255,.62);box-shadow:0 14px 34px rgba(46,87,151,.08),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .setup-step{display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:5px 10px;border-radius:999px;background:#e6efff;color:#3471d2;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .setup-intro h1{margin:0;color:#102c60;font-size:24px;letter-spacing:-.04em;}
  .setup-intro p{margin:7px 0 0;color:#6e83a9;font-size:13px;line-height:1.55;}
  .setup-settings .page-head{display:none;}
  .setup-settings .card{border-color:rgba(255,255,255,.92);background:linear-gradient(135deg,rgba(255,255,255,.78),rgba(248,251,255,.64));box-shadow:0 12px 30px rgba(46,87,151,.07),inset 0 1px 0 rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
  .setup-finish{margin:18px 0 0;padding:20px 22px;border:1px solid rgba(255,255,255,.95);border-radius:16px;background:rgba(255,255,255,.64);box-shadow:0 12px 30px rgba(46,87,151,.07);}
  .setup-finish h2{margin:0;color:#16396e;font-size:16px;}
  .setup-finish p{margin:6px 0 14px;color:#6e83a9;font-size:12px;line-height:1.5;}
  .setup-finish .btn{min-height:42px;border-radius:999px;background:linear-gradient(100deg,#3882fa,#2168e9);}
  .attendance-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;}
  .attendance-calendar-weekday{padding:7px 4px;text-align:center;color:var(--ink-soft);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .attendance-day{min-width:0;min-height:78px;padding:8px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--surface) 76%,transparent);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;}
  .attendance-day:hover{transform:translateY(-1px);border-color:var(--status-info);box-shadow:0 6px 14px rgba(37,87,153,.1);}
  .attendance-day.is-empty{border-color:transparent;background:transparent;cursor:default;box-shadow:none;}
  .attendance-day.is-empty:hover{transform:none;}
  .attendance-day.is-selected{outline:2px solid var(--status-info);outline-offset:1px;}
  .attendance-day.is-present{background:var(--status-success-bg);border-color:color-mix(in srgb,var(--status-success) 28%,var(--line));color:var(--status-success);}
  .attendance-day.is-absent{background:var(--status-danger-bg);border-color:color-mix(in srgb,var(--status-danger) 28%,var(--line));color:var(--status-danger);}
  .attendance-day.is-half-day{background:var(--status-warning-bg);border-color:color-mix(in srgb,var(--status-warning) 30%,var(--line));color:var(--status-warning);}
  .attendance-day.is-special{background:var(--status-info-bg);border-color:color-mix(in srgb,var(--status-info) 34%,var(--line));color:var(--status-info);}
  .attendance-day-number{display:block;font-size:12px;font-weight:750;}
  .attendance-day-status{display:block;margin-top:8px;font-size:9px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;}
  .attendance-day.is-locked{cursor:default;}
  .attendance-day.is-locked:hover{transform:none;border-color:var(--line);box-shadow:none;}
  .attendance-collapse-toggle{display:inline-flex;align-items:center;gap:6px;border-radius:999px;}
  .attendance-quick-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .attendance-quick-pill{min-height:25px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-soft);font-size:10px;font-weight:700;line-height:1;cursor:pointer;white-space:nowrap;}
  .attendance-quick-pill:hover{border-color:var(--status-info);color:var(--status-info);}
  .attendance-quick-pill.is-present,.attendance-quick-pill.is-present.is-active{border-color:color-mix(in srgb,var(--status-success) 40%,var(--line));background:var(--status-success-bg);color:var(--status-success);}
  .attendance-quick-pill.is-absent,.attendance-quick-pill.is-absent.is-active{border-color:color-mix(in srgb,var(--status-danger) 40%,var(--line));background:var(--status-danger-bg);color:var(--status-danger);}
  .attendance-quick-pill.is-active{box-shadow:inset 0 0 0 1px currentColor;}
  .attendance-quick-pill:disabled{opacity:.65;cursor:wait;}
  .attendance-legend{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;}
  .attendance-legend-item{display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);font-size:10px;}
  .attendance-legend-dot{width:9px;height:9px;border-radius:50%;background:var(--status-neutral);}
  .attendance-legend-dot.is-present{background:var(--status-success);}
  .attendance-legend-dot.is-absent{background:var(--status-danger);}
  .attendance-legend-dot.is-half-day{background:var(--status-warning);}
  .attendance-legend-dot.is-special{background:var(--status-info);}
  .employee-tools-nav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px;padding:9px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--surface) 75%,transparent);}
  .employee-tools-nav .btn.active{background:var(--status-info-bg);border-color:color-mix(in srgb,var(--status-info) 30%,var(--line));color:var(--status-info);}
  .employee-directory-card{overflow:hidden;}
  .employee-directory-scroll{overflow-x:auto;padding:0 18px 4px;scrollbar-width:thin;}
  .employee-directory-table{min-width:790px;}
  .employee-directory-table th,.employee-directory-table td{white-space:nowrap;}
  .employee-directory-table th:first-child,.employee-directory-table td:first-child{width:20%;}
  .employee-directory-table th:last-child,.employee-directory-table td:last-child{width:34%;}
  .employee-row-actions{display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;}
  .employee-row-actions .attendance-quick-actions{flex-wrap:nowrap;}
  .employee-directory-table td:nth-child(2){font-size:12px;}
  .employee-directory-table td:nth-child(3){white-space:normal;min-width:130px;}
  @media (max-width:600px){.attendance-calendar{gap:4px}.attendance-day{min-height:58px;padding:5px;border-radius:8px}.attendance-day-status{margin-top:5px;font-size:8px}.attendance-calendar-weekday{font-size:8px;padding:5px 1px}}
  :root[data-appearance="dark"] .main-setup{background:radial-gradient(ellipse at 0% 0%,rgba(65,118,213,.16),transparent 34%),linear-gradient(135deg,#16243a,#1b2b43 58%,#17243a);}
  :root[data-appearance="dark"] .setup-shell{color:#e5edff;}
  :root[data-appearance="dark"] .setup-intro,:root[data-appearance="dark"] .setup-finish{border-color:rgba(194,214,255,.15);background:rgba(24,40,64,.72);}
  :root[data-appearance="dark"] .setup-intro h1,:root[data-appearance="dark"] .setup-finish h2{color:#e8f0ff;}
  :root[data-appearance="dark"] .setup-intro p,:root[data-appearance="dark"] .setup-finish p{color:#aabbd7;}
  :root[data-appearance="dark"] .setup-settings .card{border-color:rgba(194,214,255,.15);background:rgba(24,40,64,.72);}
  .login-showcase{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;padding:64px clamp(34px,4.5vw,72px);background:linear-gradient(180deg,rgba(250,252,255,.72),rgba(226,238,255,.48));}
  .login-showcase-art{position:absolute;inset:0;overflow:hidden;opacity:.56;}
  .login-showcase-art svg{position:absolute;width:100%;height:100%;inset:0;}
  .login-showcase-copy{position:relative;z-index:1;width:min(100%,350px);}
  .login-showcase-copy h2{margin:0 0 25px;color:#31558d;font-family:"Segoe Print","Bradley Hand",cursive;font-size:clamp(22px,2.25vw,30px);font-style:italic;font-weight:500;line-height:1.3;letter-spacing:-.025em;}
  .login-feature-list{display:grid;gap:16px;}
  .login-feature{display:flex;align-items:center;gap:12px;}
  .login-feature-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.72);border-radius:12px;background:rgba(220,237,255,.86);color:#2782f7;box-shadow:0 4px 12px rgba(55,103,176,.07);}
  .login-feature-icon svg{width:20px;height:20px;}
  .login-feature:nth-child(2) .login-feature-icon{background:rgba(209,247,233,.88);color:#16b77d;}
  .login-feature:nth-child(3) .login-feature-icon{background:rgba(232,225,255,.9);color:#8056fa;}
  .login-feature:nth-child(4) .login-feature-icon{background:rgba(255,239,216,.9);color:#fa8a13;}
  .login-feature strong{display:block;color:#183867;font-size:10px;font-weight:700;}
  .login-feature small{display:block;margin-top:4px;color:#758cad;font-size:9px;}
  .login-card--landing{max-width:none;margin:0;padding:0;border:0;background:transparent;box-shadow:none;backdrop-filter:none;}
  .login-card--landing .card-body{padding:0;}
  .login-card--landing .login-badge,.login-card--landing .login-shopname{display:none;}
  .login-card--landing .login-title{margin-bottom:10px;color:#102c60;font-size:20px;}
  .login-card--landing p{color:#6e83a9;}
  .login-card--landing .role-toggle{background:rgba(218,231,252,.56);}
  .login-card--landing .role-toggle button.active{background:#fff;color:#2674f5;}
  .login-card--landing .field label{color:#536b91;}
  .login-card--landing .field-input{border-color:#d8e4f7;border-radius:10px;background:rgba(255,255,255,.72);}
  .login-card--landing .btn-primary{border-radius:999px;background:linear-gradient(100deg,#3882fa,#2168e9);}
  .login-back{margin:0 0 14px;padding:0;border:0;background:transparent;color:#5576aa;font:600 11px Inter,sans-serif;cursor:pointer;}
  :root[data-appearance="dark"] .login-experience{color:#e5edff;background:#111d31;}
  :root[data-appearance="dark"] .login-left{background:radial-gradient(ellipse at 4% 0%,rgba(65,118,213,.19),transparent 31%),linear-gradient(135deg,#16243a,#1b2b43 54%,#17243a);}
  :root[data-appearance="dark"] .login-panel{border-color:rgba(194,214,255,.15);background:rgba(24,40,64,.72);}
  :root[data-appearance="dark"] .login-brand-name,:root[data-appearance="dark"] .login-panel-heading h1,:root[data-appearance="dark"] .login-role-name,:root[data-appearance="dark"] .login-card--landing .login-title{color:#e8f0ff;}
  :root[data-appearance="dark"] .login-brand-tagline,:root[data-appearance="dark"] .login-panel-heading p,:root[data-appearance="dark"] .login-role-description,:root[data-appearance="dark"] .login-card--landing p{color:#aabbd7;}
  :root[data-appearance="dark"] .login-role-card{border-color:rgba(193,213,255,.17);background:rgba(34,53,82,.72);}
  :root[data-appearance="dark"] .login-role-card.is-active{border-color:#5791ff;}
  :root[data-appearance="dark"] .login-role-button{border-color:#729be0;color:#c1d5ff;}
  :root[data-appearance="dark"] .login-security,:root[data-appearance="dark"] .login-theme,:root[data-appearance="dark"] .login-store{color:#b9c9e5;}
  :root[data-appearance="dark"] .login-security small,:root[data-appearance="dark"] .login-store-meta{color:#93a8ca;}
  :root[data-appearance="dark"] .login-showcase{background:linear-gradient(180deg,rgba(27,42,64,.9),rgba(29,51,81,.76));}
  :root[data-appearance="dark"] .login-showcase-art{opacity:.16;}
  :root[data-appearance="dark"] .login-showcase-copy h2,:root[data-appearance="dark"] .login-feature strong{color:#e0ebff;}
  :root[data-appearance="dark"] .login-feature small{color:#adbfdd;}
  :root[data-appearance="dark"] .login-card--landing .field label{color:#bdcce5;}
  :root[data-appearance="dark"] .login-card--landing .field-input{border-color:rgba(193,213,255,.22);background:rgba(14,27,47,.62);color:#f0f5ff;}
  .blue-workspace-shell .sidebar{border-right-color:#dce8fa;background:linear-gradient(180deg,#f6f9ff,#edf4ff 82%,#f8fbff);color:#29436d;}
  .blue-workspace-shell .brand-mark{color:#102c60;}
  .blue-workspace-shell .nav-item{color:#496385;}
  .blue-workspace-shell .nav-item:hover,.blue-workspace-shell .nav-item.active{background:#dceaff;color:#174c9f;}
  .blue-workspace-shell .nav-item.active{border-left-color:#347cf3;}

  const abbreviated=(abs/(isCrore?10000000:100000)).toFixed(2).replace(/\.?0+$/,'');

  const tone = dark ? {'--ink':'#eef2f8','--ink-soft':'#aab5c5','--line':'rgba(226,234,248,.15)','--moss':'#8bd5b0','--moss-bg':'rgba(84,190,143,.16)','--stamp':'#ff9b94','--stamp-bg':'rgba(255,110,110,.16)','--status-success':'#8bd5b0','--status-success-bg':'rgba(84,190,143,.16)','--status-info':'#8fc4f4','--status-info-bg':'rgba(72,137,205,.18)','--status-warning':'#f4bd73','--status-warning-bg':'rgba(224,145,54,.18)','--status-danger':'#ff9b94','--status-danger-bg':'rgba(255,110,110,.16)','--status-neutral':'#b7c0cc','--status-neutral-bg':'rgba(183,192,204,.14)'} : {'--ink':'#211D18','--ink-soft':'#6B6357','--line':'#D8D0C0','--moss':'#5B7553','--moss-bg':'#E7EBDF','--stamp':'#A63D33','--stamp-bg':'#F3E1DD','--status-success':'#3F7A52','--status-success-bg':'#E5F0E7','--status-info':'#2D6596','--status-info-bg':'#E6EFF7','--status-warning':'#A8641F','--status-warning-bg':'#F8EBDD','--status-danger':'#A33D35','--status-danger-bg':'#F5E1DE','--status-neutral':'#6B7078','--status-neutral-bg':'#ECEDEF'};
  Object.entries(tone).forEach(([key,value])=>document.documentElement.style.setProperty(key,value));
  // Our CSS uses fixed px sizes throughout (deliberately, for print/receipt
  // consistency), so changing the root font-size alone has no visible
  // effect. `zoom` scales the whole rendered page instead — reliable here
  // since this app only ever runs in Chromium/Electron.
  const zoomLevel = { sm: '0.88', md: '1', lg: '1.18' }[s.uiFontSize] || '1';
  if(document.body.style.zoom !== zoomLevel) document.body.style.zoom = zoomLevel;
  if(s.accentColor){
    document.documentElement.style.setProperty('--brass', s.accentColor);
    document.documentElement.style.setProperty('--brass-ink', dark ? lightenHex(s.accentColor, 0.25) : darkenHex(s.accentColor, 0.3));
    document.documentElement.style.setProperty('--brass-bg', dark ? darkenHex(s.accentColor, 0.62) : lightenHex(s.accentColor, 0.85));
  }
}

function darkenHex(hex, amount){
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, Math.round(((n>>16)&255) * (1-amount)));
  const g = Math.max(0, Math.round(((n>>8)&255) * (1-amount)));
  const b = Math.max(0, Math.round((n&255) * (1-amount)));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lightenHex(hex, amount){
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.round(((n>>16)&255) + (255-((n>>16)&255))*amount));
  const g = Math.min(255, Math.round(((n>>8)&255) + (255-((n>>8)&255))*amount));
  const b = Math.min(255, Math.round((n&255) + (255-(n&255))*amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ============ API ============ */
async function api(method, url, body){
  const opts = { method, credentials: 'same-origin' };
  if(body !== undefined){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  let res;
  try{
    res = await fetch(url, opts);
  }catch(e){
    throw new Error('Could not reach the local server — make sure it is running.');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    if(data) Object.assign(err, data);
    throw err;
  }
  return data;
}

function formatCopilotText(text){
  const safe = escapeHtml(text || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const lines = safe.split(/\r?\n/); let html = ''; let inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  lines.forEach(line => {
    const trimmed = line.trim();
    if(!trimmed){ closeList(); return; }
    const bullet = trimmed.match(/^[-*]\s+(.+)/);
    if(bullet){ if(!inList){ html += '<ul>'; inList = true; } html += `<li>${bullet[1]}</li>`; return; }
    closeList(); html += `<p>${trimmed}</p>`;
  });
  closeList(); return html || '<p>No explanation was returned.</p>';
}
function copilotTone(message){
  if(!message || !message.success) return 'neutral';
  const data = message.data || {};
  if(message.intent === 'LOW_STOCK' && (data.products || []).some(p => p.status === 'critical')) return 'danger';
  if(message.intent === 'BUSINESS_FOCUS' && (data.alerts || []).some(a => a.type === 'Attention')) return 'danger';
  if(['LOW_MARGIN_PRODUCTS','SLOW_MOVING_PRODUCTS','EXPENSE_SUMMARY','RESTOCK_RECOMMENDATIONS'].includes(message.intent)) return 'warning';
  if(['TOP_PRODUCTS','SALES_SUMMARY','SALES_COMPARISON'].includes(message.intent)) return 'success';
  return 'info';
}
function copilotErrorMessage(error){
  if(error?.code === 'OLLAMA_UNAVAILABLE') return 'SmartRetail AI is currently offline. Start Ollama to continue.';
  if(error?.code === 'OLLAMA_TIMEOUT') return 'The analysis is taking longer than expected. Please try again.';
  if(error?.code === 'UNKNOWN') return 'I currently specialize in SmartRetail business analysis. Try asking about sales, products, inventory, profit, or expenses.';
  return error?.message || 'SmartRetail AI could not complete that analysis. Please try again.';
}

/* ============ MATCHING ============ */
function findMatch(extracted){
  if(!extracted) return null;
  if(extracted.code){
    const c = String(extracted.code).trim().toLowerCase();
    const byCode = state.inventory.find(it => it.code && String(it.code).trim().toLowerCase() === c);
    if(byCode) return byCode;
  }
  const name = normalize(extracted.name);
  if(!name) return null;
  let exact = state.inventory.find(it => normalize(it.name) === name);
  if(exact) return exact;
  const words = name.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  state.inventory.forEach(it => {
    const itWords = normalize(it.name).split(' ').filter(Boolean);
    if(!itWords.length) return;
    const overlap = words.filter(w => itWords.includes(w)).length;
    const score = overlap / Math.max(words.length, itWords.length);
    if(score > bestScore){ bestScore = score; best = it; }
  });
  return bestScore >= 0.5 ? best : null;
}

/* ============ CART / CHECKOUT ============ */
function effectiveMaxStock(invId){
  const inv = state.inventory.find(it => it.id === invId);
  const base = inv ? Number(inv.quantity||0) : 0;
  // While editing a past bill, the original line's stock was already
  // deducted — so it's available again for this same edit.
  const original = state.editingSaleId && state.editingSaleOriginal ? (state.editingSaleOriginal[invId] || 0) : 0;
  return base + original;
}
function addToCart(item, qty=1){
  const line = state.cart.find(c => c.invId === item.id);
  const stock = effectiveMaxStock(item.id);
  if(line){
    line.qty = Math.min(line.qty + qty, Math.max(stock, line.qty));
  }else{
    state.cart.push({ invId: item.id, name: item.name, price: item.price, qty: Math.min(qty, Math.max(stock,1)) });
  }
  render();
}
function changeCartQty(invId, delta){
  const line = state.cart.find(c => c.invId === invId);
  if(!line) return;
  const max = effectiveMaxStock(invId) || 999;
  line.qty = Math.max(1, Math.min(max, line.qty + delta));
  render();
}
function removeCartLine(invId){
  state.cart = state.cart.filter(c => c.invId !== invId);
  render();
}
function resetCheckout(){
  state.checkout = { discountMode: 'none', discountValue: 0, paymentMethod: 'cash', amountPaid: 0, customerName: '', customerPhone: '', customerAddress: '', managerPassword: '' };
  state.managerApprovalNeeded = null;
}
function cartSubtotal(){ return roundMoney(state.cart.reduce((s,c)=> s + c.price*c.qty, 0)); }
function checkoutPreview(){
  const subtotal = cartSubtotal();
  const { discountMode, discountValue } = state.checkout;
  let discountAmount = 0, total = subtotal;
  if(discountMode === 'percent'){
    discountAmount = roundMoney(subtotal * (Number(discountValue||0)/100));
    total = roundMoney(subtotal - discountAmount);
  }else if(discountMode === 'finalPrice'){
    total = roundMoney(Math.max(0, Math.min(Number(discountValue||0), subtotal)));
    discountAmount = roundMoney(subtotal - total);
  }
  const discountPercent = subtotal > 0 ? roundMoney((discountAmount/subtotal)*100) : 0;
  return { subtotal, discountAmount, discountPercent, total };
}
async function completeSale(){
  if(!state.cart.length) return;
  const { discountMode, discountValue, paymentMethod, amountPaid, customerName, customerPhone, customerAddress, managerPassword } = state.checkout;
  const payload = {
    items: state.cart.map(c => ({ invId: c.invId, qty: c.qty })),
    discountMode, discountValue: Number(discountValue)||0,
    paymentMethod,
    amountPaid: paymentMethod === 'due' ? Number(amountPaid)||0 : undefined,
    customerName: customerName || '',
    customerPhone: sanitizePhone(customerPhone),
    customerAddress: customerAddress || '',
    managerPassword: managerPassword || undefined,
  };
  try{
    const isEdit = !!state.editingSaleId;
    const sale = isEdit
      ? await api('PUT', `/api/sales/${state.editingSaleId}`, payload)
      : await api('POST', '/api/sales', payload);
    await refreshInventory();
    await refreshSales();
    state.cart = [];
    resetCheckout();
    if(isEdit){
      state.editingSaleId = null;
      state.editingSaleOriginal = null;
      state.view = 'history';
      state.expandedSale = sale.id;
      showToast('Bill updated');
    }else{
      state.lastSale = sale;
      state.view = 'receipt';
    }
    render();
  }catch(e){
    if(e.code === 'MANAGER_APPROVAL_REQUIRED'){
      state.managerApprovalNeeded = { message: e.message, maxAllowed: e.maxAllowed, requestedPercent: e.requestedPercent };
      render();
      return;
    }
    showToast(e.message); render();
  }
}

function handleBarcodeEnter(raw){
  const q = normalize(raw);
  if(!q) return;
  const byCode = state.inventory.find(it => it.code && normalize(it.code) === q);
  if(byCode){
    if(Number(byCode.quantity||0) <= 0){ showToast(`${byCode.name} is out of stock`); }
    else{ addToCart(byCode, 1); showToast(`Added ${byCode.name}`); }
    state.invSearch = ''; render();
    document.getElementById('sale-search')?.focus();
    return;
  }
  const results = state.inventory.filter(i => normalize(i.name).includes(q) || (i.code && normalize(i.code).includes(q)));
  if(results.length === 1){
    if(Number(results[0].quantity||0) <= 0){ showToast(`${results[0].name} is out of stock`); }
    else{ addToCart(results[0], 1); showToast(`Added ${results[0].name}`); }
    state.invSearch = ''; render();
    document.getElementById('sale-search')?.focus();
    return;
  }
  if(results.length === 0) showToast(`No item matches "${raw}"`);
}

/* ============ SCAN / IMAGE UPLOAD FLOW ============ */
function triggerUpload(target){
  uploadTarget = target;
  document.getElementById('file-input').click();
}
function fileToResizedBase64(file, maxDim=1100){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if(width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ base64: canvas.toDataURL('image/jpeg', 0.85).split(',')[1], previewSrc: canvas.toDataURL('image/jpeg', 0.7) });
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const target = uploadTarget;

  if(target === 'background'){
    try{
      const { previewSrc } = await fileToResizedBase64(file, 1400);
      if(!state.homeDraft) state.homeDraft = { backgroundImages: [] };
      if(!state.homeDraft.backgroundImages) state.homeDraft.backgroundImages = [];
      if(state.homeDraft.backgroundImages.length >= 8){ showToast('Up to 8 photos — remove one to add another'); return; }
      state.homeDraft.backgroundImages.push(previewSrc);
      render();
    }catch(err){ showToast("Couldn't read that image"); }
    return;
  }
  if(target === 'inventory-image'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 700); state.inventoryImageDraft=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that image"); }
    return;
  }
  if(target === 'store-logo'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 500); if(!state.homeDraft) state.homeDraft={}; state.homeDraft.storeLogo=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that logo"); }
    return;
  }
  if(target === 'settings-logo'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 500); state.settingsLogoDraft=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that logo"); }
    return;
  }

  try{
    const { base64, previewSrc } = await fileToResizedBase64(file);
    state.scanning = { for: target, previewSrc };
    render();
    const result = target === 'bill'
      ? await api('POST', '/api/vision/bill', { imageBase64: base64 })
      : await api('POST', '/api/vision/tag', { imageBase64: base64 });
    state.scanning = null;
    if(target === 'bill'){
      const margin = state.settings.defaultMarginPercent;
      const rows = (result.items || []).map(it => {
        const cost = it.price ?? 0;
        return { name: it.name || '', quantity: it.quantity ?? 1, cost, margin, sell: sellFromMargin(cost, margin), code: it.code ?? null, category: it.category || '' };
      });
      if(!rows.length){ showToast('No items recognized in that photo — try a clearer shot'); render(); return; }
      state.billReview = rows;
      render();
    }else{
      const extracted = { name: result.name || '', price: result.price ?? 0, code: result.code ?? null };
      const match = findMatch(extracted);
      if(match){
        if(Number(match.quantity||0) <= 0){ showToast(`${match.name} is out of stock`); }
        else{ addToCart(match, 1); showToast(`Added ${match.name}`); }
        state.unmatched = null;
      }else{
        state.unmatched = extracted;
      }
      render();
    }
  }catch(err){
    console.error(err);
    state.scanning = null;
    showToast(err.message || "Couldn't read that image — try again with better light/focus");
    render();
  }
});

    else if(state.view === 'inventory') parts.push(renderInventory());
    else if(state.view === 'sale') parts.push(renderSale());
    else if(state.view === 'receipt') parts.push(renderReceipt());
    else if(state.view === 'return-receipt') parts.push(renderReturnReceipt());

function renderLoginCard(opts){
  const { message, cancellable, allowEmployee = true, fullPage = false, landing = false } = opts || {};
  const showToggle = allowEmployee && state.adminConfigured; // can't offer "employee" before an admin account even exists
  const asEmployee = showToggle && state.loginRole === 'employee';
  const title = asEmployee ? 'Employee login' : (state.adminConfigured ? 'Admin login' : 'Set up admin access');
  const sub = asEmployee
    ? 'Enter your username and password.'
    : (state.adminConfigured
      ? 'Enter the admin password to continue.'
      : 'Choose a password to protect cost prices, sales reports, and settings — you\'ll enter it whenever you want to manage those.');
  const card = `
    <div class="card login-card${landing ? ' login-card--landing' : ''}">
      <div class="card-body">
        ${landing ? `<button class="login-back" data-action="cancel-login">← Back to roles</button>` : ''}
        <div class="login-badge">${ic.lock}</div>
        ${state.settings.shopName ? `<div class="login-shopname">${escapeHtml(state.settings.shopName)}</div>` : ''}
        <div class="login-title">${title}</div>
        ${showToggle ? `
          <div class="role-toggle">
            <button data-action="login-role" data-role="admin" class="${state.loginRole==='admin'?'active':''}">${ic.lock} Admin</button>
            <button data-action="login-role" data-role="employee" class="${state.loginRole==='employee'?'active':''}">${ic.badge} Employee</button>
          </div>` : ''}
        <p>${escapeHtml(landing ? sub : (message || sub))}</p>
        ${asEmployee ? `<div class="field"><label>Username</label><input class="field-input" id="login-username" placeholder="e.g. priya" autocomplete="username"></div>` : ''}
        <div class="field">
          <label>${asEmployee ? 'Password' : (state.adminConfigured ? 'Password' : 'Choose a password')}</label>
          <input class="field-input" type="password" id="login-password" placeholder="••••••" autocomplete="current-password">
        </div>
        ${state.loginError ? `<div style="color:var(--stamp); font-size:12.5px; margin-bottom:10px;">${escapeHtml(state.loginError)}</div>` : ''}
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" style="flex:1; justify-content:center;" data-action="submit-login">${ic.check} ${asEmployee ? 'Log in' : (state.adminConfigured ? 'Log in' : 'Set password')}</button>
          ${cancellable ? `<button class="btn btn-outline" data-action="cancel-login">Cancel</button>` : ''}

  return fullPage ? `<div class="login-page-wrap">${card}</div>` : card;
}

/* ============ RENDER: BUSINESS INTELLIGENCE ============ */
function analyticsCompactMoney(n){
  const value=Number(n)||0, abs=Math.abs(value), symbol=state.settings.currencySymbol||'₹';
  if(abs>=10000000) return `${symbol}${(value/10000000).toFixed(2)}Cr`;
  if(abs>=100000) return `${symbol}${(value/100000).toFixed(2)}L`;
  if(abs>=1000) return `${symbol}${(value/1000).toFixed(2)}K`;
  return fmt(value);
}
function renderAnalyticsSalesComparison(analytics){
  const period=analytics.period, previous=analytics.previous;
  const start=Number(period?.start), end=Number(period?.end), previousStart=Number(previous?.start);
  if(!Number.isFinite(start)||!Number.isFinite(end)||!Number.isFinite(previousStart)||end<=start) return '';
  const now=Date.now(), active=now>=start&&now<end, currentEnd=active?now:end;
  const duration=Math.max(1,currentEnd-start), isHourly=Number(period.duration||end-start)<=86400000;
  const step=isHourly?3600000:Math.max(86400000,Math.ceil(duration/Math.min(28,Math.max(1,Math.ceil(duration/86400000)))));
  const count=isHourly?24:Math.max(1,Math.ceil(duration/step)), comparisonEnd=previousStart+duration;
  const values=(rangeStart,rangeEnd)=>state.sales.reduce((total,sale)=>{
    const timestamp=Number(sale.timestamp);
    return Number.isFinite(timestamp)&&timestamp>=rangeStart&&timestamp<rangeEnd?total+saleNet(sale):total;
  },0);
  const points=Array.from({length:count},(_,index)=>{
    const offset=index*step, currentStart=start+offset, priorBucketStart=previousStart+offset;
    const pointStart=currentStart, pointEnd=Math.min(currentStart+step,currentEnd);
    const priorEnd=Math.min(priorBucketStart+step,comparisonEnd);
    const pointDate=new Date(pointStart);
    const label=isHourly
      ? pointDate.toLocaleTimeString([],{hour:'numeric'})
      : pointDate.toLocaleDateString([],{day:'numeric',month:'short'});
    return {
      label,
      current:pointStart<currentEnd?values(pointStart,pointEnd):null,
      previous:priorBucketStart<comparisonEnd?values(priorBucketStart,priorEnd):null,
    };
  });
  const observed=points.flatMap(point=>[point.current,point.previous]).filter(value=>value!==null);
  const max=Math.max(1,...observed), width=Math.max(660,Math.min(1000,count*27+120)), height=260;
  const left=66,right=18,top=20,bottom=52,plotWidth=width-left-right,plotHeight=height-top-bottom;
  const x=index=>left+(count===1?plotWidth/2:index*plotWidth/(count-1));
  const y=value=>top+plotHeight-(value/max)*plotHeight;
  const pathFor=key=>{
    let started=false;
    return points.map((point,index)=>{
      const value=point[key];
      if(value===null){started=false;return '';}
      const command=started?'L':'M'; started=true;
      return `${command}${x(index).toFixed(1)},${y(value).toFixed(1)}`;
    }).join(' ');
  };
  const pointMarkup=key=>points.map((point,index)=>{
    const value=point[key];
    if(value===null)return '';
    const tone=key==='current'?'current':'previous';
    return `<circle class="bi-chart-point-${tone}" cx="${x(index).toFixed(1)}" cy="${y(value).toFixed(1)}" r="3.5"><title>${key==='current'?'Selected period':'Previous period'} · ${escapeHtml(point.label)}: ${escapeHtml(fmt(value))}</title></circle>`;
  }).join('');
  const tickStep=Math.max(1,Math.ceil(count/8));
  const ticks=points.map((point,index)=>{
    if(index%tickStep!==0&&index!==count-1)return '';
    return `<text class="bi-chart-axis-label" x="${x(index).toFixed(1)}" y="${height-20}" text-anchor="middle">${escapeHtml(point.label)}</text>`;

function analyticsKpiCard(label, metric, icon, variant, compact=false, periodNote='Net sales after returns · selected analysis period'){

function dashboardRange(period){
  const now=new Date(); const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(period==='today') return {start:startToday,end:startToday+86400000,label:'Today'};
  if(period==='week'){ const d=new Date(startToday); const day=d.getDay()||7; const start=startToday-(day-1)*86400000; return {start,end:start+7*86400000,label:'This week'}; }
  if(period==='lastMonth'){ const start=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(); return {start,end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'}; }
  if(period==='custom'){ const start=new Date(state.dashboardStart).getTime(), end=new Date(state.dashboardEnd).getTime(); if(Number.isFinite(start)&&Number.isFinite(end)&&end>=start) return {start,end:end+1,label:'Custom'}; return null; }
  return {start:new Date(now.getFullYear(),now.getMonth(),1).getTime(),end:new Date(now.getFullYear(),now.getMonth()+1,1).getTime(),label:'This month'};
}
function dashboardExpenseTotal(start,end){ return state.expenses.filter(e=>{const t=Date.parse(`${e.date}T00:00:00`);return t>=start&&t<end;}).reduce((n,e)=>n+Number(e.amount||0),0); }

function saleCogsNet(sale){ const base=(sale.items||[]).reduce((n,i)=>n+Number(i.costPriceAtSale||0)*Number(i.qty||0),0); const returned=(sale.returns||[]).reduce((n,r)=>n+(r.items||[]).reduce((x,i)=>{const line=(sale.items||[]).find(l=>l.id===i.id);return x+(line?Number(line.costPriceAtSale||0)*Number(i.qty||0):0)},0),0); return base-returned; }
function saleReturns(sale){ return (sale.returns||[]).reduce((n,r)=>n+Number(r.refundAmount||0),0); }
function saleGrossProfitNet(sale){ return saleRevenue(sale)-saleCogsNet(sale)-saleReturns(sale); }
function dashboardPeriodSales(start,end){ return state.sales.filter(s=>Number(s.timestamp)>=start&&Number(s.timestamp)<end); }
function dashboardKpis(start,end){ const rows=dashboardPeriodSales(start,end); const revenue=rows.reduce((n,s)=>n+saleRevenue(s),0), cogs=rows.reduce((n,s)=>n+saleCogsNet(s),0), returns=rows.reduce((n,s)=>n+saleReturns(s),0), grossProfit=revenue-cogs-returns, expenses=dashboardExpenseTotal(start,end); return {rows,revenue,cogs,returns,grossProfit,expenses,netProfit:grossProfit-expenses,netSales:rows.reduce((n,s)=>n+saleNet(s),0)}; }

function saleProfitNet(sale){ const base=(sale.items||[]).reduce((n,i)=>n+Number(i.lineProfit||0),0); const returned=(sale.returns||[]).reduce((n,r)=>n+(r.items||[]).reduce((x,i)=>{const line=(sale.items||[]).find(l=>l.id===i.id);return x+(line?Number(line.lineProfit||0)/Math.max(1,Number(line.qty||1))*Number(i.qty||0):0)},0),0); return base-returned; }

function renderDashboardLegacy(){
  const inv = state.inventory;

  const best=Object.values(sold).sort((a,b)=>b.qty-a.qty)[0];
  const oldest=inv.slice().sort((a,b)=>Number(a.createdAt||0)-Number(b.createdAt||0))[0];

  for(let i=13;i>=0;i--){ const d=new Date(end); d.setDate(end.getDate()-i); const start=new Date(d); start.setHours(0,0,0,0); const finish=new Date(d); finish.setHours(23,59,59,999); days.push({date:d,amount:sumSalesBetween(start.getTime(),finish.getTime())}); }
  const max=Math.max(1,...days.map(d=>d.amount)); const total=days.reduce((n,d)=>n+d.amount,0); const width=760, height=250, base=183, chartH=145, left=42, slot=50;
  const bars=days.map((d,i)=>{ const h=Math.max(0,(d.amount/max)*chartH); const x=left+i*slot; const y=base-h; const label=d.date.toLocaleDateString([], {day:'2-digit',month:'short'}); return `<g><title>${label}: ${fmt(d.amount)}</title><rect x="${x}" y="${y.toFixed(1)}" width="32" height="${h.toFixed(1)}" rx="4" fill="var(--brass)" opacity="${d.amount?'0.9':'0.22'}"></rect><text x="${x+16}" y="205" text-anchor="middle" font-size="10" fill="var(--ink-soft)">${label}</text></g>`; }).join('');
  return `<div class="card" style="margin-bottom:16px"><div class="card-head"><div><h3>Sales trend · last 14 days</h3><div style="font-size:12px;color:var(--ink-soft);margin-top:3px">Daily net sales after returns · ${fmt(total)} total</div></div><span class="stat-flag ${total?'flag-ok':'flag-warn'}">${total?'watch the trend':'no sales recorded yet'}</span></div><div class="card-body" style="overflow-x:auto"><svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Sales trend bar chart" style="display:block;width:100%;min-width:620px;height:250px"><line x1="${left-8}" y1="${base}" x2="${width-12}" y2="${base}" stroke="var(--line)"/><line x1="${left-8}" y1="${base-chartH}" x2="${width-12}" y2="${base-chartH}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="8" y="${base+4}" font-size="10" fill="var(--ink-soft)">0</text><text x="2" y="${base-chartH+4}" font-size="10" fill="var(--ink-soft)">${fmt(max)}</text>${bars}</svg></div></div>`;
}

function localDateTimeValue(date){ const p=n=>String(n).padStart(2,'0'); return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`; }
function saleNet(sale){ return Number(sale.netTotal ?? (Number(sale.total||0)-(sale.returns||[]).reduce((n,r)=>n+Number(r.refundAmount||0),0))); }
function sumSalesBetween(start,end){ return state.sales.filter(s=>Number(s.timestamp)>=start&&Number(s.timestamp)<=end).reduce((n,s)=>n+saleNet(s),0); }
function comparisonMarkup(title,current,previous,label){ const change=current-previous; const pct=previous ? change/previous*100 : (current?100:0); const tone=change>=0?'var(--moss)':'var(--stamp)'; return `<div class="insight-card"><div class="mono" style="font-size:11px">${title}</div><div style="font-size:22px;font-weight:700;margin-top:4px">${fmt(current)}</div><div style="font-size:12px;color:${tone};margin-top:5px">${change>=0?'▲':'▼'} ${fmt(Math.abs(change))} · ${Math.abs(pct).toFixed(1)}% vs ${label}</div></div>`; }
function renderPeriodComparison(points){
  const rows=points.map(point=>{
    const current=Number(point.current)||0, previous=Number(point.previous)||0, change=current-previous;
    const hasBaseline=previous!==0, percentage=hasBaseline?change/Math.abs(previous)*100:0, direction=change>0?'up':change<0?'down':'flat';
    return `<div class="period-comparison-row"><div class="period-comparison-values"><strong>${escapeHtml(point.label)}</strong><span>Current ${fmt(current)} · Previous ${fmt(previous)}</span></div>${hasBaseline?periodChangeIndicator(percentage,direction,'vs prior period'):'<span class="period-change-label is-none">No prior data</span>'}</div>`;
  }).join('');
  return `<div class="period-comparison-list" aria-label="Sales by period compared with prior periods">${rows}</div>`;
}
function renderSalesPerformance(){
  const now=new Date(); const monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime(); const nextMonth=new Date(now.getFullYear(),now.getMonth()+1,1).getTime()-1; const priorMonthStart=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(); const priorMonthEnd=monthStart-1;
  const yearStart=new Date(now.getFullYear(),0,1).getTime(); const nextYear=new Date(now.getFullYear()+1,0,1).getTime()-1; const priorYearStart=new Date(now.getFullYear()-1,0,1).getTime(); const priorYearEnd=yearStart-1;
  const fallbackStart=localDateTimeValue(new Date(monthStart)); const fallbackEnd=localDateTimeValue(now);
  const startRaw=state.dashboardStart||fallbackStart, endRaw=state.dashboardEnd||fallbackEnd; const start=new Date(startRaw).getTime(), end=new Date(endRaw).getTime();
  const valid=Number.isFinite(start)&&Number.isFinite(end)&&end>=start; const duration=valid?end-start:0; const customCurrent=valid?sumSalesBetween(start,end):0; const customPrevious=valid?sumSalesBetween(start-duration-1,start-1):0;
  const points=[{label:'Month',current:sumSalesBetween(monthStart,nextMonth),previous:sumSalesBetween(priorMonthStart,priorMonthEnd)},{label:'Year',current:sumSalesBetween(yearStart,nextYear),previous:sumSalesBetween(priorYearStart,priorYearEnd)}]; if(valid) points.push({label:'Custom',current:customCurrent,previous:customPrevious});
  return `<div class="card" style="margin-bottom:16px"><div class="card-head"><div><h3>Sales performance</h3><div style="font-size:12px;color:var(--ink-soft);margin-top:3px">Net sales compared with the prior month and year.</div></div></div><div class="card-body">${renderPeriodComparison(points)}<div style="border-top:1px solid var(--line);padding-top:16px"><div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px">CUSTOM DATE & TIME COMPARISON</div><div class="field-row"><div class="field"><label>From</label><input class="field-input" id="dashboard-start" type="datetime-local" value="${escapeHtml(startRaw)}"></div><div class="field"><label>To</label><input class="field-input" id="dashboard-end" type="datetime-local" value="${escapeHtml(endRaw)}"></div></div>${valid?`<div class="period-comparison-context"><span>Selected ${fmt(customCurrent)} · Previous ${fmt(customPrevious)}</span>${customPrevious?periodChangeIndicator((customCurrent-customPrevious)/Math.abs(customPrevious)*100,customCurrent>customPrevious?'up':customCurrent<customPrevious?'down':'flat','vs prior period'):'<span class="period-change-label is-none">No prior data</span>'}</div>`:`<div class="banner banner-warn">Choose an end date/time after the start date/time.</div>`}</div></div></div>`;
}

function renderFrequentProducts(){

function renderCheckoutSummary(){

/* ============ RENDER: HISTORY ============ */
function returnedQtyByItemClient(sale){
  const map = {};
  (sale.returns || []).forEach(r => r.items.forEach(i => { map[i.id] = (map[i.id]||0) + i.qty; }));
  return map;
}
function renderHistory(){
  if(!state.isStaff){
    return `
      <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">Staff login required.</div></div></div>
      ${renderLoginCard({ message: 'Log in to view sales history — cost and profit figures are admin-only.', allowEmployee: true, fullPage: true })}`;
  }
  if(!state.sales.length){
    return `
      <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">Every completed sale, kept here.</div></div></div>
      <div class="card"><div class="empty">
        ${ic.receipt}
        <div class="empty-title" style="margin-top:10px;">No sales yet</div>
        <p>Completed sales will show up here with a full breakdown.</p>
        <button class="btn btn-primary" data-nav="sale">${ic.scan} Start a sale</button>
      </div></div>`;
  }

  const todayKey = new Date().toDateString();
  const todaySales = state.sales.filter(s => new Date(s.timestamp).toDateString() === todayKey);
  const todayRows = [];
  todaySales.forEach(s => (s.items||[]).forEach(line => {
    const returned=(s.returns||[]).reduce((n,r)=>n+(r.items||[]).filter(i=>i.id===line.id).reduce((x,i)=>x+Number(i.qty||0),0),0);
    todayRows.push({
      timestamp: s.timestamp,
      customerName: s.customerName || '—',
      itemName: line.name,
      qty: Math.max(0, line.qty-returned),
      amount: Math.max(0,(line.lineTotal ?? line.price*line.qty) - (line.lineTotal ?? line.price*line.qty)/line.qty*returned),
      profit: Math.max(0, Number(line.lineProfit || 0) - (Number(line.lineProfit || 0) / Math.max(1, Number(line.qty || 1))) * returned),
    });
  }));
  todayRows.sort((a,b) => b.timestamp - a.timestamp);
  const todayProfit = todayRows.reduce((s,r)=>s+r.profit,0);
  const totalDue = state.sales.reduce((s,i)=> s + (i.amountDue||0), 0);

  const hq = normalize(state.historySearch);
  const visibleSales = state.sales.filter(s => {
    const dateKey = localDateInputValue(new Date(s.timestamp));
    const textMatches = !hq || normalize(s.customerName).includes(hq) || normalize(s.customerPhone).includes(hq) || normalize(s.id).includes(hq) || (s.items||[]).some(i => normalize(i.name).includes(hq) || normalize(i.id).includes(hq));
    const dateMatches = (!state.historyDateStart || dateKey >= state.historyDateStart) && (!state.historyDateEnd || dateKey <= state.historyDateEnd);
    const paymentMatches = !state.historyPayment || String(s.paymentMethod || '').toLowerCase() === state.historyPayment;
    return textMatches && dateMatches && paymentMatches;
  });

  return `
    <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">${state.sales.length} sale${state.sales.length===1?'':'s'} recorded.</div></div>${state.isAdmin?'<button class="btn btn-outline" data-action="export-csv" data-kind="sales">Export sales CSV</button>':''}</div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Today's Sales</h3>${state.isAdmin ? `<span class="mono" style="font-size:12px; color:var(--ink-soft);">Profit ${fmtOrDash(todayProfit)}</span>` : ''}</div>
      <div class="card-body" style="overflow-x:auto;">
        ${todayRows.length ? `
        <table>
          <thead><tr><th>Time</th><th>Customer Name</th><th>Item</th><th>Quantity</th><th>Amount</th>${state.isAdmin ? '<th>Profit</th>' : ''}</tr></thead>
          <tbody>
            ${todayRows.map(r => `<tr>
              <td class="mono" style="font-size:12px;">${new Date(r.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
              <td>${escapeHtml(r.customerName)}</td>
              <td>${escapeHtml(r.itemName)}</td>
              <td class="qty-badge">${r.qty}</td>
              <td class="mono">${fmt(r.amount)}</td>
              ${state.isAdmin ? `<td class="mono" style="color:var(--moss);">${fmt(r.profit)}</td>` : ''}
            </tr>`).join('')}
          </tbody>
        </table>` : `<div style="color:var(--ink-soft); font-size:13.5px;">No sales yet today.</div>`}
      </div>
    </div>

    ${totalDue > 0 ? `<div class="banner banner-warn"><span class="mono" style="font-weight:600;">${fmt(totalDue)}</span><span>&nbsp;total outstanding — see <a href="#" data-nav="customers" style="color:inherit; text-decoration:underline;">Customers</a> for who owes what.</span></div>` : ''}

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>All sales <span class="action-note" style="display:inline-block;margin-left:6px;">${visibleSales.length} shown</span></h3><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;"><input class="search-input" id="history-search" style="width:220px;" placeholder="Search customer, receipt, or item…" value="${escapeHtml(state.historySearch)}"><input class="field-input" id="history-start" type="date" aria-label="Sales from date" value="${escapeHtml(state.historyDateStart)}" style="width:145px;"><input class="field-input" id="history-end" type="date" aria-label="Sales to date" value="${escapeHtml(state.historyDateEnd)}" style="width:145px;"><select class="field-input" id="history-payment" aria-label="Payment method" style="width:120px;"><option value="">All payments</option><option value="cash" ${state.historyPayment==='cash'?'selected':''}>Cash</option><option value="upi" ${state.historyPayment==='upi'?'selected':''}>UPI</option><option value="card" ${state.historyPayment==='card'?'selected':''}>Card</option><option value="due" ${state.historyPayment==='due'?'selected':''}>Due</option></select>${(state.historySearch||state.historyDateStart||state.historyDateEnd||state.historyPayment)?'<button class="btn btn-ghost btn-sm" data-action="clear-history-filters">Clear</button>':''}</div></div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Customer Name</th><th>Receipt ID</th><th>Items</th><th>Payment</th><th>Net amount</th></tr></thead>
          <tbody>
            ${visibleSales.map(s => renderHistoryRow(s)).join('') || `<tr><td colspan="7" style="color:var(--ink-soft);">No sales match the selected filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    ${renderDiscountApprovalsCard()}`;

    <div class="card"><div class="card-head"><div><h3>Profitability insights</h3><div class="action-note">Rules-based analysis · no predictive AI</div></div></div><div class="card-body"><div class="expense-insight-grid"><div class="expense-insight bi-tone-${healthTone}"><div class="expense-insight-title"><span class="bi-status-badge">${healthTitle}</span></div><div class="expense-signal-copy" style="margin-top:8px">${healthCopy}</div></div>${lossProducts.length?`<div class="expense-insight bi-tone-danger"><div class="expense-insight-title"><span class="bi-status-badge bi-tone-danger">LOSS RISK</span></div><div class="expense-signal-copy" style="margin-top:8px">${lossProducts.length} product${lossProducts.length===1?'':'s'} are currently priced below recorded cost.</div></div>`:''}${missingCost?`<div class="expense-insight bi-tone-neutral"><div class="expense-insight-title"><span class="bi-status-badge bi-tone-neutral">COST DATA MISSING</span></div><div class="expense-signal-copy" style="margin-top:8px">${missingCost} product${missingCost===1?'':'s'} need purchase cost data for accurate profit and margin calculations.</div></div>`:''}</div></div></div>`;
}

  return `<div class="card" style="margin-bottom:16px"><div class="card-head"><div><h3>${escapeHtml(employee.name)}'s profile</h3><div class="mono" style="font-size:11px;color:var(--ink-soft)">${escapeHtml(employee.username||'')}</div></div><button class="btn btn-ghost btn-sm" data-action="close-employee-profile">Close</button></div><div class="card-body"><div class="insight-grid"><div class="insight-card"><div class="mono">PERSONAL DETAILS</div><div style="margin-top:8px">Mobile: ${escapeHtml(employee.mobile||'—')}<br>Address: ${escapeHtml(employee.address||'—')}<br>Joined: ${escapeHtml(employee.joiningDate||'—')}</div></div><div class="insight-card"><div class="mono">EMPLOYMENT DETAILS</div><div style="margin-top:8px">Role: ${escapeHtml(employee.position||'Employee')}<br>Monthly salary: ${fmt(employee.monthlySalary||0)}<br>Discount limit: ${employee.discountLimitPercent==null?'Shop default':employee.discountLimitPercent+'%'}<br>Status: ${employee.active===false?'Inactive':'Active'}</div></div></div><div class="mono" style="font-size:11px;color:var(--ink-soft);margin:16px 0 8px">CURRENT MONTH SUMMARY</div><div class="stat-row"><div class="stat-card"><div class="stat-num">${counts.present||0}</div><div class="stat-label">Present Days</div></div><div class="stat-card"><div class="stat-num">${counts.absent||0}</div><div class="stat-label">Absent Days</div></div><div class="stat-card"><div class="stat-num">${counts.half_day||0}</div><div class="stat-label">Half Days</div></div><div class="stat-card"><div class="stat-num">${(counts.paid_leave||0)+(counts.unpaid_leave||0)}</div><div class="stat-label">Leave Days</div></div><div class="stat-card"><div class="stat-num">${salary?.specialDays||0}</div><div class="stat-label">Special / OT Days</div></div></div><div class="action-note" style="margin-top:10px">Estimated salary: <strong>${salary?fmt(salary.finalPayable):'Open Salary for a full calculation'}</strong></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn btn-outline btn-sm" data-action="edit-employee" data-id="${employee.id}">Edit employee</button><button class="btn btn-outline btn-sm" data-action="open-attendance">View attendance</button><button class="btn btn-outline btn-sm" data-action="open-salaries" data-id="${employee.id}">View salary breakdown</button></div></div></div>`;
}

function renderAttendance(){
  if(!state.isAdmin) return `<div class="page-head"><div><div class="page-title">Attendance</div><div class="page-desc">Admin only.</div></div></div>`;
  const active=state.employees.filter(e=>e.active!==false);
  const employee=active.find(e=>e.id===state.attendanceEmployeeId)||active[0];
  const date=localDateInputValue(), month=date.slice(0,7);
  if(!employee) return `<div class="page-head"><div><div class="page-title">Attendance</div><div class="page-desc">Add an employee to manage attendance.</div></div></div>${renderAttendanceSettingsCard()}${renderSpecialDaysCard()}`;
  const attendanceByDate=Object.fromEntries(state.attendance.filter(r=>r.employeeId===employee.id).map(r=>[r.date,r]));
  const specialByDate=Object.fromEntries(state.specialDays.filter(r=>r.employeeId===employee.id).map(r=>[r.date,r]));
  const year=Number(month.slice(0,4)), monthIndex=Number(month.slice(5,7))-1, daysInMonth=new Date(year,monthIndex+1,0).getDate(), firstDay=new Date(year,monthIndex,1).getDay();
  const statusNames={present:'Present',absent:'Absent',half_day:'Half day',paid_leave:'Paid leave',unpaid_leave:'Unpaid leave'};
  const todayDate=new Date(`${date}T00:00:00`);
  const weekStart=new Date(todayDate); weekStart.setDate(todayDate.getDate()-todayDate.getDay());
  const visibleDates=state.attendanceExpanded
    ? Array.from({length:daysInMonth},(_,index)=>localDateInputValue(new Date(year,monthIndex,index+1)))
    : Array.from({length:7},(_,index)=>{const day=new Date(weekStart);day.setDate(weekStart.getDate()+index);return localDateInputValue(day);});
  const calendarDays=state.attendanceExpanded?Array.from({length:firstDay},()=>'<div class="attendance-day is-empty" aria-hidden="true"></div>'):[];
  for(const dayDate of visibleDates){
    const day=new Date(`${dayDate}T00:00:00`).getDate(), record=attendanceByDate[dayDate], special=specialByDate[dayDate];
    const isSunday=new Date(`${dayDate}T00:00:00`).getDay()===0, blue=Boolean(special)||(isSunday&&record?.status==='present');
    const tone=blue?'special':record?.status==='present'?'present':record?.status==='absent'?'absent':record?.status==='half_day'?'half-day':'';
    const label=special?(isSunday&&record?.status==='present'?'Special · Present':'Special day'):record?statusNames[record.status]||'Recorded':'Not marked';
    const dateElement=dayDate===date?'button':'div', dateAction=dayDate===date?' data-action="select-attendance-day"':'';
    calendarDays.push(`<${dateElement} ${dateElement==='button'?'type="button"':''} class="attendance-day${tone?` is-${tone}`:''}${dayDate===date?' is-selected':' is-locked'}"${dateAction} data-date="${dayDate}" aria-label="${dayDate}: ${label}${dayDate===date?' — attendance can be marked today only':''}"><span class="attendance-day-number">${day}</span><span class="attendance-day-status">${label}</span></${dateElement}>`);
  }
  const selectedRecord=attendanceByDate[date]||{};
  return `<div class="page-head"><div><div class="page-title">Attendance</div><div class="page-desc">Attendance can only be marked or changed for today (${date}).</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select class="field-input" id="attendance-employee" aria-label="Employee">${active.map(e=>`<option value="${e.id}" ${e.id===employee.id?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select><span class="mono" style="font-size:11px">${new Date(`${month}-01T00:00:00`).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><button type="button" class="btn btn-outline btn-sm attendance-collapse-toggle" data-action="toggle-attendance-calendar" aria-expanded="${state.attendanceExpanded}">${state.attendanceExpanded?'Show current week':'Expand month'}</button></div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-body"><div class="attendance-calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(day=>`<div class="attendance-calendar-weekday">${day}</div>`).join('')}${calendarDays.join('')}</div><div class="attendance-legend" style="margin-top:14px"><span class="attendance-legend-item"><i class="attendance-legend-dot is-present"></i>Present</span><span class="attendance-legend-item"><i class="attendance-legend-dot is-absent"></i>Absent</span><span class="attendance-legend-item"><i class="attendance-legend-dot is-half-day"></i>Half day</span><span class="attendance-legend-item"><i class="attendance-legend-dot is-special"></i>Special day / Sunday present</span><span class="attendance-legend-item"><i class="attendance-legend-dot"></i>Not marked</span></div></div></div>
  <div class="card" style="margin-bottom:16px"><div class="card-head"><div><h3>Mark today's attendance · ${escapeHtml(employee.name)}</h3><div class="action-note">${date}${specialByDate[date]?` · ${escapeHtml(specialByDate[date].type)} special day`:''}</div></div></div><div class="card-body"><div class="field-row"><div class="field"><label>Status</label><select class="field-input attendance-status" data-employee-id="${employee.id}"><option value="present" ${(!selectedRecord.status||selectedRecord.status==='present')?'selected':''}>Present</option><option value="absent" ${selectedRecord.status==='absent'?'selected':''}>Absent</option><option value="half_day" ${selectedRecord.status==='half_day'?'selected':''}>Half Day</option><option value="paid_leave" ${selectedRecord.status==='paid_leave'?'selected':''}>Paid Leave</option><option value="unpaid_leave" ${selectedRecord.status==='unpaid_leave'?'selected':''}>Unpaid Leave</option></select></div><div class="field"><label>Check-in</label><input class="field-input attendance-in" data-employee-id="${employee.id}" type="time" value="${selectedRecord.checkIn?new Date(selectedRecord.checkIn).toTimeString().slice(0,5):''}"></div><div class="field"><label>Check-out</label><input class="field-input attendance-out" data-employee-id="${employee.id}" type="time" value="${selectedRecord.checkOut?new Date(selectedRecord.checkOut).toTimeString().slice(0,5):''}"></div><div class="field"><label>Notes</label><input class="field-input attendance-note" data-employee-id="${employee.id}" value="${escapeHtml(selectedRecord.notes||'')}" placeholder="Optional"></div></div><button class="btn btn-primary btn-sm" style="margin-top:12px" data-action="save-attendance" data-employee-id="${employee.id}" data-attendance-id="${selectedRecord.id||''}">${selectedRecord.id?'Update attendance':'Save attendance'}</button></div></div>${renderAttendanceSettingsCard()}${renderSpecialDaysCard()}`;
}

function renderAttendanceSettingsCard(){
  const settings=state.attendanceSettings||{};

  const active=state.employees.filter(e=>e.active!==false), month=localDateInputValue().slice(0,7);
  const monthSpecialDays=state.specialDays.filter(r=>r.date.startsWith(month));
  return `<div class="card"><div class="card-head"><h3>Special working days</h3><span class="action-note">Sunday is not overtime unless you mark it.</span></div><div class="card-body"><div class="field-row"><div class="field"><label>Employee</label><select id="special-employee" class="field-input" ${active.length?'':'disabled'}>${active.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="special-date" class="field-input" type="date" value="${state.attendanceDate}" ${active.length?'':'disabled'}></div><div class="field"><label>Day type</label><select id="special-type" class="field-input" ${active.length?'':'disabled'}><option value="normal">Normal Working Day</option><option value="sunday">Sunday Work Day</option><option value="holiday">Holiday Work Day</option><option value="overtime">Overtime Day</option><option value="special">Special Working Day</option></select></div><div class="field"><label>Custom payment</label><input id="special-amount" class="field-input" type="number" min="0" step="0.01" placeholder="Optional" ${active.length?'':'disabled'}></div></div><button class="btn btn-primary btn-sm" data-action="save-special-day" ${active.length?'':'disabled'}>Add special day</button><div style="margin-top:14px;overflow-x:auto"><table><thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Payment override</th><th></th></tr></thead><tbody>${monthSpecialDays.map(r=>`<tr><td>${escapeHtml(r.date)}</td><td>${escapeHtml(state.employees.find(e=>e.id===r.employeeId)?.name||'—')}</td><td>${escapeHtml(r.type)}</td><td>${r.customAmount==null?'Configured rate':fmt(r.customAmount)}</td><td><button class="btn btn-danger btn-sm" data-action="delete-special-day" data-id="${r.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No special working days recorded for this month.</td></tr>'}</tbody></table></div></div></div>`;

function expensePeriodRange(period){
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(period==='today') return {start:today,end:today+86400000,label:'Today'};
  if(period==='week'){const d=new Date(today), day=d.getDay()||7, start=today-(day-1)*86400000;return {start,end:start+7*86400000,label:'This week'};}
  if(period==='lastMonth'){const start=new Date(now.getFullYear(),now.getMonth()-1,1).getTime();return {start,end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'};}
  if(period==='custom'){const start=Date.parse(`${state.expenseStart}T00:00:00`), end=Date.parse(`${state.expenseEnd}T00:00:00`);return Number.isFinite(start)&&Number.isFinite(end)&&end>=start?{start,end:end+86400000,label:'Custom'}:null;}
  return {start:new Date(now.getFullYear(),now.getMonth(),1).getTime(),end:new Date(now.getFullYear(),now.getMonth()+1,1).getTime(),label:'This month'};
}
function expensePreviousRange(period,current){
  if(!current) return null;
  const now=new Date();
  if(period==='today') return {start:current.start-86400000,end:current.start,label:'Yesterday'};
  if(period==='week') return {start:current.start-7*86400000,end:current.start,label:'Previous week'};
  if(period==='month') return {start:new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'};
  if(period==='lastMonth') return {start:new Date(now.getFullYear(),now.getMonth()-2,1).getTime(),end:new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),label:'Previous month'};
  const duration=current.end-current.start;
  return {start:current.start-duration,end:current.start,label:'Previous equal period'};
}

egory</button>`:''}</div></div>

function renderDailyClosing(){

  if(!d) return `<div class="empty"><div class="empty-title">Preparing daily closing…</div></div>`;
  const saved=d.closing||{}; const counted=saved.countedCash ?? '';

  const selectedDateLabel=new Date(`${d.date}T00:00:00`).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'});
  const paymentTotal=Number(d.cashSales||0)+Number(d.cardSales||0)+Number(d.upiSales||0);

  const statusTone=variance===null?'neutral':Math.abs(variance)<0.01?'success':'danger', statusTitle=variance===null?'CASH COUNT REQUIRED':Math.abs(variance)<0.01?'CASH DRAWER BALANCED':'CASH MISMATCH DETECTED', statusText=variance===null?'Enter actual counted cash to reconcile.':Math.abs(variance)<0.01?'Expected and actual cash match.':'Investigate the difference before closing the day.';

  <div class="closing-reconcile card bi-tone-${statusTone}"><div><div class="closing-reconcile-title"><span class="bi-status-badge">${statusTitle}</span><span>${statusText}</span></div><div class="closing-reconcile-meta" style="margin-top:8px"><span>Expected: <strong>${fmt(d.expectedCash)}</strong></span>${variance===null?'<span>Actual: <strong>Not counted</strong></span>':`<span>Actual: <strong>${fmt(counted)}</strong></span><span>Difference: <strong>${variance>0?'+':''}${fmt(variance)}</strong></span>`}</div></div>${variance===null?'<span class="action-note">Count the drawer below</span>':variance===0?'<span class="action-note">Ready to close</span>':'<span class="action-note">Review before closing</span>'}</div>
  <div class="closing-summary-grid"><div class="card closing-summary-card"><div class="analytics-kpi-head"><span class="analytics-kpi-icon">${ic.banknote}</span><span>Today's net sales</span></div><div class="closing-summary-value" title="${fmt(d.netSales)}">${formatKpiMoney(d.netSales)}</div><div class="action-note">${d.saleCount} completed sale${d.saleCount===1?'':'s'} · after returns</div></div><div class="card closing-summary-card is-expense"><div class="analytics-kpi-head"><span class="analytics-kpi-icon">${ic.receipt}</span><span>Cash expenses</span></div><div class="closing-summary-value" title="${fmt(d.cashExpenses)}">${formatKpiMoney(d.cashExpenses)}</div><div class="action-note">${d.cashExpenses?`${d.expenseCount} expense record${d.expenseCount===1?'':'s'} to review`:'No cash expenses recorded'}</div></div></div>

function parseCsv(text){ const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean); if(lines.length<2) throw new Error('CSV needs a header row and at least one data row'); const split=line=>{const out=[];let v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){v+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){out.push(v.trim());v='';}else v+=c;}out.push(v.trim());return out;};const headers=split(lines[0]).map(h=>h.trim());return lines.slice(1).map(line=>Object.fromEntries(split(line).map((v,i)=>[headers[i]||'',v]))); }
async function importCsvFile(file,kind){ try{const rows=parseCsv(await file.text());const r=await api('POST','/api/imports/'+kind,{rows});showToast(`Imported ${r.added} new and updated ${r.updated||0} records`);await refreshInventory();await refreshSales();render();}catch(e){showToast(e.errors?e.errors.join(' · '):e.message);} }

function bindEvents(){
  const app = document.getElementById('app');

  const invoicePrefixEl = app.querySelector('#set-invoice-prefix');
  const invoiceStartEl = app.querySelector('#set-invoice-start');
  const invoicePreviewEl = app.querySelector('#invoice-number-preview');
  if(invoicePrefixEl && invoiceStartEl && invoicePreviewEl){
    const updateInvoicePreview = () => {
      const start = Math.max(1, Math.floor(Number(invoiceStartEl.value) || 1));
      invoicePreviewEl.textContent = `${invoicePrefixEl.value || 'INV-'}${String(start).padStart(6, '0')}`;
    };
    invoicePrefixEl.addEventListener('input', updateInvoicePreview);
    invoiceStartEl.addEventListener('input', updateInvoicePreview);
  }

  app.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', async (e) => {
    e.preventDefault();
    const target = el.getAttribute('data-nav');
    if(state.editingSaleId && target !== 'sale'){
      state.cart = []; resetCheckout(); state.editingSaleId = null; state.editingSaleOriginal = null;
    }
    state.view = target;
    state.billReview = null; state.quickAdd = null; state.unmatched = null; state.editingId = null; state.editItemDraft = null;
    state.loginPrompt = null; state.loginError = ''; pendingAdminAction = null;
    state.homeEditing = false; state.returnForm = null; state.employeeDraft = null;
    render();
    if(state.view === 'history' && state.isStaff){ await refreshSales(); await refreshDiscountApprovals(); render(); }
    if(state.view === 'dashboard' && state.isAdmin){ await refreshSales(); await refreshExpenses(); render(); }
    if(state.view === 'analytics' && state.isAdmin){ await refreshSales(); await refreshExpenses(); await refreshAnalytics(); render(); }
    if(state.view === 'expenses' && state.isStaff){ await refreshExpenses(); render(); }
    if(state.view === 'employees' && state.isAdmin){ await refreshEmployees(); await refreshAttendance(); render(); }
    if(state.view === 'employees' && state.isAdmin && state.employeeToolsPanel){ await refreshEmployees(); await refreshAttendance(); render(); }
    if(state.view === 'closing' && state.isAdmin){ await refreshDailyClosing(); render(); }
  }));
  app.querySelectorAll('[data-nav]').forEach(el => {
    if(!['BUTTON','A'].includes(el.tagName)){ el.setAttribute('role','button'); if(el.tabIndex < 0) el.tabIndex=0; }

  const aiInput = app.querySelector('#ai-question');
