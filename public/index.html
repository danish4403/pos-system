function localDateTimeValue(date){ const p=n=>String(n).padStart(2,'0'); return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}T${p(date.getHours())}:${p(date.getMinutes())}`; }
function saleNet(sale){ return Number(sale.netTotal ?? (Number(sale.total||0)-(sale.returns||[]).reduce((n,r)=>n+Number(r.refundAmount||0),0))); }
function sumSalesBetween(start,end){ return state.sales.filter(s=>Number(s.timestamp)>=start&&Number(s.timestamp)<=end).reduce((n,s)=>n+saleNet(s),0); }
function comparisonMarkup(title,current,previous,label){ const change=current-previous; const pct=previous ? change/previous*100 : (current?100:0); const tone=change>=0?'var(--moss)':'var(--stamp)'; return `<div class="insight-card"><div class="mono" style="font-size:11px">${title}</div><div style="font-size:22px;font-weight:700;margin-top:4px">${fmt(current)}</div><div style="font-size:12px;color:${tone};margin-top:5px">${change>=0?'▲':'▼'} ${fmt(Math.abs(change))} · ${Math.abs(pct).toFixed(1)}% vs ${label}</div></div>`; }
function renderComparisonGraph(points){
  const max=Math.max(1,...points.map(p=>Math.max(p.current,p.previous))); const base=176, chartH=125, groupW=210;
  const bars=points.map((p,i)=>{ const x=56+i*groupW; const h1=p.current/max*chartH, h2=p.previous/max*chartH; return `<g><rect x="${x}" y="${base-h1}" width="42" height="${h1}" rx="4" fill="var(--brass)"><title>${p.label} current: ${fmt(p.current)}</title></rect><rect x="${x+52}" y="${base-h2}" width="42" height="${h2}" rx="4" fill="var(--ink-soft)" opacity=".35"><title>${p.label} previous: ${fmt(p.previous)}</title></rect><text x="${x+47}" y="202" text-anchor="middle" font-size="11" fill="var(--ink)">${p.label}</text></g>`; }).join('');
  return `<div class="card" style="background:var(--paper);border:1px solid var(--line);margin-bottom:18px"><div style="display:flex;gap:18px;align-items:center;padding:12px 14px;font-size:12px;color:var(--ink-soft)"><span><i style="display:inline-block;width:10px;height:10px;background:var(--brass);border-radius:2px;margin-right:5px"></i>Current</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--ink-soft);opacity:.35;border-radius:2px;margin-right:5px"></i>Previous</span></div><div style="overflow-x:auto"><svg viewBox="0 0 700 225" role="img" aria-label="Sales comparison graph" style="display:block;width:100%;min-width:620px;height:225px"><line x1="38" y1="${base}" x2="675" y2="${base}" stroke="var(--line)"/><line x1="38" y1="${base-chartH}" x2="675" y2="${base-chartH}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="4" y="${base+4}" font-size="10" fill="var(--ink-soft)">0</text><text x="2" y="${base-chartH+4}" font-size="10" fill="var(--ink-soft)">${fmt(max)}</text>${bars}</svg></div></div>`;
}
function renderSalesPerformance(){
  const now=new Date(); const monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime(); const nextMonth=new Date(now.getFullYear(),now.getMonth()+1,1).getTime()-1; const priorMonthStart=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(); const priorMonthEnd=monthStart-1;
  const yearStart=new Date(now.getFullYear(),0,1).getTime(); const nextYear=new Date(now.getFullYear()+1,0,1).getTime()-1; const priorYearStart=new Date(now.getFullYear()-1,0,1).getTime(); const priorYearEnd=yearStart-1;
  const fallbackStart=localDateTimeValue(new Date(monthStart)); const fallbackEnd=localDateTimeValue(now);
  const startRaw=state.dashboardStart||fallbackStart, endRaw=state.dashboardEnd||fallbackEnd; const start=new Date(startRaw).getTime(), end=new Date(endRaw).getTime();
  const valid=Number.isFinite(start)&&Number.isFinite(end)&&end>=start; const duration=valid?end-start:0; const customCurrent=valid?sumSalesBetween(start,end):0; const customPrevious=valid?sumSalesBetween(start-duration-1,start-1):0;
  const points=[{label:'Month',current:sumSalesBetween(monthStart,nextMonth),previous:sumSalesBetween(priorMonthStart,priorMonthEnd)},{label:'Year',current:sumSalesBetween(yearStart,nextYear),previous:sumSalesBetween(priorYearStart,priorYearEnd)}]; if(valid) points.push({label:'Custom',current:customCurrent,previous:customPrevious});
  return `<div class="card" style="margin-bottom:16px"><div class="card-head"><div><h3>Sales performance</h3><div style="font-size:12px;color:var(--ink-soft);margin-top:3px">Net sales after returns · current period compared with the previous equivalent period.</div></div></div><div class="card-body">${renderComparisonGraph(points)}<div style="border-top:1px solid var(--line);padding-top:16px"><div class="mono" style="font-size:11px;color:var(--ink-soft);margin-bottom:10px">CUSTOM DATE & TIME COMPARISON</div><div class="field-row"><div class="field"><label>From</label><input class="field-input" id="dashboard-start" type="datetime-local" value="${escapeHtml(startRaw)}"></div><div class="field"><label>To</label><input class="field-input" id="dashboard-end" type="datetime-local" value="${escapeHtml(endRaw)}"></div></div>${valid?`<div style="font-size:12px;color:var(--ink-soft);margin-top:8px">Selected period: <strong>${fmt(customCurrent)}</strong> · Previous equivalent: <strong>${fmt(customPrevious)}</strong> · ${Math.max(1,Math.ceil((duration+1)/86400000))} day${Math.ceil((duration+1)/86400000)===1?'':'s'}</div>`:`<div class="banner banner-warn">Choose an end date/time after the start date/time.</div>`}</div></div></div>`;
}

        <button class="btn btn-outline btn-sm" data-action="export-csv" data-kind="inventory">Export CSV</button>
        <button class="btn btn-outline btn-sm" data-action="open-manual-add">${ic.plus} Add manually</button>
        <button class="btn btn-primary" data-action="scan-bill">${ic.upload} Scan bill photo</button>
      </div>` : ''}
    </div>
    ${state.quickAdd ? renderQuickAddCard() : ''}
    ${state.editItemDraft ? renderEditItemCard() : ''}
    ${state.scanning && state.scanning.for==='bill' ? renderScanningCard() : ''}
    ${!state.inventory.length ? `
      <div class="card"><div class="empty">
        ${ic.box}
        <div class="empty-title" style="margin-top:10px;">No items yet</div>
        <p>Photograph a bill, invoice, or handwritten stock list — item name, quantity, cost and code will be read automatically. You'll be asked to log in first.</p>
        <button class="btn btn-primary" data-action="scan-bill">${ic.upload} Scan your first bill</button>
      </div></div>
    ` : `
      <div class="card">
        <div class="card-head">
          <h3>${state.inventory.length} item${state.inventory.length===1?'':'s'}</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap"><div style="width:220px;"><input class="search-input" placeholder="Search name, code, supplier…" id="inv-search" value="${escapeHtml(state.invSearch)}"></div><select class="field-input" id="inventory-category-filter" style="width:160px"><option value="">All categories</option>${categories.map(c=>`<option value="${escapeHtml(c)}" ${state.inventoryCategoryFilter===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select><select class="field-input" id="inventory-supplier-filter" style="width:160px"><option value="">All suppliers</option>${suppliers.map(s=>`<option value="${escapeHtml(s)}" ${state.inventorySupplierFilter===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
        </div>
        <div class="card-body" style="overflow-x:auto;">
          <table>
            <thead><tr>
              <th>Item</th><th>Category</th><th>Supplier</th><th>Code</th><th>Price</th>
              <th>Qty</th><th></th>
            </tr></thead>
            <tbody>
              ${items.map(it => renderInventoryRow(it)).join('') || `<tr><td colspan="7" style="color:var(--ink-soft);">No inventory items match the active filters.</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `}
  `;
}
function renderInventoryRow(it){
  const qty = Number(it.quantity||0);
  const qtyClass = qty<=0 ? 'qty-zero' : (qty<=3 ? 'qty-low' : '');
  const category = it.category || 'Uncategorized';
  return `
    <tr>
      <td>${escapeHtml(it.name)}${it.shortDescription ? `<div class="desc-sub">${escapeHtml(it.shortDescription)}</div>` : ''}</td>
      <td><span class="item-code">${escapeHtml(category)}</span></td>
      <td>${escapeHtml(it.supplier || '—')}</td>
      <td>${it.code ? `<span class="item-code">${escapeHtml(it.code)}</span>` : '<span style="color:var(--ink-soft);">—</span>'}</td>
      <td class="mono">${fmtOrDash(it.price)}</td>
      <td class="qty-badge ${qtyClass}">${qty}</td>
      ${state.isAdmin ? `<td class="row-actions">
        <button class="btn btn-ghost btn-sm" aria-label="Edit ${escapeHtml(it.name)}" title="Edit item" data-action="edit-item" data-id="${it.id}">${ic.edit}</button>
        <button class="btn btn-ghost btn-sm" aria-label="Delete ${escapeHtml(it.name)}" title="Delete item" data-action="delete-item" data-id="${it.id}">${ic.trash}</button>
      </td>` : '<td></td>'}
    </tr>`;
}
function renderEditItemCard(){

  return `
    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Edit ${escapeHtml(it.name)}</h3><button class="btn btn-ghost btn-sm" data-action="close-edit-item">${ic.x}</button></div>

        <div class="field"><label>Name</label><input class="field-input" id="ei-name" value="${escapeHtml(it.name||'')}"></div>

        <div class="field-row"><div class="field"><label>Supplier</label><input class="field-input" id="ei-supplier" value="${escapeHtml(it.supplier||'')}" placeholder="Supplier name"></div><label style="display:flex;gap:8px;align-items:center;font-size:13px"><input id="ei-frequent" type="checkbox" ${it.frequent?'checked':''}> Show in frequent sale items</label></div>
        <div class="field"><label>Product image (shown in frequent items)</label><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-outline btn-sm" data-action="pick-inventory-image">${ic.upload} Upload image</button>${state.inventoryImageDraft||it.imageUrl?`<img src="${state.inventoryImageDraft||it.imageUrl}" style="width:58px;height:44px;object-fit:contain;border:1px solid var(--line);border-radius:4px">`:''}</div></div>
        ${state.isAdmin ? `
        <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">
          <div class="field"><label>Cost price</label><input class="field-input" id="ei-cost" type="number" step="0.01" value="${it.costPrice||0}"></div>
          <div class="field"><label>Margin %</label><input class="field-input" id="ei-margin" type="number" step="0.1" value="${marginFromSell(it.costPrice||0, it.price||0)}"></div>
          <div class="field"><label>Sell price</label><input class="field-input mono" id="ei-sell" type="number" step="0.01" value="${it.price||0}"></div>
        </div>` : `
        <div class="field-row">
          <div class="field"><label>Cost price</label><input class="field-input" id="ei-cost" type="number" step="0.01" value="${it.costPrice||0}"></div>
          <div class="field"><label>Sell price</label><input class="field-input mono" id="ei-sell" type="number" step="0.01" value="${it.price||0}"></div>
        </div>`}
        <div class="field"><label>Quantity</label><input class="field-input" id="ei-quantity" type="number" value="${it.quantity||0}"></div>
        <div class="field"><label>Short description (one line)</label><input class="field-input" id="ei-shortdesc" value="${escapeHtml(it.shortDescription||'')}" placeholder="e.g. Premium basmati rice"></div>
        <div class="field"><label>Detailed description (optional)</label><textarea class="field-input" id="ei-longdesc" rows="3" style="resize:vertical;">${escapeHtml(it.detailedDescription||'')}</textarea></div>
        <button class="btn btn-primary" data-action="save-edit-item">${ic.check} Save changes</button>
      </div>
    </div>`;
}

function renderBillReview(){
  return `
    <div class="page-head">
      <div><div class="page-title">Review scanned bill</div><div class="page-desc">Check details and set your selling price before adding to inventory.</div></div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="margin-toolbar">
          <label>Default margin</label>
          <input class="field-input" type="number" id="default-margin" value="${state.settings.defaultMarginPercent}">
          <span class="mono" style="color:var(--ink-soft);">%</span>
          <button class="btn btn-outline btn-sm" data-action="apply-default-margin">Apply to all rows</button>
        </div>
        <div class="review-scroll">
          <div class="review-head"><div>Item</div><div>Qty</div><div>Cost</div><div>Margin %</div><div>Sell</div><div>Code</div><div>Category</div><div></div></div>
          ${state.billReview.map((row, idx) => {
            const existing = row.code
              ? state.inventory.find(it => it.code && String(it.code).trim().toLowerCase() === String(row.code).trim().toLowerCase())

            <div class="review-row">
              <input class="field-input" data-review="name" data-idx="${idx}" value="${escapeHtml(row.name)}">
              <input class="field-input" data-review="quantity" data-idx="${idx}" type="number" value="${row.quantity}">
              <input class="field-input" data-review="cost" data-idx="${idx}" type="number" step="0.01" value="${row.cost}">
              <input class="field-input" data-review="margin" data-idx="${idx}" type="number" step="0.1" value="${row.margin}">
              <input class="field-input mono" data-review="sell" data-idx="${idx}" type="number" step="0.01" value="${row.sell}">
              <input class="field-input mono" data-review="code" data-idx="${idx}" value="${escapeHtml(row.code||'')}" placeholder="—">
              <input class="field-input" data-review="category" data-idx="${idx}" value="${escapeHtml(row.category||'')}" placeholder="Category">
              <button class="btn btn-ghost btn-sm" data-action="remove-review-row" data-idx="${idx}">${ic.x}</button>
            </div>
            <div style="margin:-4px 0 8px 0;"><span class="match-tag ${existing?'match-existing':'match-new'}">${existing ? `will add stock to existing "${escapeHtml(existing.name)}"` : 'new item'}</span></div>

          }).join('')}
        </div>
      </div>
      <div class="card-head" style="border-top:1px solid var(--line); border-bottom:none;">
        <button class="btn btn-outline" data-action="cancel-bill-review">Cancel</button>
        <button class="btn btn-primary" data-action="confirm-bill-review">${ic.check} Add ${state.billReview.length} item${state.billReview.length===1?'':'s'} to inventory</button>
      </div>

function renderScanningCard(){

      <div class="card-body" style="text-align:center;">

        <div class="scan-status">Reading the photo…</div>

}

        ${state.isAdmin ? `
        <div class="field-row" style="grid-template-columns:1fr 1fr 1fr;">

/* ============ RENDER: SALE ============ */
function renderSale(){
  if(!state.isStaff) return `<div class="page-head"><div><div class="page-title">New sale</div><div class="page-desc">Sign in to start a transaction.</div></div></div>${renderLoginCard({message:'Sales are recorded against a staff account. Choose Admin or Employee to continue.',allowEmployee:true,fullPage:true})}`;
  const preview = checkoutPreview();
  const { discountMode, paymentMethod, amountPaid } = state.checkout;
  const isEdit = !!state.editingSaleId;

  return `
    <div class="page-head">
      <div>
        <div class="page-title">${isEdit ? `Edit bill ${escapeHtml(state.editingSaleId)}` : 'New sale'}</div>
        <div class="page-desc">${isEdit ? 'Adjust items, discount, or payment — inventory and totals recalculate automatically.' : "Photograph each item's tag, scan its barcode, or search to ring it up."}</div>
      </div>
      ${isEdit ? `<button class="btn btn-outline" data-action="cancel-edit-sale">${ic.x} Cancel edit</button>` : ''}
    </div>
    <div class="sale-grid">
      <div>
        <div class="sale-tools">
          ${state.scanning && state.scanning.for==='tag' ? renderScanningCard() : `
            <div class="scan-zone" data-action="scan-tag">
              ${ic.upload}
              <div class="scan-zone-title">Scan or upload tag</div>
              <div class="scan-zone-sub">Use camera capture or choose a product-tag photo</div>
            </div>`}
          <div class="card sale-search-card"><div class="card-head"><div><h3>Find a product</h3><div class="action-note">Search name, SKU, barcode, or scanned input</div></div></div><div class="card-body"><input class="search-input" id="sale-search" autofocus placeholder="Search products or scan barcode…" value="${escapeHtml(state.invSearch)}">${renderSaleSearchResults()}</div></div>
        </div>

        ${state.unmatched ? `
          <div class="banner banner-warn" style="margin-top:14px;">
            ${ic.alert}
            <div style="flex:1;">
              <p><strong>${escapeHtml(state.unmatched.name || 'This item')}</strong> wasn't found in your inventory${state.unmatched.code ? ` (code ${escapeHtml(state.unmatched.code)})` : ''}.</p>
              <div class="banner-actions">
                <button class="btn btn-outline btn-sm" data-action="quickadd-from-unmatched">Add to inventory</button>
                <button class="btn btn-ghost btn-sm" data-action="dismiss-unmatched">Dismiss</button>
              </div>
            </div>
          </div>` : ''}

        ${state.quickAdd ? renderQuickAddCard() : ''}

        ${renderFrequentProducts()}
      </div>

      <div class="card">
        <div class="card-head"><h3>${isEdit ? 'Bill items' : 'Cart'}</h3>${state.cart.length && !isEdit ? `<button class="btn btn-ghost btn-sm" data-action="clear-cart">${ic.x} Clear</button>`:''}</div>
        <div class="card-body">
          ${state.cart.length ? state.cart.map(c => `
            <div class="cart-line">
              <div>
                <div class="cart-name">${escapeHtml(c.name)}</div>
                <div class="cart-sub">${fmt(c.price)} each</div>
              </div>
              <div class="stepper">
                <button aria-label="Decrease ${escapeHtml(c.name)} quantity" title="Decrease quantity" data-action="cart-dec" data-id="${c.invId}">${ic.minus}</button>
                <span>${c.qty}</span>
                <button aria-label="Increase ${escapeHtml(c.name)} quantity" title="Increase quantity" data-action="cart-inc" data-id="${c.invId}">${ic.plus}</button>
              </div>
              <div class="cart-total">${fmt(c.price*c.qty)}</div>
              <button class="btn btn-ghost btn-sm" aria-label="Remove ${escapeHtml(c.name)} from cart" title="Remove item" data-action="cart-remove" data-id="${c.invId}">${ic.trash}</button>
            </div>
          `).join('') : `<div class="cart-empty"><span class="empty-cart-icon">${ic.scan}</span><div><strong style="color:var(--ink)">Cart is ready</strong><br>Search a product or scan a tag to start this sale.</div></div>`}

          ${state.cart.length ? `
          <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);">
            <label style="font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px;">Customer (optional)</label>
            <div class="field-row">
              <input class="field-input" id="customer-name" placeholder="Name" value="${escapeHtml(state.checkout.customerName||'')}">
              <input class="field-input" id="customer-phone" placeholder="Mobile number" inputmode="numeric" maxlength="10" value="${escapeHtml(state.checkout.customerPhone||'')}">
            </div>
            <input class="field-input" id="customer-address" placeholder="Address (optional)" style="margin-top:8px;" value="${escapeHtml(state.checkout.customerAddress||'')}">
            ${paymentMethod==='due' ? `<div style="font-size:11.5px; color:var(--ink-soft); margin:8px 0 12px 0;">Worth adding a mobile number here — makes it easy to find and settle this due later.</div>` : '<div style="margin-bottom:14px;"></div>'}

            <label style="font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px;">Discount</label>
            <div class="discount-toggle">
              <button data-action="discount-mode" data-mode="none" class="${discountMode==='none'?'active':''}">None</button>
              <button data-action="discount-mode" data-mode="percent" class="${discountMode==='percent'?'active':''}">Percentage</button>
              <button data-action="discount-mode" data-mode="finalPrice" class="${discountMode==='finalPrice'?'active':''}">Set final price</button>
            </div>
            ${discountMode==='percent' ? `<input class="field-input" id="discount-value" type="number" step="0.1" placeholder="Discount %" value="${state.checkout.discountValue||''}">` : ''}
            ${discountMode==='finalPrice' ? `<input class="field-input" id="discount-value" type="number" step="0.01" placeholder="Final price to charge" value="${state.checkout.discountValue||''}">` : ''}

            <label style="font-size:12px; color:var(--ink-soft); display:block; margin:14px 0 6px 0;">Payment method</label>
            <div class="pay-toggle">
              <button data-action="pay-method" data-method="cash" class="${paymentMethod==='cash'?'active':''}">Cash</button>
              <button data-action="pay-method" data-method="upi" class="${paymentMethod==='upi'?'active':''}">UPI</button>
              <button data-action="pay-method" data-method="card" class="${paymentMethod==='card'?'active':''}">Card</button>
              <button data-action="pay-method" data-method="due" class="${paymentMethod==='due'?'active':''}">Due</button>
            </div>
            ${paymentMethod==='due' ? `
              <input class="field-input" id="amount-paid" type="number" step="0.01" placeholder="Amount received now (0 if none)" value="${state.checkout.amountPaid||''}">
            ` : ''}

            <div id="checkout-summary" style="margin-top:12px;">
              ${renderCheckoutSummary()}
            </div>

            ${state.managerApprovalNeeded ? `
              <div class="manager-gate">
                <p>${ic.lock} ${escapeHtml(state.managerApprovalNeeded.message)}</p>
                <input class="field-input" type="password" id="manager-password" placeholder="Manager / admin password" style="margin-bottom:8px;">
                <button class="btn btn-primary btn-sm" data-action="approve-discount">${ic.check} Approve &amp; complete sale</button>
              </div>
            ` : ''}
          </div>` : ''}

          <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:14px;" ${state.cart.length?'':'disabled'} data-action="complete-sale">${ic.check} ${isEdit ? 'Save changes' : 'Complete sale'}</button>
        </div>
      </div>
    </div>`;
}
function renderFrequentProducts(){
  const selected=state.inventory.filter(i=>i.frequent && Number(i.quantity)>0);
  const products=(selected.length?selected:state.inventory.filter(i=>Number(i.quantity)>0).slice(0,8));
  if(!products.length) return '';
  return `<div class="card frequent-scroll" style="margin-top:14px"><div class="card-head"><div><h3>${selected.length?'Frequent items':'Quick picks'}</h3><div class="action-note">Tap a card to add it · ${selected.length?'Chosen by admin':'Mark items as frequent in Inventory'}</div></div><span class="mono" style="font-size:11px;color:var(--ink-soft)">${products.length} items</span></div><div class="card-body"><div class="product-grid">${products.map(i=>`<div class="product-tile" data-action="add-search-result" data-id="${i.id}" role="button" tabindex="0" aria-label="Add ${escapeHtml(i.name)} to cart"><div class="product-thumb">${i.imageUrl?`<img src="${escapeHtml(i.imageUrl)}" alt="${escapeHtml(i.name)}">`:`<span>${escapeHtml((i.name||'?').slice(0,1).toUpperCase())}</span>`}</div><div class="product-name">${escapeHtml(i.name)}</div><div class="product-price">${fmt(i.price)}</div></div>`).join('')}</div></div></div>`;
}
function renderCheckoutSummary(){
  const preview = checkoutPreview();
  const { paymentMethod, amountPaid } = state.checkout;
  const paid = paymentMethod === 'due' ? roundMoney(Math.min(Number(amountPaid)||0, preview.total)) : preview.total;
  const due = roundMoney(Math.max(0, preview.total - paid));
  const limit = Number(state.settings.maxEmployeeDiscountPercent) || 0;
  const overLimit = !state.editingSaleId && preview.discountAmount > 0 && preview.discountPercent > limit + 0.05;
  return `
    <div class="summary-line"><span>Subtotal</span><span>${fmt(preview.subtotal)}</span></div>
    ${preview.discountAmount > 0 ? `<div class="summary-line"><span>Discount (${preview.discountPercent.toFixed(1)}%)</span><span>−${fmt(preview.discountAmount)}</span></div>` : ''}
    <div class="summary-line total"><span>Total</span><span>${fmt(preview.total)}</span></div>
    ${paymentMethod==='due' ? `
      <div class="summary-line"><span>Paid now</span><span>${fmt(paid)}</span></div>
      <div class="summary-line"><span>Due</span><span style="color:var(--stamp); font-weight:600;">${fmt(due)}</span></div>
    ` : ''}
    ${overLimit ? `<div style="font-size:11.5px; color:var(--stamp); margin-top:6px;">${ic.alert} Above the ${limit}% employee limit — manager password will be needed to complete this sale.</div>` : ''}
  `;
}
function renderSaleSearchResults(){
  const q = normalize(state.invSearch);
  if(!q) return '';
  const results = state.inventory.filter(i => Number(i.quantity)>0 && (normalize(i.name).includes(q) || (i.code && normalize(i.code).includes(q)))).slice(0,6);
  if(!results.length) return `<div style="color:var(--ink-soft); font-size:13px; margin-top:10px;">No matching items.</div>`;
  return `<div style="margin-top:8px;">${results.map(it => `
    <div class="sale-search-result" data-action="add-search-result" data-id="${it.id}" ${Number(it.quantity)<=0?'aria-disabled="true"':''} role="button" tabindex="0">
      <div class="sale-search-result-thumb">${it.imageUrl?`<img src="${escapeHtml(it.imageUrl)}" alt="${escapeHtml(it.name)}">`:`<span>${escapeHtml((it.name||'?').slice(0,1).toUpperCase())}</span>`}</div>
      <div style="min-width:0;flex:1"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(it.name)}</div><div class="mono" style="font-size:11.5px;color:var(--ink-soft);">${fmt(it.price)} · ${it.code?escapeHtml(it.code):'SKU not set'}</div></div><div class="mono" style="font-size:11.5px;color:${Number(it.quantity)>0?'var(--ink-soft)':'var(--stamp)'}">${Number(it.quantity)>0?'Add':'Out of stock'}</div>

}

function invoiceNumberForSale(sale){ const found=state.sales.findIndex(x=>x.id===sale.id); return `${state.settings.invoicePrefix||'INV-'}${String(Number(state.settings.startingInvoiceNumber||1)+Math.max(0,found)).padStart(6,'0')}`; }
function invoiceDisplaySettings(){ return Object.assign({logo:true,address:true,mobile:true,gstin:true,customer:true,policies:false,terms:false,payment:false,thankYou:true},state.settings.invoiceDisplay||{}); }
function renderInvoiceBusinessHeader(sale){
  const s=state.settings, d=invoiceDisplaySettings(), address=[s.shopAddress,s.businessCity,s.businessState,s.businessPinCode].filter(Boolean).join(', ');

  const terms=d.terms&&s.termsAndConditions?`<div class="receipt-policy"><strong>Terms &amp; Conditions</strong><br>${escapeHtml(s.termsAndConditions).replace(/\n/g,'<br>')}</div>`:'';
  const payment=d.payment&&s.showPaymentDetailsOnInvoice&&[s.upiId,s.bankName,s.accountHolderName,s.accountNumber,s.ifscCode].some(Boolean)?`<div class="receipt-policy"><strong>Payment details</strong><br>${[s.upiId&&`UPI: ${escapeHtml(s.upiId)}`,s.bankName&&`Bank: ${escapeHtml(s.bankName)}`,s.accountHolderName&&`A/c holder: ${escapeHtml(s.accountHolderName)}`,s.accountNumber&&`A/c no: ${escapeHtml(s.accountNumber)}`,s.ifscCode&&`IFSC: ${escapeHtml(s.ifscCode)}`].filter(Boolean).join(' · ')}</div>`:'';
  const online=s.showOnlineDetailsOnInvoice&&[s.website,s.instagram,s.facebook,s.googleBusinessLink].some(Boolean)?`<div class="receipt-sub">${[s.website&&`Web: ${escapeHtml(s.website)}`,s.instagram&&`Instagram: ${escapeHtml(s.instagram)}`,s.facebook&&`Facebook: ${escapeHtml(s.facebook)}`,s.googleBusinessLink&&`Google: ${escapeHtml(s.googleBusinessLink)}`].filter(Boolean).join(' · ')}</div>`:'';
  return `${d.logo&&s.storeLogo?`<img class="receipt-logo" src="${s.storeLogo}" alt="Store logo">`:''}<div class="receipt-title">${escapeHtml(s.invoiceTitle||'Invoice')}</div><div style="text-align:center;font-weight:700">${escapeHtml(s.shopName||'Ledger')}</div>${s.legalBusinessName&&s.legalBusinessName!==s.shopName?`<div class="receipt-sub">${escapeHtml(s.legalBusinessName)}${s.tradeName?` · ${escapeHtml(s.tradeName)}`:''}</div>`:''}${d.address&&address?`<div class="receipt-sub">${escapeHtml(address)}</div>`:''}${d.mobile&&(s.shopPhone||s.businessEmail)?`<div class="receipt-sub">${[s.shopPhone,s.additionalPhone,s.businessEmail].filter(Boolean).map(escapeHtml).join(' · ')}</div>`:''}${d.gstin&&s.gstin?`<div class="receipt-sub">GSTIN: ${escapeHtml(s.gstin)}</div>`:''}${online}<div class="receipt-sub">${invoiceNumberForSale(sale)} · ${new Date(sale.timestamp).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})}</div>${d.customer&&(sale.customerName||sale.customerPhone||sale.customerAddress)?`<div class="receipt-sub">${[sale.customerName,sale.customerPhone,sale.customerAddress].filter(Boolean).map(escapeHtml).join(' · ')}</div>`:''}${policy}${terms}${payment}`;
}
function renderReceipt(){
  const sale = state.lastSale;
  if(!sale){ state.view='home'; return renderHome(); }
  const payLabel = { cash:'Cash', upi:'UPI', card:'Card', due:'Due / Credit' }[sale.paymentMethod] || sale.paymentMethod;

  return `
    <div class="page-head no-print">

        <div class="receipt-total-row"><span>Total</span><span>${fmt(sale.total)}</span></div>

          <div class="receipt-row"><span>Paid now</span><span>${fmt(sale.amountPaid)}</span></div>
          <div class="receipt-row"><span>Due</span><span>${fmt(sale.amountDue)}</span></div>
        ` : ''}
        <div class="receipt-stamp">${sale.amountDue > 0 ? 'PARTIAL' : 'PAID'}</div>
        ${invoiceDisplaySettings().thankYou&&state.settings.billFooterMessage ? `<div class="receipt-footer-msg">${escapeHtml(state.settings.billFooterMessage)}</div>` : ''}

}
function renderReturnReceipt(){

/* ============ RENDER: HISTORY ============ */
function returnedQtyByItemClient(sale){
  const map = {};
  (sale.returns || []).forEach(r => r.items.forEach(i => { map[i.id] = (map[i.id]||0) + i.qty; }));
  return map;
}
function renderHistory(){
  if(!state.isStaff){
    return `
      <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">Staff login required.</div></div></div>
      ${renderLoginCard({ message: 'Log in to view sales history — cost and profit figures are admin-only.', allowEmployee: true, fullPage: true })}`;
  }
  if(!state.sales.length){
    return `
      <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">Every completed sale, kept here.</div></div></div>
      <div class="card"><div class="empty">
        ${ic.receipt}
        <div class="empty-title" style="margin-top:10px;">No sales yet</div>
        <p>Completed sales will show up here with a full breakdown.</p>
        <button class="btn btn-primary" data-nav="sale">${ic.scan} Start a sale</button>
      </div></div>`;
  }

  const todayKey = new Date().toDateString();
  const todaySales = state.sales.filter(s => new Date(s.timestamp).toDateString() === todayKey);
  const todayRows = [];
  todaySales.forEach(s => (s.items||[]).forEach(line => {
    const returned=(s.returns||[]).reduce((n,r)=>n+(r.items||[]).filter(i=>i.id===line.id).reduce((x,i)=>x+Number(i.qty||0),0),0);
    todayRows.push({
      timestamp: s.timestamp,
      customerName: s.customerName || '—',
      itemName: line.name,
      qty: Math.max(0, line.qty-returned),
      amount: Math.max(0,(line.lineTotal ?? line.price*line.qty) - (line.lineTotal ?? line.price*line.qty)/line.qty*returned),
      profit: Math.max(0, Number(line.lineProfit || 0) - (Number(line.lineProfit || 0) / Math.max(1, Number(line.qty || 1))) * returned),
    });
  }));
  todayRows.sort((a,b) => b.timestamp - a.timestamp);
  const todayProfit = todayRows.reduce((s,r)=>s+r.profit,0);
  const totalDue = state.sales.reduce((s,i)=> s + (i.amountDue||0), 0);

  const hq = normalize(state.historySearch);
  const visibleSales = state.sales.filter(s => {
    const dateKey = localDateInputValue(new Date(s.timestamp));
    const textMatches = !hq || normalize(s.customerName).includes(hq) || normalize(s.customerPhone).includes(hq) || normalize(s.id).includes(hq) || (s.items||[]).some(i => normalize(i.name).includes(hq) || normalize(i.id).includes(hq));
    const dateMatches = (!state.historyDateStart || dateKey >= state.historyDateStart) && (!state.historyDateEnd || dateKey <= state.historyDateEnd);
    const paymentMatches = !state.historyPayment || String(s.paymentMethod || '').toLowerCase() === state.historyPayment;
    return textMatches && dateMatches && paymentMatches;
  });

  return `
    <div class="page-head"><div><div class="page-title">Sales history</div><div class="page-desc">${state.sales.length} sale${state.sales.length===1?'':'s'} recorded.</div></div>${state.isAdmin?'<button class="btn btn-outline" data-action="export-csv" data-kind="sales">Export sales CSV</button>':''}</div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>Today's Sales</h3>${state.isAdmin ? `<span class="mono" style="font-size:12px; color:var(--ink-soft);">Profit ${fmtOrDash(todayProfit)}</span>` : ''}</div>
      <div class="card-body" style="overflow-x:auto;">
        ${todayRows.length ? `
        <table>
          <thead><tr><th>Time</th><th>Customer Name</th><th>Item</th><th>Quantity</th><th>Amount</th>${state.isAdmin ? '<th>Profit</th>' : ''}</tr></thead>
          <tbody>
            ${todayRows.map(r => `<tr>
              <td class="mono" style="font-size:12px;">${new Date(r.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
              <td>${escapeHtml(r.customerName)}</td>
              <td>${escapeHtml(r.itemName)}</td>
              <td class="qty-badge">${r.qty}</td>
              <td class="mono">${fmt(r.amount)}</td>
              ${state.isAdmin ? `<td class="mono" style="color:var(--moss);">${fmt(r.profit)}</td>` : ''}
            </tr>`).join('')}
          </tbody>
        </table>` : `<div style="color:var(--ink-soft); font-size:13.5px;">No sales yet today.</div>`}
      </div>
    </div>

    ${totalDue > 0 ? `<div class="banner banner-warn"><span class="mono" style="font-weight:600;">${fmt(totalDue)}</span><span>&nbsp;total outstanding — see <a href="#" data-nav="customers" style="color:inherit; text-decoration:underline;">Customers</a> for who owes what.</span></div>` : ''}

    <div class="card" style="margin-bottom:16px;">
      <div class="card-head"><h3>All sales <span class="action-note" style="display:inline-block;margin-left:6px;">${visibleSales.length} shown</span></h3><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;"><input class="search-input" id="history-search" style="width:220px;" placeholder="Search customer, receipt, or item…" value="${escapeHtml(state.historySearch)}"><input class="field-input" id="history-start" type="date" aria-label="Sales from date" value="${escapeHtml(state.historyDateStart)}" style="width:145px;"><input class="field-input" id="history-end" type="date" aria-label="Sales to date" value="${escapeHtml(state.historyDateEnd)}" style="width:145px;"><select class="field-input" id="history-payment" aria-label="Payment method" style="width:120px;"><option value="">All payments</option><option value="cash" ${state.historyPayment==='cash'?'selected':''}>Cash</option><option value="upi" ${state.historyPayment==='upi'?'selected':''}>UPI</option><option value="card" ${state.historyPayment==='card'?'selected':''}>Card</option><option value="due" ${state.historyPayment==='due'?'selected':''}>Due</option></select>${(state.historySearch||state.historyDateStart||state.historyDateEnd||state.historyPayment)?'<button class="btn btn-ghost btn-sm" data-action="clear-history-filters">Clear</button>':''}</div></div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Customer Name</th><th>Receipt ID</th><th>Items</th><th>Payment</th><th>Net amount</th></tr></thead>
          <tbody>
            ${visibleSales.map(s => renderHistoryRow(s)).join('') || `<tr><td colspan="7" style="color:var(--ink-soft);">No sales match the selected filters.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    ${renderDiscountApprovalsCard()}`;
}
function renderHistoryRow(s, singleLine){
  if(singleLine){ const dt=new Date(s.timestamp), returned=(s.returns||[]).reduce((n,r)=>n+(r.items||[]).filter(x=>x.id===singleLine.id).reduce((a,x)=>a+Number(x.qty||0),0),0), qty=Math.max(0,Number(singleLine.qty||0)-returned), amount=Math.max(0,Number(singleLine.lineTotal??singleLine.price*singleLine.qty)-Number(singleLine.lineTotal??singleLine.price*singleLine.qty)/Math.max(1,singleLine.qty)*returned); return `<tr data-action="toggle-sale" data-id="${s.id}" style="cursor:pointer"><td class="mono">${dt.toLocaleDateString()}</td><td class="mono">${dt.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td>${escapeHtml(s.customerName||'—')}</td><td>${escapeHtml(singleLine.name)}</td><td class="qty-badge">${qty}</td><td class="mono">${fmt(amount)}</td>${state.isAdmin?`<td class="mono" style="color:var(--moss)">${fmt(Math.max(0,Number(singleLine.lineProfit||0)-Number(singleLine.lineProfit||0)/Math.max(1,singleLine.qty)*returned))}</td>`:''}</tr>`; }
  const alreadyReturned = returnedQtyByItemClient(s);
  const isReturnFormOpen = state.returnForm && state.returnForm.saleId === s.id;
  const isExpanded = state.expandedSale === s.id;
  const itemSummary = s.items.map(i => `${escapeHtml(i.name)} ×${i.qty}`).join(', ');
  const dt = new Date(s.timestamp);
  const payLabel = { cash:'Cash', upi:'UPI', card:'Card', due:'Due' }[s.paymentMethod] || s.paymentMethod;

  const summaryRow = `
    <tr class="${isExpanded?'expanded-row':''}" style="cursor:pointer;" role="button" tabindex="0" aria-expanded="${isExpanded}" aria-label="${isExpanded?'Collapse':'Expand'} sale ${escapeHtml(s.id)}" data-action="toggle-sale" data-id="${s.id}">
      <td class="mono" style="font-size:12px; white-space:nowrap;">${dt.toLocaleDateString()}</td>
      <td class="mono" style="font-size:12px; white-space:nowrap;">${dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td>
      <td>${s.customerName ? escapeHtml(s.customerName) : '<span style="color:var(--ink-soft);">—</span>'}${s.edited ? `<span class="edited-badge">edited</span>` : ''}</td>
      <td class="mono" style="font-size:11.5px; color:var(--ink-soft);">${s.id}</td>
      <td style="max-width:260px;">${itemSummary}</td>
      <td>${payLabel}</td>
      <td class="mono" style="font-weight:600;">${fmt(saleNet(s))}${s.refundTotal > 0 ? `<div class="action-note" style="color:var(--stamp);">${fmt(s.refundTotal)} refunded</div>` : ''}${s.amountDue > 0 ? `<div class="due-badge" style="margin-top:3px; display:inline-block;">${fmt(s.amountDue)} due</div>` : ''}</td>
    </tr>`;

  if(!isExpanded) return summaryRow;

  const detailRow = `
    <tr><td colspan="7" style="background:var(--paper);">
      <div style="padding:10px 4px;">
        ${(s.customerPhone || s.customerAddress) ? `<div style="font-size:12px; color:var(--ink-soft); margin-bottom:6px;">${[s.customerPhone, s.customerAddress].filter(Boolean).map(escapeHtml).join(' · ')}</div>` : ''}
        ${s.items.map(i => `<div style="display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--ink-soft);"><span>${escapeHtml(i.name)} ×${i.qty}${alreadyReturned[i.id] ? ` <span style="color:var(--stamp);">(${alreadyReturned[i.id]} returned)</span>`:''}</span><span class="mono">${fmt(i.lineTotal ?? i.price*i.qty)}${state.isAdmin ? ` <span style="color:var(--moss);">(+${fmt(i.lineProfit||0)})</span>` : ''}</span></div>`).join('')}
        ${s.discountAmount > 0 ? `<div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Discount: ${fmt(s.discountAmount)} (${(s.discountPercent||0).toFixed(1)}%)</div>` : ''}

        ${(s.paymentHistory && s.paymentHistory.length) ? `
          <div style="margin-top:8px;">
            <div style="font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono';">Payment history</div>
            ${s.paymentHistory.map(p => `<div class="pay-history-row"><span>${new Date(p.timestamp).toLocaleDateString()} — ${p.method ? `${escapeHtml(String(p.method).toUpperCase())} · ` : ''}${escapeHtml(p.note||'')}</span><span class="mono">${fmt(p.amount)}</span></div>`).join('')}
          </div>` : ''}

        ${(s.returns && s.returns.length) ? `
          <div style="margin-top:8px;">
            <div style="font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono';">Returns</div>
            ${s.returns.map(r => `<div class="pay-history-row"><span>${new Date(r.timestamp).toLocaleDateString()} — ${r.items.map(i=>`${escapeHtml(i.name)} ×${i.qty}`).join(', ')}</span><span class="mono">${fmt(r.refundAmount)}</span></div>`).join('')}
          </div>` : ''}

        ${s.amountDue > 0 ? `
          <div style="margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            ${state.dueSettle && state.dueSettle.saleId===s.id ? `
              <input class="field-input" style="width:120px;" id="due-amount-input" type="number" step="0.01" placeholder="Amount">
              <select class="field-input" style="width:120px;" id="due-payment-method" aria-label="Due payment method"><option value="cash">Cash</option><option value="upi">UPI</option><option value="card">Card</option></select>
              <button class="btn btn-primary btn-sm" data-action="submit-due-payment" data-id="${s.id}">${ic.check} Record</button>
              <button class="btn btn-ghost btn-sm" data-action="cancel-due-settle">${ic.x}</button>
            ` : `
              <button class="btn btn-outline btn-sm" data-action="open-due-settle" data-id="${s.id}">Record payment</button>
              <button class="btn btn-outline btn-sm" data-action="pay-full-due" data-id="${s.id}">Clear full due (${fmt(s.amountDue)})</button>
            `}
          </div>` : ''}

        <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" data-action="edit-bill" data-id="${s.id}">${ic.edit} Edit bill</button>
          <button class="btn btn-outline btn-sm" data-action="open-return-form" data-id="${s.id}">${ic.x} Return items</button>
        </div>

        ${isReturnFormOpen ? renderReturnForm(s, alreadyReturned) : ''}
      </div>
    </td></tr>`;

  return summaryRow + detailRow;
}
function renderReturnForm(sale, alreadyReturned){
  const rf = state.returnForm;
  return `
    <div class="card" style="margin-top:10px; background:var(--paper);">
      <div class="card-body">
        <div style="font-size:12.5px; font-weight:600; margin-bottom:8px;">Return items from this bill</div>
        ${sale.items.map(i => {
          const returned = alreadyReturned[i.id] || 0;
          const max = i.qty - returned;
          const qty = rf.qtys[i.id] || 0;
          if(max <= 0) return `<div class="return-row"><span style="color:var(--ink-soft);">${escapeHtml(i.name)} — fully returned</span></div>`;
          return `
          <div class="return-row">
            <span>${escapeHtml(i.name)} <span class="mono" style="color:var(--ink-soft); font-size:11.5px;">(${max} returnable)</span></span>
            <div class="stepper">
              <button data-action="return-qty-dec" data-item="${i.id}" data-max="${max}">${ic.minus}</button>
              <span>${qty}</span>
              <button data-action="return-qty-inc" data-item="${i.id}" data-max="${max}">${ic.plus}</button>
            </div>
          </div>`;
        }).join('')}
        ${sale.amountDue > 0 ? `
          <label style="display:flex; align-items:center; gap:8px; font-size:12.5px; margin-top:12px; cursor:pointer;" data-action="toggle-adjust-due">
            <input type="checkbox" ${rf.adjustAgainstDue?'checked':''} style="pointer-events:none;">
            Adjust refund against the ${fmt(sale.amountDue)} due on this bill
          </label>` : ''}
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button class="btn btn-primary btn-sm" data-action="submit-return">${ic.check} Process return</button>
          <button class="btn btn-ghost btn-sm" data-action="cancel-return-form">Cancel</button>
        </div>
      </div>
    </div>`;

function expensePeriodRange(period){
  const now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(period==='today') return {start:today,end:today+86400000,label:'Today'};
  if(period==='week'){const d=new Date(today), day=d.getDay()||7, start=today-(day-1)*86400000;return {start,end:start+7*86400000,label:'This week'};}
  if(period==='lastMonth'){const start=new Date(now.getFullYear(),now.getMonth()-1,1).getTime();return {start,end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'};}
  if(period==='custom'){const start=Date.parse(`${state.expenseStart}T00:00:00`), end=Date.parse(`${state.expenseEnd}T00:00:00`);return Number.isFinite(start)&&Number.isFinite(end)&&end>=start?{start,end:end+86400000,label:'Custom'}:null;}
  return {start:new Date(now.getFullYear(),now.getMonth(),1).getTime(),end:new Date(now.getFullYear(),now.getMonth()+1,1).getTime(),label:'This month'};
}
function expensePreviousRange(period,current){
  if(!current) return null;
  const now=new Date();
  if(period==='today') return {start:current.start-86400000,end:current.start,label:'Yesterday'};
  if(period==='week') return {start:current.start-7*86400000,end:current.start,label:'Previous week'};
  if(period==='month') return {start:new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'};
  if(period==='lastMonth') return {start:new Date(now.getFullYear(),now.getMonth()-2,1).getTime(),end:new Date(now.getFullYear(),now.getMonth()-1,1).getTime(),label:'Previous month'};
  const duration=current.end-current.start;
  return {start:current.start-duration,end:current.start,label:'Previous equal period'};
}

  const paymentTotal=Number(d.cashSales||0)+Number(d.cardSales||0)+Number(d.upiSales||0);
  const paymentRow=(name,value,icon,tone)=>{const amount=Number(value||0), share=paymentTotal>0?(amount/paymentTotal)*100:0;return `<div class="closing-payment-row is-${tone}"><span class="closing-payment-icon">${icon}</span><span class="closing-payment-name">${name}</span><div><div class="closing-payment-bar"><i style="width:${Math.min(100,Math.max(0,share))}%"></i></div><div class="closing-payment-percent">${paymentTotal>0?share.toFixed(1)+'%':'No payment data'}</div></div><span class="closing-payment-amount" title="${fmt(amount)}">${analyticsCompactMoney(amount)}</span></div>`;};
  const statusTone=variance===null?'neutral':Math.abs(variance)<0.01?'success':'danger', statusTitle=variance===null?'CASH COUNT REQUIRED':Math.abs(variance)<0.01?'CASH DRAWER BALANCED':'CASH MISMATCH DETECTED', statusText=variance===null?'Enter actual counted cash to reconcile.':Math.abs(variance)<0.01?'Expected and actual cash match.':'Investigate the difference before closing the day.';
  return `<div class="page-head"><div><div class="page-title">Daily cash closing</div><div class="page-desc">Cash reconciliation for <strong>${escapeHtml(selectedDateLabel)}</strong></div></div><div style="display:flex;align-items:center;gap:8px"><label class="mono" style="font-size:11px;color:var(--ink-soft)">CLOSING DATE</label><input class="field-input" id="closing-date" type="date" value="${d.date}" style="width:160px"></div></div>
  <div class="card closing-hero"><div><div class="closing-eyebrow">Expected cash drawer</div><div class="closing-hero-value" title="${fmt(d.expectedCash)}">${analyticsCompactMoney(d.expectedCash)}</div><div class="closing-hero-sub">The amount that should be in the drawer after today's cash activity.</div></div><div class="closing-calculation"><div class="closing-calc-title">How this is calculated</div><div class="closing-calc-row"><span>Opening cash float</span><strong>${fmt(d.openingCash)}</strong></div><div class="closing-calc-row"><span>+ Cash sales</span><strong>${fmt(d.cashSales)}</strong></div><div class="closing-calc-row"><span>− Cash refunds</span><strong>${fmt(d.cashRefunds)}</strong></div><div class="closing-calc-row"><span>− Cash expenses</span><strong>${fmt(d.cashExpenses)}</strong></div><div class="closing-calc-row closing-calc-total"><span>Expected drawer amount</span><strong>${fmt(d.expectedCash)}</strong></div></div></div>
  <div class="closing-reconcile card bi-tone-${statusTone}"><div><div class="closing-reconcile-title"><span class="bi-status-badge">${statusTitle}</span><span>${statusText}</span></div><div class="closing-reconcile-meta" style="margin-top:8px"><span>Expected: <strong>${fmt(d.expectedCash)}</strong></span>${variance===null?'<span>Actual: <strong>Not counted</strong></span>':`<span>Actual: <strong>${fmt(counted)}</strong></span><span>Difference: <strong>${variance>0?'+':''}${fmt(variance)}</strong></span>`}</div></div>${variance===null?'<span class="action-note">Count the drawer below</span>':variance===0?'<span class="action-note">Ready to close</span>':'<span class="action-note">Review before closing</span>'}</div>
  <div class="closing-summary-grid"><div class="card closing-summary-card"><div class="analytics-kpi-head"><span class="analytics-kpi-icon">${ic.banknote}</span><span>Today's net sales</span></div><div class="closing-summary-value" title="${fmt(d.netSales)}">${analyticsCompactMoney(d.netSales)}</div><div class="action-note">${d.saleCount} completed sale${d.saleCount===1?'':'s'} · after returns</div></div><div class="card closing-summary-card is-expense"><div class="analytics-kpi-head"><span class="analytics-kpi-icon">${ic.receipt}</span><span>Cash expenses</span></div><div class="closing-summary-value" title="${fmt(d.cashExpenses)}">${analyticsCompactMoney(d.cashExpenses)}</div><div class="action-note">${d.cashExpenses?`${d.expenseCount} expense record${d.expenseCount===1?'':'s'} to review`:'No cash expenses recorded'}</div></div></div>
  <div class="card closing-payment-card"><div class="card-head"><div><h3>Payment breakdown</h3><div class="action-note">How today's received payments are distributed</div></div><span class="mono" style="font-size:11px;color:var(--ink-soft)">TOTAL ${fmt(paymentTotal)}</span></div><div class="card-body">${paymentRow('Cash',d.cashSales,ic.banknote,'cash')}${paymentRow('Card',d.cardSales,ic.creditCard,'card')}${paymentRow('UPI',d.upiSales,ic.smartphone,'upi')}</div></div>
  <div class="card"><div class="card-head"><h3>Close this day</h3><span class="mono" style="font-size:11px;color:var(--ink-soft)">${saved.closedAt?`Last saved ${new Date(saved.closedAt).toLocaleString()}`:'Not closed yet'}</span></div><div class="card-body"><div class="field-row"><div class="field"><label>Opening cash float</label><input class="field-input" id="closing-opening" type="number" step="0.01" min="0" value="${saved.openingCash??0}"></div><div class="field"><label>Counted cash in drawer</label><input class="field-input" id="closing-counted" type="number" step="0.01" min="0" value="${counted}" placeholder="Count cash and enter amount"></div></div><div class="field"><label>Closing note</label><input class="field-input" id="closing-note" value="${escapeHtml(saved.note||'')}" placeholder="Optional explanation for a cash difference"></div>${variance!==null?`<div class="banner ${Math.abs(variance)<0.01?'banner-info':'banner-warn'}">${Math.abs(variance)<0.01?'Drawer balances exactly.':`Cash variance: ${variance>0?'+':''}${fmt(variance)}`}</div>`:''}<button class="btn btn-primary" data-action="save-daily-closing">${ic.check} Save daily closing</button></div></div>`;
}

function parseCsv(text){ const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean); if(lines.length<2) throw new Error('CSV needs a header row and at least one data row'); const split=line=>{const out=[];let v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){v+='"';i++;}else if(c==='"')q=!q;else if(c===','&&!q){out.push(v.trim());v='';}else v+=c;}out.push(v.trim());return out;};const headers=split(lines[0]).map(h=>h.trim());return lines.slice(1).map(line=>Object.fromEntries(split(line).map((v,i)=>[headers[i]||'',v]))); }
async function importCsvFile(file,kind){ try{const rows=parseCsv(await file.text());const r=await api('POST','/api/imports/'+kind,{rows});showToast(`Imported ${r.added} new and updated ${r.updated||0} records`);await refreshInventory();await refreshSales();render();}catch(e){showToast(e.errors?e.errors.join(' · '):e.message);} }

/* ============ EVENTS ============ */
function bindEvents(){
  const app = document.getElementById('app');

  const invoicePrefixEl = app.querySelector('#set-invoice-prefix');
  const invoiceStartEl = app.querySelector('#set-invoice-start');
  const invoicePreviewEl = app.querySelector('#invoice-number-preview');
  if(invoicePrefixEl && invoiceStartEl && invoicePreviewEl){
    const updateInvoicePreview = () => {
      const start = Math.max(1, Math.floor(Number(invoiceStartEl.value) || 1));
      invoicePreviewEl.textContent = `${invoicePrefixEl.value || 'INV-'}${String(start).padStart(6, '0')}`;
    };
    invoicePrefixEl.addEventListener('input', updateInvoicePreview);
    invoiceStartEl.addEventListener('input', updateInvoicePreview);
  }

  app.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', async (e) => {
    e.preventDefault();
    const target = el.getAttribute('data-nav');
    if(state.editingSaleId && target !== 'sale'){
      state.cart = []; resetCheckout(); state.editingSaleId = null; state.editingSaleOriginal = null;
    }
    state.view = target;
    state.billReview = null; state.quickAdd = null; state.unmatched = null; state.editingId = null; state.editItemDraft = null;
    state.loginPrompt = null; state.loginError = ''; pendingAdminAction = null;
    state.homeEditing = false; state.returnForm = null; state.employeeDraft = null;
    render();
    if(state.view === 'history' && state.isStaff){ await refreshSales(); await refreshDiscountApprovals(); render(); }
    if(state.view === 'dashboard' && state.isAdmin){ await refreshSales(); await refreshExpenses(); render(); }
    if(state.view === 'analytics' && state.isAdmin){ await refreshSales(); await refreshExpenses(); await refreshAnalytics(); render(); }
    if(state.view === 'expenses' && state.isStaff){ await refreshExpenses(); render(); }
    if(state.view === 'employees' && state.isAdmin){ await refreshEmployees(); render(); }
    if((state.view === 'attendance' || state.view === 'salaries') && state.isAdmin){ await refreshEmployees(); await refreshAttendance(); render(); }
    if(state.view === 'closing' && state.isAdmin){ await refreshDailyClosing(); render(); }
  }));
  app.querySelectorAll('[data-nav]').forEach(el => {
    if(!['BUTTON','A'].includes(el.tagName)){ el.setAttribute('role','button'); if(el.tabIndex < 0) el.tabIndex=0; }
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
  });

  const searchEl = app.querySelector('#inv-search');
  if(searchEl){
    searchEl.addEventListener('input', e => {
      state.invSearch = e.target.value;
      render();
      const el = document.getElementById('inv-search');
      if(el){ const v = el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
    });
  }
  const historySearchEl = app.querySelector('#history-search');
  if(historySearchEl){
    historySearchEl.addEventListener('input', e => { state.historySearch = e.target.value; render(); document.getElementById('history-search')?.focus(); });

  const historyStart = app.querySelector('#history-start');
  if(historyStart) historyStart.addEventListener('change', e => { state.historyDateStart=e.target.value; render(); });
  const historyEnd = app.querySelector('#history-end');
  if(historyEnd) historyEnd.addEventListener('change', e => { state.historyDateEnd=e.target.value; render(); });
  const historyPayment = app.querySelector('#history-payment');
  if(historyPayment) historyPayment.addEventListener('change', e => { state.historyPayment=e.target.value; render(); });
  const customerSearchEl = app.querySelector('#customer-search');

    customerSearchEl.addEventListener('input', e => { state.customerSearch=e.target.value; render(); document.getElementById('customer-search')?.focus(); });

  }
  const categoryFilter = app.querySelector('#inventory-category-filter');
  if(categoryFilter) categoryFilter.addEventListener('change', e => { state.inventoryCategoryFilter=e.target.value; render(); });
  const supplierFilter = app.querySelector('#inventory-supplier-filter');
  if(supplierFilter) supplierFilter.addEventListener('change', e => { state.inventorySupplierFilter=e.target.value; render(); });
  const closingDate = app.querySelector('#closing-date');
  if(closingDate) closingDate.addEventListener('change', async e => { state.closingDate=e.target.value; await refreshDailyClosing(); render(); });
  const dashboardStart = app.querySelector('#dashboard-start');
  if(dashboardStart) dashboardStart.addEventListener('change', e => { state.dashboardStart=e.target.value; render(); });
  const dashboardEnd = app.querySelector('#dashboard-end');
  if(dashboardEnd) dashboardEnd.addEventListener('change', e => { state.dashboardEnd=e.target.value; render(); });
  const analyticsStart = app.querySelector('#analytics-start');
  if(analyticsStart) analyticsStart.addEventListener('change', async e => { state.analyticsStart=e.target.value; await refreshAnalytics(); render(); });
  const analyticsEnd = app.querySelector('#analytics-end');
  if(analyticsEnd) analyticsEnd.addEventListener('change', async e => { state.analyticsEnd=e.target.value; await refreshAnalytics(); render(); });
  const aiInput = app.querySelector('#ai-question');
  if(aiInput){
    aiInput.addEventListener('input', e => { state.aiDraft = e.target.value; });
    aiInput.addEventListener('keydown', e => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submitCopilotQuestion(aiInput.value); }
    });
  }
  const expenseStart = app.querySelector('#expense-start');
  if(expenseStart) expenseStart.addEventListener('change', e => { state.expenseStart=e.target.value; render(); });
  const expenseEnd = app.querySelector('#expense-end');
  if(expenseEnd) expenseEnd.addEventListener('change', e => { state.expenseEnd=e.target.value; render(); });
  const attendanceDate = app.querySelector('#attendance-date');
  if(attendanceDate) attendanceDate.addEventListener('change', async e => { state.attendanceDate=e.target.value; await refreshAttendance(); render(); });
  const salaryMonth = app.querySelector('#salary-month');
  if(salaryMonth) salaryMonth.addEventListener('change', async e => { state.salaryMonth=e.target.value; await refreshAttendance(); render(); });
  const expenseCategorySearch = app.querySelector('#exp-category-search');
  const expenseCategory = app.querySelector('#exp-category');
  if(expenseCategorySearch && expenseCategory){
    expenseCategorySearch.addEventListener('input', e => {
      const query=e.target.value.trim().toLowerCase();
      Array.from(expenseCategory.options).forEach((option,index)=>{ option.hidden=index>0 && query && !option.textContent.toLowerCase().includes(query); });
      const selected=Array.from(expenseCategory.options).find(o=>!o.hidden&&o.value);
      if(selected && (!expenseCategory.value || expenseCategory.options[expenseCategory.selectedIndex]?.hidden)) expenseCategory.value=selected.value;
    });
    expenseCategory.addEventListener('change', e => {
      const option=e.target.options[e.target.selectedIndex], suggested=option?.getAttribute('data-suggested-type');
      const typeSelect=app.querySelector('#exp-type');
      if(typeSelect && suggested) typeSelect.value=suggested==='fixed' && state.isAdmin?'fixed':'variable';
    });
  }
  const saleSearchEl = app.querySelector('#sale-search');
  if(saleSearchEl){
    saleSearchEl.addEventListener('input', e => { state.invSearch = e.target.value; render(); document.getElementById('sale-search')?.focus(); });
    saleSearchEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); handleBarcodeEnter(saleSearchEl.value); } });
    const el = document.getElementById('sale-search');
    if(el){ const v = el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
  }
  const loginPw = app.querySelector('#login-password');
  if(loginPw){
    loginPw.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitLogin(loginPw.value); } });
  }
  const csvFile=app.querySelector('#csv-file'); if(csvFile) csvFile.addEventListener('change',()=>{if(csvFile.files[0])importCsvFile(csvFile.files[0],state.importKind);});
  const themeSelect=app.querySelector('#set-theme');
  const customAccent=app.querySelector('#set-custom-accent');
  const presetAccents={general:'#B8863B',grocery:'#39824A',footwear:'#294C7A',fashion:'#A34B70'};
  const persistVisualPreferences=async (patch)=>{
    Object.assign(state.settings,patch);
    applyAppearance();
    try{ await api('PUT','/api/settings',patch); showToast('Theme saved'); }
    catch(e){ showToast(e.message); }
    render();
  };
  if(themeSelect) themeSelect.addEventListener('change',async e=>{
    const theme=e.target.value, accent=presetAccents[theme]||state.settings.accentColor;
    if(customAccent) customAccent.value=accent;
    await persistVisualPreferences({theme,accentColor:accent});
  });
  if(customAccent) customAccent.addEventListener('change',async e=>{
    const accent=/^#[0-9a-fA-F]{6}$/.test(e.target.value)?e.target.value:state.settings.accentColor;
    await persistVisualPreferences({accentColor:accent});
  });

  // Discount value / amount-paid inputs: live-update the summary without a
  // full re-render (keeps focus while typing).
  const discountValEl = app.querySelector('#discount-value');
  if(discountValEl){
    discountValEl.addEventListener('input', () => {
      state.checkout.discountValue = discountValEl.value;
      const summary = document.getElementById('checkout-summary');
      if(summary) summary.innerHTML = renderCheckoutSummary();
    });
  }
  const amountPaidEl = app.querySelector('#amount-paid');
  if(amountPaidEl){
    amountPaidEl.addEventListener('input', () => {
      state.checkout.amountPaid = amountPaidEl.value;
      const summary = document.getElementById('checkout-summary');
      if(summary) summary.innerHTML = renderCheckoutSummary();
    });
  }
  const custNameEl = app.querySelector('#customer-name');
  if(custNameEl) custNameEl.addEventListener('input', () => { state.checkout.customerName = custNameEl.value; });
  const custPhoneEl = app.querySelector('#customer-phone');
  if(custPhoneEl) custPhoneEl.addEventListener('input', () => {
    const clean = sanitizePhone(custPhoneEl.value);
    if(custPhoneEl.value !== clean) custPhoneEl.value = clean;
    state.checkout.customerPhone = clean;
  });
  const custAddressEl = app.querySelector('#customer-address');
  if(custAddressEl) custAddressEl.addEventListener('input', () => { state.checkout.customerAddress = custAddressEl.value; });
  ['home-phone', 'home-phone2'].forEach(elId => {
    const el = app.querySelector('#'+elId);
    if(el) el.addEventListener('input', () => {
      const clean = sanitizePhone(el.value);
      if(el.value !== clean) el.value = clean;
    });
  });

  app.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    if(!['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(el.tagName)){ el.setAttribute('role','button'); if(el.tabIndex < 0) el.tabIndex=0; }
    el.addEventListener('click', () => handleAction(action, el));
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
  });

  // Bill-review row inputs: mutate state directly and keep cost/margin/sell
  // in sync without a full re-render (which would drop focus mid-type).
  app.querySelectorAll('[data-review]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = Number(el.getAttribute('data-idx'));
      const field = el.getAttribute('data-review');
      const row = state.billReview[idx];
      if(field === 'name' || field === 'code' || field === 'category'){
        row[field] = el.value;
        return;
      }
      const rowEl = el.closest('.review-row');
      if(field === 'quantity'){
        row.quantity = Number(el.value);
      }else if(field === 'cost'){
        row.cost = Number(el.value);
        row.sell = sellFromMargin(row.cost, row.margin);
        const sellInput = rowEl.querySelector('[data-review="sell"]');
        if(sellInput) sellInput.value = row.sell;
      }else if(field === 'margin'){
        row.margin = Number(el.value);
        row.sell = sellFromMargin(row.cost, row.margin);
        const sellInput = rowEl.querySelector('[data-review="sell"]');
        if(sellInput) sellInput.value = row.sell;
      }else if(field === 'sell'){
        row.sell = Number(el.value);
        row.margin = marginFromSell(row.cost, row.sell);
        const marginInput = rowEl.querySelector('[data-review="margin"]');
        if(marginInput) marginInput.value = row.margin;
      }
    });
  });

  // Quick-add card: same live cost/margin/sell sync via direct DOM updates.
  const qaCost = app.querySelector('#qa-cost');
  const qaMargin = app.querySelector('#qa-margin');
  const qaSell = app.querySelector('#qa-sell');
  if(qaCost && qaMargin && qaSell){
    const recomputeSell = () => { qaSell.value = sellFromMargin(qaCost.value, qaMargin.value); };
    const recomputeMargin = () => { qaMargin.value = marginFromSell(qaCost.value, qaSell.value); };
    qaCost.addEventListener('input', recomputeSell);
    qaMargin.addEventListener('input', recomputeSell);
    qaSell.addEventListener('input', recomputeMargin);
  }

  // Edit-item card: same pattern.
  const eiCost = app.querySelector('#ei-cost');
  const eiMargin = app.querySelector('#ei-margin');
  const eiSell = app.querySelector('#ei-sell');
  if(eiCost && eiMargin && eiSell){
    const recomputeSell = () => { eiSell.value = sellFromMargin(eiCost.value, eiMargin.value); };
    const recomputeMargin = () => { eiMargin.value = marginFromSell(eiCost.value, eiSell.value); };
    eiCost.addEventListener('input', recomputeSell);
    eiMargin.addEventListener('input', recomputeSell);
    eiSell.addEventListener('input', recomputeMargin);
  }
}

async function handleAction(action, el){
  const id = el.getAttribute('data-id');

  if(action === 'enter-home'){ state.view='home'; render(); return; }
  if(action === 'open-login'){ state.loginPrompt={message:'Sign in with your Admin or Employee account.',cancellable:true,allowEmployee:true};state.loginRole='admin';state.loginError='';render();return; }
  if(action === 'pick-inventory-image'){ triggerUpload('inventory-image'); return; }
  if(action === 'export-csv'){ window.location.href=`/api/exports/${el.getAttribute('data-kind')}`; return; }
  if(action === 'scan-bill') return requireStaff(() => triggerUpload('bill'));
  if(action === 'scan-tag') return triggerUpload('tag');
  if(action === 'toggle-sidebar'){ state.sidebarCollapsed=!state.sidebarCollapsed; render(); return; }
  if(action === 'ai-ask') return submitCopilotQuestion(el.getAttribute('data-question') || '');
  if(action === 'ai-send') return submitCopilotQuestion(document.getElementById('ai-question')?.value || '');
  if(action === 'bill-ai-toggle'){
    if(state.billAi.panelOpen && !state.billAi.minimized) return;
    state.billAi.panelOpen = true; state.billAi.minimized = false;
    if(state.billAi.state !== 'offline' && state.isAdmin){
      state.billAi.state = 'thinking';
      render();
      setTimeout(() => { if(state.billAi.panelOpen && state.billAi.state === 'thinking'){ state.billAi.state = state.billAi.insightCount ? 'insight_available' : 'idle'; render(); } }, 850);
    }else{ state.billAi.state = state.billAi.state === 'offline' ? 'offline' : (state.billAi.insightCount ? 'insight_available' : 'idle'); render(); }
    return;
  }
  if(action === 'bill-ai-close'){ state.billAi.panelOpen = false; render(); return; }
  if(action === 'bill-ai-minimize'){ state.billAi.minimized = true; render(); return; }
  if(action === 'bill-ai-admin-login'){ state.billAi.panelOpen=false; state.loginPrompt={message:'Sign in as Admin to use Bill Ai.',cancellable:true,allowEmployee:false};state.loginRole='admin';state.loginError='';render();return; }
  if(action === 'dashboard-period'){ state.dashboardPeriod=el.getAttribute('data-period')||'month'; render(); return; }
  if(action === 'analytics-period'){ state.analyticsPeriod=el.getAttribute('data-period')||'month'; state.analytics=null; render(); await refreshAnalytics(); render(); return; }
  if(action === 'expense-period'){ state.expensePeriod=el.getAttribute('data-period')||'month'; render(); return; }
  if(action === 'set-trend-days'){ state.dashboardTrendDays=Number(el.getAttribute('data-days'))===14?14:7; render(); return; }
  if(action === 'clear-history-filters'){ state.historySearch=''; state.historyDateStart=''; state.historyDateEnd=''; state.historyPayment=''; render(); return; }
  if(action === 'pick-csv'){ state.importKind=el.getAttribute('data-kind'); document.getElementById('csv-file')?.click(); return; }
  if(action === 'save-expense'){ try{ const category=document.getElementById('exp-category').value; if(!category) throw new Error('Select an expense category'); await api('POST','/api/expenses',{date:document.getElementById('exp-date').value,type:document.getElementById('exp-type').value,category,amount:document.getElementById('exp-amount').value,paymentMethod:document.getElementById('exp-payment-method').value,description:document.getElementById('exp-description').value}); await refreshExpenses();showToast('Expense recorded');render();}catch(e){showToast(e.message)} return; }
  if(action === 'save-daily-closing'){ try{ const result=await api('PUT','/api/reports/daily-closing',{date:state.closingDate,openingCash:document.getElementById('closing-opening').value,countedCash:document.getElementById('closing-counted').value,note:document.getElementById('closing-note').value});state.dailyClosing=result;showToast('Daily closing saved');render();}catch(e){showToast(e.message)} return; }
  if(action === 'add-expense-category'){ const name=prompt('New expense category'); if(!name)return; try{await api('POST','/api/expenses/categories',{name});await refreshExpenses();render();}catch(e){showToast(e.message)} return; }
  if(action === 'delete-expense'){ if(!confirm('Delete this expense?'))return; try{await api('DELETE','/api/expenses/'+id);await refreshExpenses();render();}catch(e){showToast(e.message)} return; }

  if(action === 'apply-default-margin'){
    const margin = Number(document.getElementById('default-margin').value) || 0;
    state.settings.defaultMarginPercent = margin;
    state.billReview.forEach(row => { row.margin = margin; row.sell = sellFromMargin(row.cost, margin); });
    render(); return;
  }
  if(action === 'confirm-bill-review') return confirmBillReview();
  if(action === 'cancel-bill-review'){ state.billReview = null; render(); return; }
  if(action === 'remove-review-row'){
    state.billReview.splice(Number(el.getAttribute('data-idx')), 1);
    if(!state.billReview.length) state.billReview = null;
    render(); return;
  }

  if(action === 'open-manual-add') return requireAdmin(() => {
    state.inventoryImageDraft = null;
    state.quickAdd = { title: 'Add item manually', name:'', code:'', category:'', costPrice:0, margin: state.settings.defaultMarginPercent, price:0, quantity:1 };

  if(action === 'quickadd-from-unmatched') return requireAdmin(() => {
    state.quickAdd = {
      title: 'Add scanned item to inventory',
      name: state.unmatched.name, code: state.unmatched.code||'', category: '',

  if(action === 'dismiss-unmatched'){ state.unmatched = null; render(); return; }
  if(action === 'close-quick-add'){ state.quickAdd = null; render(); return; }

  if(action === 'edit-item') return requireAdmin(() => {

  if(action === 'edit-bill') return requireAdmin(() => {

  if(action === 'cancel-return-form'){ state.returnForm = null; render(); return; }

    const itemId = el.getAttribute('data-item');

    state.returnForm.qtys[itemId] = next;
    render(); return;
  }
  if(action === 'toggle-adjust-due'){
    state.returnForm.adjustAgainstDue = !state.returnForm.adjustAgainstDue;

  if(action === 'submit-return'){ return submitReturn(); }
