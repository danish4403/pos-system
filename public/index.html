  const expenseCategory = app.querySelector('#exp-category');
  if(expenseCategorySearch && expenseCategory){
    expenseCategorySearch.addEventListener('input', e => {
      const query=e.target.value.trim().toLowerCase();
      Array.from(expenseCategory.options).forEach((option,index)=>{ option.hidden=index>0 && query && !option.textContent.toLowerCase().includes(query); });
      const selected=Array.from(expenseCategory.options).find(o=>!o.hidden&&o.value);
      if(selected && (!expenseCategory.value || expenseCategory.options[expenseCategory.selectedIndex]?.hidden)) expenseCategory.value=selected.value;
    });
    expenseCategory.addEventListener('change', e => {
      const option=e.target.options[e.target.selectedIndex], suggested=option?.getAttribute('data-suggested-type');
      const typeSelect=app.querySelector('#exp-type');
      if(typeSelect && suggested) typeSelect.value=suggested==='fixed' && state.isAdmin?'fixed':'variable';
    });
  }
  const saleSearchEl = app.querySelector('#sale-search');
  if(saleSearchEl){
    saleSearchEl.addEventListener('input', e => { state.invSearch = e.target.value; render(); document.getElementById('sale-search')?.focus(); });
    saleSearchEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); handleBarcodeEnter(saleSearchEl.value); } });
    const el = document.getElementById('sale-search');
    if(el){ const v = el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
  }
  const loginPw = app.querySelector('#login-password');
  if(loginPw){
    loginPw.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitLogin(loginPw.value); } });
  }
  const csvFile=app.querySelector('#csv-file'); if(csvFile) csvFile.addEventListener('change',()=>{if(csvFile.files[0])importCsvFile(csvFile.files[0],state.importKind);});
  const themeSelect=app.querySelector('#set-theme');
  const customAccent=app.querySelector('#set-custom-accent');
  const presetAccents={general:'#B8863B',grocery:'#39824A',footwear:'#294C7A',fashion:'#A34B70'};
  const persistVisualPreferences=async (patch)=>{
    Object.assign(state.settings,patch);
    applyAppearance();
    try{ await api('PUT','/api/settings',patch); showToast('Theme saved'); }
    catch(e){ showToast(e.message); }
    render();
  };
  if(themeSelect) themeSelect.addEventListener('change',async e=>{
    const theme=e.target.value, accent=presetAccents[theme]||state.settings.accentColor;
    if(customAccent) customAccent.value=accent;
    await persistVisualPreferences({theme,accentColor:accent});
  });
  if(customAccent) customAccent.addEventListener('change',async e=>{
    const accent=/^#[0-9a-fA-F]{6}$/.test(e.target.value)?e.target.value:state.settings.accentColor;
    await persistVisualPreferences({accentColor:accent});
  });

  // Discount value / amount-paid inputs: live-update the summary without a
  // full re-render (keeps focus while typing).
  const discountValEl = app.querySelector('#discount-value');
  if(discountValEl){
    discountValEl.addEventListener('input', () => {
      state.checkout.discountValue = discountValEl.value;
      const summary = document.getElementById('checkout-summary');
      if(summary) summary.innerHTML = renderCheckoutSummary();
    });
  }
  const amountPaidEl = app.querySelector('#amount-paid');
  if(amountPaidEl){
    amountPaidEl.addEventListener('input', () => {
      state.checkout.amountPaid = amountPaidEl.value;
      const summary = document.getElementById('checkout-summary');
      if(summary) summary.innerHTML = renderCheckoutSummary();
    });
  }
  const custNameEl = app.querySelector('#customer-name');
  if(custNameEl) custNameEl.addEventListener('input', () => { state.checkout.customerName = custNameEl.value; });
  const custPhoneEl = app.querySelector('#customer-phone');
  if(custPhoneEl) custPhoneEl.addEventListener('input', () => {
    const clean = sanitizePhone(custPhoneEl.value);
    if(custPhoneEl.value !== clean) custPhoneEl.value = clean;
    state.checkout.customerPhone = clean;
  });
  const custAddressEl = app.querySelector('#customer-address');
  if(custAddressEl) custAddressEl.addEventListener('input', () => { state.checkout.customerAddress = custAddressEl.value; });
  ['home-phone', 'home-phone2'].forEach(elId => {
    const el = app.querySelector('#'+elId);
    if(el) el.addEventListener('input', () => {
      const clean = sanitizePhone(el.value);
      if(el.value !== clean) el.value = clean;
    });
  });

  app.querySelectorAll('[data-action]').forEach(el => {
    const action = el.getAttribute('data-action');
    if(!['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(el.tagName)){ el.setAttribute('role','button'); if(el.tabIndex < 0) el.tabIndex=0; }
    el.addEventListener('click', () => handleAction(action, el));
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
  });

  // Bill-review row inputs: mutate state directly and keep cost/margin/sell
  // in sync without a full re-render (which would drop focus mid-type).
  app.querySelectorAll('[data-review]').forEach(el => {
    el.addEventListener('input', () => {
      const idx = Number(el.getAttribute('data-idx'));
      const field = el.getAttribute('data-review');
      const row = state.billReview[idx];
      if(field === 'name' || field === 'code' || field === 'category'){
        row[field] = el.value;
        return;
      }
      const rowEl = el.closest('.review-row');
      if(field === 'quantity'){
        row.quantity = Number(el.value);
      }else if(field === 'cost'){
        row.cost = Number(el.value);
        row.sell = sellFromMargin(row.cost, row.margin);
        const sellInput = rowEl.querySelector('[data-review="sell"]');
        if(sellInput) sellInput.value = row.sell;
      }else if(field === 'margin'){
        row.margin = Number(el.value);
        row.sell = sellFromMargin(row.cost, row.margin);
        const sellInput = rowEl.querySelector('[data-review="sell"]');
        if(sellInput) sellInput.value = row.sell;
      }else if(field === 'sell'){
        row.sell = Number(el.value);
        row.margin = marginFromSell(row.cost, row.sell);
        const marginInput = rowEl.querySelector('[data-review="margin"]');
        if(marginInput) marginInput.value = row.margin;
      }
    });
  });

  // Quick-add card: same live cost/margin/sell sync via direct DOM updates.
  const qaCost = app.querySelector('#qa-cost');
  const qaMargin = app.querySelector('#qa-margin');
  const qaSell = app.querySelector('#qa-sell');
  if(qaCost && qaMargin && qaSell){
    const recomputeSell = () => { qaSell.value = sellFromMargin(qaCost.value, qaMargin.value); };
    const recomputeMargin = () => { qaMargin.value = marginFromSell(qaCost.value, qaSell.value); };
    qaCost.addEventListener('input', recomputeSell);
    qaMargin.addEventListener('input', recomputeSell);
    qaSell.addEventListener('input', recomputeMargin);
  }

  // Edit-item card: same pattern.
  const eiCost = app.querySelector('#ei-cost');
  const eiMargin = app.querySelector('#ei-margin');
  const eiSell = app.querySelector('#ei-sell');
  if(eiCost && eiMargin && eiSell){
    const recomputeSell = () => { eiSell.value = sellFromMargin(eiCost.value, eiMargin.value); };
    const recomputeMargin = () => { eiMargin.value = marginFromSell(eiCost.value, eiSell.value); };
    eiCost.addEventListener('input', recomputeSell);
    eiMargin.addEventListener('input', recomputeSell);
    eiSell.addEventListener('input', recomputeMargin);
  }
}

async function handleAction(action, el){
  const id = el.getAttribute('data-id');

  if(action === 'enter-home'){ state.view='home'; render(); return; }
  if(action === 'open-login'){ state.loginPrompt={message:'Sign in with your Admin or Employee account.',cancellable:true,allowEmployee:true};state.loginRole='admin';state.loginError='';render();return; }
  if(action === 'landing-login'){
    const role = el.getAttribute('data-role');
    if(role !== 'admin' && role !== 'employee') return;
    state.loginRole = role;
    state.loginPrompt = { message: role === 'employee' ? 'Sign in with your employee account.' : 'Sign in with your admin password.', cancellable: true, allowEmployee: true };
    state.loginError = '';
    render();
    setTimeout(() => document.getElementById('login-password')?.focus(), 0);
    return;
  }
  if(action === 'pick-inventory-image'){ triggerUpload('inventory-image'); return; }
  if(action === 'export-csv'){ window.location.href=`/api/exports/${el.getAttribute('data-kind')}`; return; }
  if(action === 'scan-bill') return requireStaff(() => triggerUpload('bill'));
  if(action === 'scan-tag') return triggerUpload('tag');
  if(action === 'toggle-sidebar'){ state.sidebarCollapsed=!state.sidebarCollapsed; render(); return; }
  if(action === 'ai-ask') return submitCopilotQuestion(el.getAttribute('data-question') || '');
  if(action === 'ai-send') return submitCopilotQuestion(document.getElementById('ai-question')?.value || '');
  if(action === 'bill-ai-toggle'){
    if(state.billAi.panelOpen && !state.billAi.minimized){
      state.billAi.panelOpen = false;
      render();
      return;
    }
    state.billAi.panelOpen = true; state.billAi.minimized = false;
    if(state.billAi.state !== 'offline' && state.isAdmin){
      state.billAi.state = 'thinking';
      render();
      setTimeout(() => { if(state.billAi.panelOpen && state.billAi.state === 'thinking'){ state.billAi.state = state.billAi.insightCount ? 'insight_available' : 'idle'; render(); } }, 850);
    }else{ state.billAi.state = state.billAi.state === 'offline' ? 'offline' : (state.billAi.insightCount ? 'insight_available' : 'idle'); render(); }
    return;
  }
  if(action === 'bill-ai-close'){ state.billAi.panelOpen = false; render(); return; }
  if(action === 'bill-ai-minimize'){ state.billAi.minimized = true; render(); return; }
  if(action === 'bill-ai-admin-login'){ state.billAi.panelOpen=false; state.loginPrompt={message:'Sign in as Admin to use Bill Ai.',cancellable:true,allowEmployee:false};state.loginRole='admin';state.loginError='';render();return; }
  if(action === 'analytics-period'){ state.analyticsPeriod=el.getAttribute('data-period')||'month'; state.analytics=null; render(); await refreshAnalytics(); render(); return; }
  if(action === 'retry-analytics'){ await refreshAnalytics(); render(); return; }
  if(action === 'expense-period'){ state.expensePeriod=el.getAttribute('data-period')||'month'; render(); return; }
  if(action === 'set-trend-days'){ state.dashboardTrendDays=Number(el.getAttribute('data-days'))===14?14:7; render(); return; }
  if(action === 'clear-history-filters'){ state.historySearch=''; state.historyDateStart=''; state.historyDateEnd=''; state.historyPayment=''; render(); return; }
  if(action === 'pick-csv'){ state.importKind=el.getAttribute('data-kind'); document.getElementById('csv-file')?.click(); return; }
  if(action === 'save-expense'){ try{ const category=document.getElementById('exp-category').value; if(!category) throw new Error('Select an expense category'); await api('POST','/api/expenses',{date:document.getElementById('exp-date').value,type:document.getElementById('exp-type').value,category,amount:document.getElementById('exp-amount').value,paymentMethod:document.getElementById('exp-payment-method').value,description:document.getElementById('exp-description').value}); await refreshExpenses();showToast('Expense recorded');render();}catch(e){showToast(e.message)} return; }
  if(action === 'save-daily-closing'){ try{ const result=await api('PUT','/api/reports/daily-closing',{date:state.closingDate,openingCash:document.getElementById('closing-opening').value,countedCash:document.getElementById('closing-counted').value,note:document.getElementById('closing-note').value});state.dailyClosing=result;showToast('Daily closing saved');render();}catch(e){showToast(e.message)} return; }
  if(action === 'add-expense-category'){ const name=prompt('New expense category'); if(!name)return; try{await api('POST','/api/expenses/categories',{name});await refreshExpenses();render();}catch(e){showToast(e.message)} return; }
  if(action === 'delete-expense'){ if(!confirm('Delete this expense?'))return; try{await api('DELETE','/api/expenses/'+id);await refreshExpenses();render();}catch(e){showToast(e.message)} return; }

  if(action === 'apply-default-margin'){
    const margin = Number(document.getElementById('default-margin').value) || 0;
    state.settings.defaultMarginPercent = margin;
    state.billReview.forEach(row => { row.margin = margin; row.sell = sellFromMargin(row.cost, margin); });
    render(); return;
  }
  if(action === 'confirm-bill-review') return confirmBillReview();
  if(action === 'cancel-bill-review'){ state.billReview = null; render(); return; }
  if(action === 'remove-review-row'){
    state.billReview.splice(Number(el.getAttribute('data-idx')), 1);
    if(!state.billReview.length) state.billReview = null;
    render(); return;
  }

  if(action === 'open-manual-add') return requireAdmin(() => {
    state.inventoryImageDraft = null;
    state.quickAdd = { title: 'Add item manually', name:'', code:'', category:'', costPrice:0, margin: state.settings.defaultMarginPercent, price:0, quantity:1 };
    render();
  });
  if(action === 'quickadd-from-unmatched') return requireAdmin(() => {
    state.quickAdd = {
      title: 'Add scanned item to inventory',
      name: state.unmatched.name, code: state.unmatched.code||'', category: '',
      costPrice: 0, margin: state.settings.defaultMarginPercent,
      price: state.unmatched.price || 0, quantity: 1,
    };
    render();
  });
  if(action === 'dismiss-unmatched'){ state.unmatched = null; render(); return; }
  if(action === 'close-quick-add'){ state.quickAdd = null; render(); return; }
  if(action === 'submit-quick-add') return submitQuickAdd();

  if(action === 'edit-item') return requireAdmin(() => {
    const item = state.inventory.find(i => i.id === id);
    if(item) { state.editItemDraft = Object.assign({}, item); state.inventoryImageDraft = null; }
    render();
  });
  if(action === 'close-edit-item'){ state.editItemDraft = null; render(); return; }
  if(action === 'save-edit-item'){ return saveEditItem(); }
  if(action === 'delete-item') return requireAdmin(() => { if(confirm('Delete this inventory item? This cannot be undone.')) deleteItemConfirmed(id); });

  if(action === 'add-search-result'){
    const item = state.inventory.find(i => i.id === id);
    if(item) addToCart(item, 1);
    return;
  }
  if(action === 'cart-inc'){ changeCartQty(id, 1); return; }
  if(action === 'cart-dec'){ changeCartQty(id, -1); return; }
  if(action === 'cart-remove'){ removeCartLine(id); return; }
  if(action === 'clear-cart'){ if(!confirm('Clear all items from this cart?')) return; state.cart = []; resetCheckout(); render(); return; }
  if(action === 'complete-sale'){ return completeSale(); }

  if(action === 'approve-discount'){

  if(action === 'cancel-due-settle'){ state.dueSettle = null; render(); return; }
  if(action === 'submit-due-payment'){
    const amt = document.getElementById('due-amount-input').value;
    const method = document.getElementById('due-payment-method')?.value || 'cash';
    return settleDue(id, amt, method);
  }
  if(action === 'pay-full-due'){
    const sale = state.sales.find(s => s.id === id);
    if(sale) return settleDue(id, sale.amountDue, 'cash');
    return;
  }
  if(action === 'edit-bill') return requireAdmin(() => {
    const sale = state.sales.find(s => s.id === id);
    if(sale) startEditSale(sale);
  });
  if(action === 'open-return-form') return requireAdmin(() => {
    const sale = state.sales.find(s => s.id === id);
    if(!sale) return;
    state.returnForm = { saleId: id, qtys: {}, adjustAgainstDue: sale.amountDue > 0 };
    render();
  });
  if(action === 'cancel-return-form'){ state.returnForm = null; render(); return; }
  if(action === 'return-qty-inc' || action === 'return-qty-dec'){
    const itemId = el.getAttribute('data-item');
    const max = Number(el.getAttribute('data-max')) || 0;
    const cur = Number(state.returnForm.qtys[itemId] || 0);
    const next = action === 'return-qty-inc' ? Math.min(max, cur+1) : Math.max(0, cur-1);
    state.returnForm.qtys[itemId] = next;
    render(); return;
  }
  if(action === 'toggle-adjust-due'){
    state.returnForm.adjustAgainstDue = !state.returnForm.adjustAgainstDue;

  }
  if(action === 'submit-return'){ return submitReturn(); }

  if(action === 'employee-tools-panel'){ state.employeeToolsPanel=el.getAttribute('data-panel')||null; state.employeeProfileId=null; if(state.employeeToolsPanel==='attendance') state.attendanceEmployeeId=state.attendanceEmployeeId||state.employees.find(e=>e.active!==false)?.id||''; if(state.employeeToolsPanel) await refreshAttendance(); render(); return; }

  }

      const payload={employeeId,date,status:get('.attendance-status')?.value||'present',checkIn:inTime?`${date}T${inTime}:00`:'',checkOut:outTime?`${date}T${outTime}:00`:'',notes:get('.attendance-note')?.value||''};
      await api(attendanceId?'PUT':'POST',attendanceId?`/api/attendance/${attendanceId}`:'/api/attendance',payload); await refreshAttendance(); showToast('Attendance saved'); render();
    }catch(e){showToast(e.message)} return;
  }
  if(action === 'save-special-day'){
    try{ await api('POST','/api/attendance/special-days',{employeeId:document.getElementById('special-employee').value,date:document.getElementById('special-date').value,type:document.getElementById('special-type').value,customAmount:document.getElementById('special-amount').value}); await refreshAttendance(); showToast('Special day added'); render(); }catch(e){showToast(e.message)} return;
  }
  if(action === 'delete-special-day'){ if(!confirm('Delete this special working day?')) return; try{ await api('DELETE',`/api/attendance/special-days/${id}`); await refreshAttendance(); render(); }catch(e){showToast(e.message)} return; }
  if(action === 'save-adjustment'){
    try{ await api('POST','/api/attendance/adjustments',{employeeId:id||el.getAttribute('data-employee-id'),kind:document.getElementById('adjustment-kind').value,amount:document.getElementById('adjustment-amount').value,date:document.getElementById('adjustment-date').value,reason:document.getElementById('adjustment-reason').value}); await refreshAttendance(); showToast('Salary adjustment added'); render(); }catch(e){showToast(e.message)} return;
  }
  if(action === 'delete-adjustment'){ if(!confirm('Delete this salary adjustment?')) return; try{ await api('DELETE',`/api/attendance/adjustments/${id}`); await refreshAttendance(); render(); }catch(e){showToast(e.message)} return; }
  if(action === 'save-employee'){ return saveEmployeeDraft(); }
  if(action === 'delete-employee'){ return requireAdmin(() => { if(confirm('Deactivate and remove this employee?')) deleteEmployeeConfirmed(id); }); }

  if(action === 'save-apikey'){
    const key = document.getElementById('set-apikey').value.trim();
    if(!key){ showToast('Enter a key first'); return; }
    try{
      await api('PUT', '/api/settings', { anthropicApiKey: key });
      state.settings.hasApiKey = true;
      showToast('API key saved');
      render();
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-font-size'){
    const val = el.getAttribute('data-value');
    state.settings.uiFontSize = val;
    render();
    try{ await api('PUT', '/api/settings', { uiFontSize: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-color-mode'){
    const mode = ['light','dark','system'].includes(el.getAttribute('data-value')) ? el.getAttribute('data-value') : 'system';
    state.appearanceMode = mode;
    try{ localStorage.setItem('ledger-appearance-mode', mode); }catch(e){}
    render();
    return;
  }
  if(action === 'set-accent-color'){
    const val = el.getAttribute('data-value');
    state.settings.accentColor = val;
    render();
    try{ await api('PUT', '/api/settings', { accentColor: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-receipt-width'){
    const val = el.getAttribute('data-value');
    state.settings.receiptWidth = val;
    render();
    try{ await api('PUT', '/api/settings', { receiptWidth: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'settings-tab'){
    const tab=el.getAttribute('data-tab');
    if(tab==='general'||tab==='appearance'){ state.settingsTab=tab; render(); }
    return;
  }
  if(action === 'frequent-category'){
    state.frequentCategory=el.getAttribute('data-category')||'All';
    render();
    return;
  }
  if(action === 'toggle-frequent-grid'){
    const enabled=state.settings.showFrequentItemsGrid===false;
    try{
      await api('PUT','/api/settings',{showFrequentItemsGrid:enabled});
      state.settings.showFrequentItemsGrid=enabled;
      render();
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-invoice-font'){
    state.settings.invoiceFontSize = el.getAttribute('data-value') || 'md';
    render();
    try{ await api('PUT', '/api/settings', { invoiceFontSize: state.settings.invoiceFontSize }); }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'save-settings'){
    try{
      const completingSetup = el.hasAttribute('data-complete-setup');
      const setupPage = state.view === 'setup';
      const generalTab = setupPage || state.settingsTab === 'general';
      const appearanceTab = setupPage || state.settingsTab === 'appearance';
      if(completingSetup && !document.getElementById('set-shop-name').value.trim()) throw new Error('Enter your shop or business name to finish setup');
      const payload = {};
      if(generalTab){
        Object.assign(payload,{
          currencySymbol: document.getElementById('set-currency').value.trim() || '₹',
          defaultMarginPercent: Number(document.getElementById('set-margin').value) || 0,
          maxEmployeeDiscountPercent: Math.max(0, Math.min(100, Number(document.getElementById('set-discount-limit').value) || 0)),
          billFooterMessage: document.getElementById('set-footer').value.trim(),
          invoicePrefix: document.getElementById('set-invoice-prefix').value.trim(), startingInvoiceNumber: Number(document.getElementById('set-invoice-start').value)||1, invoiceTitle: document.getElementById('set-invoice-title').value, returnAllowed: document.getElementById('set-return-allowed').value==='true', returnWindowDays: Number(document.getElementById('set-return-window').value)||0, returnConditions: document.getElementById('set-return-conditions').value.trim(), exchangeAllowed: document.getElementById('set-exchange-allowed').value==='true', exchangeWindowDays: Number(document.getElementById('set-exchange-window').value)||0, exchangeConditions: document.getElementById('set-exchange-conditions').value.trim(), termsAndConditions: document.getElementById('set-terms').value.trim(), showPoliciesOnInvoice: document.getElementById('set-show-policies').checked,
          upiId: document.getElementById('set-upi').value.trim(), bankName: document.getElementById('set-bank-name').value.trim(), accountHolderName: document.getElementById('set-account-holder').value.trim(), accountNumber: document.getElementById('set-account-number').value.trim(), ifscCode: document.getElementById('set-ifsc').value.trim().toUpperCase(), showPaymentDetailsOnInvoice: document.getElementById('set-show-payment').checked, website: document.getElementById('set-website').value.trim(), instagram: document.getElementById('set-instagram').value.trim(), facebook: document.getElementById('set-facebook').value.trim(), googleBusinessLink: document.getElementById('set-google-business').value.trim(), showOnlineDetailsOnInvoice: document.getElementById('set-show-online').checked,
          invoiceDisplay: Object.fromEntries(Array.from(document.querySelectorAll('.invoice-display-toggle')).map(input=>[input.getAttribute('data-display-key'), input.checked])),
        });
      }
      if(appearanceTab){
        Object.assign(payload,{
          theme: document.getElementById('set-theme').value,
          accentColor: document.getElementById('set-custom-accent').value,
          frequentGridColumns: Number(document.getElementById('set-grid-columns').value) || 4,
          showFrequentItemsGrid: document.getElementById('set-show-frequent-grid').checked,
          receiptWidth: state.settings.receiptWidth||'standard',
          invoiceFontSize: state.settings.invoiceFontSize||'md',
        });
      }
      if(setupPage){
        const pinValue=document.getElementById('set-business-pin').value.trim(), gstValue=document.getElementById('set-gstin').value.trim().toUpperCase(), panValue=document.getElementById('set-pan').value.trim().toUpperCase(), emailValue=document.getElementById('set-business-email').value.trim(), phoneValue=document.getElementById('set-shop-phone').value.trim(), additionalPhoneValue=document.getElementById('set-additional-phone').value.trim(), gstRateValue=document.getElementById('set-gst-rate').value.trim();
        if(phoneValue && !/^\d{10}$/.test(phoneValue)) throw new Error('Primary mobile number must contain exactly 10 digits');
        if(additionalPhoneValue && !/^\d{10}$/.test(additionalPhoneValue)) throw new Error('Additional contact number must contain exactly 10 digits');
        if(pinValue && !/^\d{6}$/.test(pinValue)) throw new Error('PIN code must contain 6 digits');
        if(gstValue && !/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(gstValue)) throw new Error('GSTIN must be a valid 15-character GSTIN');
        if(panValue && !/^[A-Z]{5}\d{4}[A-Z]$/.test(panValue)) throw new Error('PAN must follow the 10-character PAN format');
        if(emailValue && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) throw new Error('Enter a valid email address');
        if(gstRateValue && (!/^\d{1,3}(?:\.\d{1,2})?$/.test(gstRateValue) || Number(gstRateValue) > 100)) throw new Error('Default GST rate must be between 0 and 100');
        Object.assign(payload,{
          shopName: document.getElementById('set-shop-name').value.trim(), businessOwnerName: document.getElementById('set-business-owner-name').value.trim(), shopAddress: document.getElementById('set-shop-address').value.trim(), shopPhone: phoneValue, additionalPhone: additionalPhoneValue, welcomeMessage: document.getElementById('set-welcome-message').value.trim(), storeLogo: state.settingsLogoDraft !== null ? state.settingsLogoDraft : state.settings.storeLogo,
          businessCity: document.getElementById('set-business-city').value.trim(), businessState: document.getElementById('set-business-state').value.trim(), businessPinCode: pinValue, businessEmail: emailValue, gstin: gstValue, legalBusinessName: document.getElementById('set-legal-name').value.trim(), tradeName: document.getElementById('set-trade-name').value.trim(), panNumber: panValue, businessRegistrationNumber: document.getElementById('set-business-registration').value.trim(), gstRegistrationStatus: document.getElementById('set-gst-status').value, defaultGstRate: gstRateValue, msmeUdyamNumber: document.getElementById('set-msme').value.trim(), shopEstablishmentNumber: document.getElementById('set-shop-registration').value.trim(),
        });
      }
      await api('PUT', '/api/settings', payload);
      state.settings = Object.assign(state.settings, payload);
      state.settingsLogoDraft = null;
      if(completingSetup){
        await api('POST', '/api/settings/complete-setup', {});
        state.settings.setupComplete = true;
        state.view = 'home';
        showToast('Store setup complete');
      }else{
        showToast('Settings saved');
      }
      render();
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'change-password'){
    const pw = document.getElementById('set-newpass').value;
    if(!pw || pw.length < 4){ showToast('Choose a password with at least 4 characters'); return; }
    try{
      await api('POST', '/api/settings/change-password', { newPassword: pw });
      showToast('Admin password updated');
      document.getElementById('set-newpass').value = '';
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'reset-all-data'){
    const password = document.getElementById('reset-admin-password').value;
    const confirmation = document.getElementById('reset-confirmation').value;
    if(!password){ showToast('Enter the current admin password'); return; }
    if(confirmation !== 'DELETE ALL DATA'){ showToast('Type DELETE ALL DATA exactly to confirm'); return; }
    if(!confirm('This permanently deletes business records and the admin password, but keeps your shop settings. You will need to set up a new admin password. This cannot be undone. Continue?')) return;
    el.disabled = true;
    try{
      await api('POST', '/api/settings/reset', { password, confirmation });
      window.location.reload();
    }catch(e){
      showToast(e.message);
    }
    return;
  }
}

loadData();
</script>
</body>
</html>
