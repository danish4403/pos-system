      const payload={employeeId,date:state.attendanceDate,status:get('.attendance-status')?.value||'present',checkIn:inTime?`${state.attendanceDate}T${inTime}:00`:'',checkOut:outTime?`${state.attendanceDate}T${outTime}:00`:'',notes:get('.attendance-note')?.value||''};
      await api(attendanceId?'PUT':'POST',attendanceId?`/api/attendance/${attendanceId}`:'/api/attendance',payload); await refreshAttendance(); showToast('Attendance saved'); render();
    }catch(e){showToast(e.message)} return;
  }
  if(action === 'save-special-day'){
    try{ await api('POST','/api/attendance/special-days',{employeeId:document.getElementById('special-employee').value,date:document.getElementById('special-date').value,type:document.getElementById('special-type').value,customAmount:document.getElementById('special-amount').value}); await refreshAttendance(); showToast('Special day added'); render(); }catch(e){showToast(e.message)} return;
  }
  if(action === 'delete-special-day'){ if(!confirm('Delete this special working day?')) return; try{ await api('DELETE',`/api/attendance/special-days/${id}`); await refreshAttendance(); render(); }catch(e){showToast(e.message)} return; }
  if(action === 'save-adjustment'){
    try{ await api('POST','/api/attendance/adjustments',{employeeId:id||el.getAttribute('data-employee-id'),kind:document.getElementById('adjustment-kind').value,amount:document.getElementById('adjustment-amount').value,date:document.getElementById('adjustment-date').value,reason:document.getElementById('adjustment-reason').value}); await refreshAttendance(); showToast('Salary adjustment added'); render(); }catch(e){showToast(e.message)} return;
  }
  if(action === 'delete-adjustment'){ if(!confirm('Delete this salary adjustment?')) return; try{ await api('DELETE',`/api/attendance/adjustments/${id}`); await refreshAttendance(); render(); }catch(e){showToast(e.message)} return; }
  if(action === 'save-employee'){ return saveEmployeeDraft(); }
  if(action === 'delete-employee'){ return requireAdmin(() => { if(confirm('Deactivate and remove this employee?')) deleteEmployeeConfirmed(id); }); }

  if(action === 'save-apikey'){
    const key = document.getElementById('set-apikey').value.trim();
    if(!key){ showToast('Enter a key first'); return; }
    try{
      await api('PUT', '/api/settings', { anthropicApiKey: key });
      state.settings.hasApiKey = true;
      showToast('API key saved');
      render();
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-font-size'){
    const val = el.getAttribute('data-value');
    state.settings.uiFontSize = val;
    render();
    try{ await api('PUT', '/api/settings', { uiFontSize: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-color-mode'){
    const mode = ['light','dark','system'].includes(el.getAttribute('data-value')) ? el.getAttribute('data-value') : 'system';
    state.appearanceMode = mode;
    try{ localStorage.setItem('ledger-appearance-mode', mode); }catch(e){}
    render();
    return;
  }
  if(action === 'set-accent-color'){
    const val = el.getAttribute('data-value');
    state.settings.accentColor = val;
    render();
    try{ await api('PUT', '/api/settings', { accentColor: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-receipt-width'){
    const val = el.getAttribute('data-value');
    state.settings.receiptWidth = val;
    render();
    try{ await api('PUT', '/api/settings', { receiptWidth: val }); }
    catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'set-invoice-font'){
    state.settings.invoiceFontSize = el.getAttribute('data-value') || 'md';
    render();
    try{ await api('PUT', '/api/settings', { invoiceFontSize: state.settings.invoiceFontSize }); }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'save-settings'){
    try{
      const pinValue=document.getElementById('set-business-pin').value.trim(), gstValue=document.getElementById('set-gstin').value.trim().toUpperCase(), panValue=document.getElementById('set-pan').value.trim().toUpperCase(), emailValue=document.getElementById('set-business-email').value.trim(), phoneValue=document.getElementById('set-shop-phone').value.trim(), additionalPhoneValue=document.getElementById('set-additional-phone').value.trim(), gstRateValue=document.getElementById('set-gst-rate').value.trim();
      if(phoneValue && !/^\d{10}$/.test(phoneValue)) throw new Error('Primary mobile number must contain exactly 10 digits');
      if(additionalPhoneValue && !/^\d{10}$/.test(additionalPhoneValue)) throw new Error('Additional contact number must contain exactly 10 digits');
      if(pinValue && !/^\d{6}$/.test(pinValue)) throw new Error('PIN code must contain 6 digits');
      if(gstValue && !/^\d{2}[A-Z]{5}\d{4}[A-Z][A-Z\d]Z[A-Z\d]$/.test(gstValue)) throw new Error('GSTIN must be a valid 15-character GSTIN');
      if(panValue && !/^[A-Z]{5}\d{4}[A-Z]$/.test(panValue)) throw new Error('PAN must follow the 10-character PAN format');
      if(emailValue && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailValue)) throw new Error('Enter a valid email address');
      if(gstRateValue && (!/^\d{1,3}(?:\.\d{1,2})?$/.test(gstRateValue) || Number(gstRateValue) > 100)) throw new Error('Default GST rate must be between 0 and 100');
      const payload = {
        currencySymbol: document.getElementById('set-currency').value.trim() || '₹',
        defaultMarginPercent: Number(document.getElementById('set-margin').value) || 0,
        maxEmployeeDiscountPercent: Math.max(0, Math.min(100, Number(document.getElementById('set-discount-limit').value) || 0)),
        billFooterMessage: document.getElementById('set-footer').value.trim(),
        theme: document.getElementById('set-theme').value,
        accentColor: document.getElementById('set-custom-accent').value,
        frequentGridColumns: Number(document.getElementById('set-grid-columns').value) || 4,
        shopName: document.getElementById('set-shop-name').value.trim(), shopAddress: document.getElementById('set-shop-address').value.trim(), shopPhone: document.getElementById('set-shop-phone').value.trim(), additionalPhone: document.getElementById('set-additional-phone').value.trim(), welcomeMessage: document.getElementById('set-welcome-message').value.trim(), storeLogo: state.settingsLogoDraft !== null ? state.settingsLogoDraft : state.settings.storeLogo,
        businessCity: document.getElementById('set-business-city').value.trim(), businessState: document.getElementById('set-business-state').value.trim(), businessPinCode: document.getElementById('set-business-pin').value.trim(), businessEmail: document.getElementById('set-business-email').value.trim(), gstin: document.getElementById('set-gstin').value.trim().toUpperCase(), legalBusinessName: document.getElementById('set-legal-name').value.trim(), tradeName: document.getElementById('set-trade-name').value.trim(), panNumber: document.getElementById('set-pan').value.trim().toUpperCase(), businessRegistrationNumber: document.getElementById('set-business-registration').value.trim(), gstRegistrationStatus: document.getElementById('set-gst-status').value, defaultGstRate: document.getElementById('set-gst-rate').value, msmeUdyamNumber: document.getElementById('set-msme').value.trim(), shopEstablishmentNumber: document.getElementById('set-shop-registration').value.trim(),
        invoicePrefix: document.getElementById('set-invoice-prefix').value.trim(), startingInvoiceNumber: Number(document.getElementById('set-invoice-start').value)||1, invoiceTitle: document.getElementById('set-invoice-title').value, invoiceFontSize: state.settings.invoiceFontSize||'md', returnAllowed: document.getElementById('set-return-allowed').value==='true', returnWindowDays: Number(document.getElementById('set-return-window').value)||0, returnConditions: document.getElementById('set-return-conditions').value.trim(), exchangeAllowed: document.getElementById('set-exchange-allowed').value==='true', exchangeWindowDays: Number(document.getElementById('set-exchange-window').value)||0, exchangeConditions: document.getElementById('set-exchange-conditions').value.trim(), termsAndConditions: document.getElementById('set-terms').value.trim(), showPoliciesOnInvoice: document.getElementById('set-show-policies').checked,
        upiId: document.getElementById('set-upi').value.trim(), bankName: document.getElementById('set-bank-name').value.trim(), accountHolderName: document.getElementById('set-account-holder').value.trim(), accountNumber: document.getElementById('set-account-number').value.trim(), ifscCode: document.getElementById('set-ifsc').value.trim().toUpperCase(), showPaymentDetailsOnInvoice: document.getElementById('set-show-payment').checked, website: document.getElementById('set-website').value.trim(), instagram: document.getElementById('set-instagram').value.trim(), facebook: document.getElementById('set-facebook').value.trim(), googleBusinessLink: document.getElementById('set-google-business').value.trim(), showOnlineDetailsOnInvoice: document.getElementById('set-show-online').checked,
        invoiceDisplay: Object.fromEntries(Array.from(document.querySelectorAll('.invoice-display-toggle')).map(input=>[input.getAttribute('data-display-key'), input.checked])),
      };
      await api('PUT', '/api/settings', payload);
      state.settings = Object.assign(state.settings, payload);
      state.settingsLogoDraft = null;
      showToast('Settings saved');
      render();
    }catch(e){ showToast(e.message); }
    return;
  }
  if(action === 'change-password'){
    const pw = document.getElementById('set-newpass').value;
    if(!pw || pw.length < 4){ showToast('Choose a password with at least 4 characters'); return; }
    try{
      await api('POST', '/api/settings/change-password', { newPassword: pw });
      showToast('Admin password updated');
      document.getElementById('set-newpass').value = '';
    }catch(e){ showToast(e.message); }
    return;
  }
}

loadData();
</script>
</body>
</html>
