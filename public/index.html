<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ledger — Photo-Scan POS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#EFEAE1;
    --surface:#FFFDF9;
    --ink:#211D18;
    --ink-soft:#6B6357;
    --line:#D8D0C0;
    --brass:#B8863B;
    --brass-ink:#5C4620;
    --stamp:#A63D33;
    --moss:#5B7553;
    --moss-bg:#E7EBDF;
    --stamp-bg:#F3E1DD;
    --brass-bg:#F1E5CC;
    --status-success:#3F7A52;
    --status-success-bg:#E5F0E7;
    --status-info:#2D6596;
    --status-info-bg:#E6EFF7;
    --status-warning:#A8641F;
    --status-warning-bg:#F8EBDD;
    --status-danger:#A33D35;
    --status-danger-bg:#F5E1DE;
    --status-neutral:#6B7078;
    --status-neutral-bg:#ECEDEF;
    --radius:3px;
    --shadow: 0 1px 0 rgba(33,29,24,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{display:flex; height:100vh; height:100dvh; min-height:0; overflow:hidden;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:196px;
    flex:0 0 196px;
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:22px 0 22px 0;
    display:flex; flex-direction:column;
    position:relative; top:auto; height:100vh; height:100dvh; min-height:0;
    overflow-y:auto; overflow-x:hidden; scrollbar-gutter:stable;
  }
  .brand{padding:0 20px 22px 20px; border-bottom:1px solid var(--line); margin-bottom:6px;}
  .brand-mark{font-family:'IBM Plex Mono'; font-weight:700; font-size:20px; letter-spacing:-0.02em;}
  .store-logo{width:42px;height:42px;object-fit:contain;border-radius:7px;background:var(--paper);border:1px solid var(--line)}
  .identity-logo{width:56px;height:56px;object-fit:contain;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
  .receipt-logo{width:42px;height:42px;object-fit:contain;display:block;margin:0 auto 6px}
  .brand-sub{font-size:11.5px; color:var(--ink-soft); margin-top:3px;}
  .nav{display:flex; flex-direction:column; margin-top:10px;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 20px; font-size:14px; color:var(--ink-soft);
    cursor:pointer; border-left:3px solid transparent;
    transition:background .12s ease, color .12s ease;
    user-select:none;
  }
  .nav-item:hover{background:var(--paper); color:var(--ink);}
  .nav-item.active{
    color:var(--ink); background:var(--paper);
    border-left:3px solid var(--brass);
    font-weight:600;
  }
  .nav-item svg{flex:0 0 auto;}
  .nav-count{
    margin-left:auto; font-family:'IBM Plex Mono'; font-size:11px;
    color:var(--ink-soft); background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:1px 6px;
  }
  .sidebar-foot{margin-top:auto; padding:14px 20px 0 20px; font-size:11px; color:var(--ink-soft); border-top:1px solid var(--line);}
  .sidebar-toggle{position:absolute;right:-13px;top:24px;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:var(--surface);cursor:pointer;z-index:5;display:grid;place-items:center;}
  #app.sidebar-collapsed .sidebar{width:62px;flex-basis:62px;overflow-y:auto;overflow-x:hidden;} #app.sidebar-collapsed .brand{padding:0 10px 22px;text-align:center;} #app.sidebar-collapsed .brand-mark{font-size:0;} #app.sidebar-collapsed .brand-mark:first-letter{font-size:20px;} #app.sidebar-collapsed .brand-sub,#app.sidebar-collapsed .nav-item span,#app.sidebar-collapsed .sidebar-foot{display:none;} #app.sidebar-collapsed .nav-item{padding:12px 20px;justify-content:center;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; min-height:0; height:100vh; height:100dvh; overflow-y:auto; overflow-x:hidden; padding:34px 40px 60px 40px;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-title{font-size:23px; font-weight:600; letter-spacing:-0.01em;}
  .page-desc{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

  .btn{
    font-family:'IBM Plex Sans'; font-size:13.5px; font-weight:600;
    padding:9px 16px; border-radius:var(--radius); border:1px solid transparent;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px;
    transition:transform .08s ease, background .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--brass); color:#fff;}
  .btn-primary:hover{background:var(--brass-ink);}
  .btn-outline{background:var(--surface); color:var(--ink); border:1px solid var(--line);}
  .btn-outline:hover{border-color:var(--ink-soft);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid transparent; padding:6px 8px;}
  .btn-ghost:hover{color:var(--ink); background:var(--paper);}
  .btn-danger{background:var(--surface); color:var(--stamp); border:1px solid #E4C9C4;}
  .btn-danger:hover{background:var(--stamp-bg);}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .btn-sm{padding:6px 11px; font-size:12.5px;}

  /* ---------- Cards / stats ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .analytics-kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:26px;}
  .analytics-kpi{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow);overflow:hidden;}
  .analytics-kpi--lead{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:21px 23px;border-color:color-mix(in srgb,var(--brass) 42%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--brass-bg) 62%,var(--surface)),var(--surface) 68%);}
  .analytics-kpi--primary{grid-column:span 2;min-height:148px;}
  .analytics-kpi--expense{grid-column:span 2;min-height:148px;}
  .analytics-kpi--compact{grid-column:span 3;min-height:124px;padding:15px 17px;}
  .analytics-kpi--dashboard-stock{grid-column:span 2;min-height:148px;}
  .analytics-kpi-head{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
  .analytics-kpi-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:var(--brass-bg);color:var(--brass-ink);flex:0 0 29px;}
  .analytics-kpi--primary .analytics-kpi-icon{background:color-mix(in srgb,var(--moss-bg) 78%,var(--surface));color:var(--moss);}
  .analytics-kpi--expense .analytics-kpi-icon{background:var(--stamp-bg);color:var(--stamp);}
  .analytics-kpi-value{margin-top:15px;font-size:29px;font-weight:700;letter-spacing:-.035em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .analytics-kpi--lead .analytics-kpi-value{font-size:38px;}
  .analytics-kpi--compact .analytics-kpi-value{font-size:25px;margin-top:13px;}
  .analytics-kpi-value[title]{cursor:help;}
  .analytics-kpi-compare{display:inline-flex;align-items:center;gap:5px;margin-top:13px;padding:5px 8px;border-radius:999px;background:var(--paper);font-size:11.5px;font-weight:700;line-height:1.1;}
  .analytics-kpi-compare.is-up{color:var(--moss);background:var(--moss-bg);}
  .analytics-kpi-compare.is-down{color:var(--stamp);background:var(--stamp-bg);}
  .analytics-kpi-compare.is-flat,.analytics-kpi-compare.is-none{color:var(--ink-soft);}
  .analytics-kpi-previous{margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .analytics-kpi-period{font-size:11px;color:var(--brass-ink);margin-top:5px;}
  .analytics-kpi-signal{align-self:stretch;min-width:150px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;text-align:right;border-left:1px solid color-mix(in srgb,var(--brass) 25%,transparent);padding-left:20px;}
  .analytics-kpi-signal-label{font-size:10px;color:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase;}
  .analytics-kpi-signal-value{margin-top:7px;font-size:19px;font-weight:700;color:var(--brass-ink);}
  .analytics-kpi-signal-note{margin-top:4px;font-size:11px;color:var(--ink-soft);}
  .bi-status-card{border-left:3px solid var(--bi-tone);background:color-mix(in srgb,var(--bi-tone-bg) 38%,var(--surface));}
  .bi-tone-success{--bi-tone:var(--status-success);--bi-tone-bg:var(--status-success-bg);}
  .bi-tone-info{--bi-tone:var(--status-info);--bi-tone-bg:var(--status-info-bg);}
  .bi-tone-warning{--bi-tone:var(--status-warning);--bi-tone-bg:var(--status-warning-bg);}
  .bi-tone-danger{--bi-tone:var(--status-danger);--bi-tone-bg:var(--status-danger-bg);}
  .bi-tone-neutral{--bi-tone:var(--status-neutral);--bi-tone-bg:var(--status-neutral-bg);}
  .bi-status-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--bi-tone-bg);color:var(--bi-tone);font-size:10.5px;font-weight:700;line-height:1.1;white-space:nowrap;}
  .bi-status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px;}
  .bi-insight-card{border-left:3px solid var(--bi-tone);background:color-mix(in srgb,var(--bi-tone-bg) 32%,var(--surface));}
  .bi-status-card .action-note,.bi-insight-card .action-note{color:var(--bi-tone);}
  .bi-table-status{font-weight:600;color:var(--bi-tone);}
  .closing-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:20px;align-items:stretch;margin-bottom:16px;padding:23px;border-color:color-mix(in srgb,var(--brass) 38%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--brass-bg) 58%,var(--surface)),var(--surface) 72%);}
  .closing-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink);}
  .closing-hero-value{margin-top:10px;font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .closing-hero-sub{margin-top:8px;color:var(--ink-soft);font-size:12px;}
  .closing-calculation{padding:14px 16px;border:1px solid color-mix(in srgb,var(--brass) 27%,var(--line));border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);}
  .closing-calc-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .closing-calc-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px;color:var(--ink-soft);}
  .closing-calc-row strong{color:var(--ink);font-family:'IBM Plex Mono';font-weight:600;}
  .closing-calc-total{border-top:1px dashed var(--line);margin-top:4px;padding-top:9px;color:var(--ink);font-weight:700;}
  .closing-summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .closing-summary-card{padding:17px 19px;}
  .closing-summary-card .analytics-kpi-icon{background:var(--status-info-bg);color:var(--status-info);}
  .closing-summary-card.is-expense{border-left:3px solid var(--status-warning);background:color-mix(in srgb,var(--status-warning-bg) 28%,var(--surface));}
  .closing-summary-card.is-expense .analytics-kpi-icon{background:var(--status-warning-bg);color:var(--status-warning);}
  .closing-summary-value{margin-top:12px;font-size:28px;font-weight:700;letter-spacing:-.035em;}
  .closing-payment-card{margin-bottom:16px;}
  .closing-payment-row{display:grid;grid-template-columns:30px minmax(100px,130px) 1fr minmax(86px,110px);gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);}
  .closing-payment-row:last-child{border-bottom:none;}
  .closing-payment-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--status-info-bg);color:var(--status-info);}
  .closing-payment-row.is-cash .closing-payment-icon{background:var(--status-success-bg);color:var(--status-success);}
  .closing-payment-row.is-upi .closing-payment-icon{background:color-mix(in srgb,#8c6ad8 17%,var(--surface));color:#7657b8;}
  .closing-payment-name{font-weight:700;font-size:13px;}
  .closing-payment-bar{height:8px;overflow:hidden;border-radius:99px;background:var(--paper);}
  .closing-payment-bar i{display:block;height:100%;min-width:0;border-radius:99px;background:var(--status-info);}
  .closing-payment-row.is-cash .closing-payment-bar i{background:var(--status-success);}
  .closing-payment-row.is-upi .closing-payment-bar i{background:#8c6ad8;}
  .closing-payment-amount{text-align:right;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;}
  .closing-payment-percent{text-align:right;color:var(--ink-soft);font-size:11px;margin-top:3px;}
  .closing-reconcile{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:15px 18px;margin-bottom:16px;border-left:3px solid var(--bi-tone);background:color-mix(in srgb,var(--bi-tone-bg) 32%,var(--surface));}
  .closing-reconcile-title{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--bi-tone);}
  .closing-reconcile-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);}
  .closing-reconcile-meta strong{color:var(--ink);font-family:'IBM Plex Mono';}
  .expense-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.8fr);gap:18px;align-items:center;padding:23px;margin-bottom:16px;border-color:color-mix(in srgb,var(--brass) 38%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--brass-bg) 56%,var(--surface)),var(--surface) 72%);}
  .expense-hero-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink);}
  .expense-hero-value{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .expense-hero-note{margin-top:8px;color:var(--ink-soft);font-size:12px;}
  .expense-hero-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11px;color:var(--ink-soft);}
  .expense-hero-meta strong{margin-left:4px;color:var(--ink);font-family:'IBM Plex Mono';}
  .expense-signal{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 17px;border-left:3px solid var(--bi-tone);border-radius:12px;background:color-mix(in srgb,var(--bi-tone-bg) 40%,var(--surface));}
  .expense-signal-title{font-weight:700;color:var(--bi-tone);font-size:13px;}
  .expense-signal-copy{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .expense-breakdown-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px;}
  .expense-category{padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 76%,transparent);}
  .expense-category.is-largest{border-color:color-mix(in srgb,var(--status-warning) 45%,var(--line));box-shadow:inset 0 2px 0 var(--status-warning);}
  .expense-category-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;font-size:12px;}
  .expense-category-value{font-size:21px;font-weight:700;margin-top:9px;letter-spacing:-.025em;}
  .expense-category-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .expense-category-bar{height:6px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:11px;}
  .expense-category-bar i{display:block;height:100%;background:var(--brass);border-radius:99px;}
  .expense-insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
  .expense-insight{padding:14px 16px;border-left:3px solid var(--bi-tone);border-radius:12px;background:color-mix(in srgb,var(--bi-tone-bg) 30%,var(--surface));}
  .expense-insight-title{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--bi-tone);font-size:12px;}
  .expense-table-amount{font-family:'IBM Plex Mono';font-weight:700;font-size:13px;}
  .margin-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:stretch;padding:22px;margin-bottom:16px;border-color:color-mix(in srgb,var(--status-success) 30%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--status-success-bg) 42%,var(--surface)),var(--surface) 70%);}
  .margin-flow-card{padding:3px 5px;min-width:0;}
  .margin-flow-label{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .margin-flow-value{margin-top:9px;font-size:30px;font-weight:700;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .margin-flow-note{font-size:11px;color:var(--ink-soft);margin-top:5px;}
  .margin-flow-symbol{display:grid;place-items:center;color:var(--ink-soft);font-size:22px;}
  .margin-flow-profit{border-left:1px solid color-mix(in srgb,var(--status-success) 25%,var(--line));padding-left:18px;}
  .margin-health{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;padding:15px 18px;margin-bottom:16px;border-left:3px solid var(--bi-tone);background:color-mix(in srgb,var(--bi-tone-bg) 32%,var(--surface));}
  .margin-health-title{font-weight:700;color:var(--bi-tone);font-size:13px;}
  .margin-health-copy{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .margin-health-value{font-size:24px;font-weight:700;color:var(--bi-tone);font-family:'IBM Plex Mono';}
  .margin-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .margin-summary-card{padding:15px 17px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface) 76%,transparent);}
  .margin-summary-label{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);}
  .margin-summary-value{margin-top:8px;font-size:23px;font-weight:700;}
  .margin-product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .margin-product-card{padding:16px;border-left:3px solid var(--bi-tone);background:color-mix(in srgb,var(--bi-tone-bg) 26%,var(--surface));border-radius:12px;}
  .margin-product-name{font-weight:700;margin-top:8px;}
  .margin-product-meta{font-size:12px;color:var(--ink-soft);margin-top:5px;}
  .margin-progress{height:7px;border-radius:99px;background:var(--paper);overflow:hidden;margin-top:11px;}
  .margin-progress i{display:block;height:100%;border-radius:99px;background:var(--bi-tone);}
  .margin-table-margin{min-width:145px;}
  .margin-table-margin .bi-status-badge{margin-bottom:5px;}
  .margin-table-profit{font-family:'IBM Plex Mono';font-weight:700;color:var(--status-success);}
  /* ---------- SmartRetail AI Copilot ---------- */
  .ai-copilot-shell{max-width:980px;margin:0 auto;padding:0;overflow:hidden;}
  .ai-copilot-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px 24px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--status-info-bg) 42%,var(--surface)),var(--surface) 74%);}
  .ai-copilot-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.02em;}
  .ai-copilot-title-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:var(--status-info-bg);color:var(--status-info);}
  .ai-copilot-subtitle{margin-top:7px;color:var(--ink-soft);font-size:13px;line-height:1.5;max-width:650px;}
  .ai-powered{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 9px;border-radius:999px;background:var(--status-success-bg);color:var(--status-success);font-size:10.5px;font-weight:700;}
  .ai-powered-dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .ai-welcome{padding:23px 24px 15px;text-align:center;}
  .ai-welcome-icon{width:46px;height:46px;display:grid;place-items:center;margin:0 auto 10px;border-radius:15px;background:var(--status-info-bg);color:var(--status-info);}
  .ai-welcome-title{font-size:17px;font-weight:700;}
  .ai-welcome-copy{margin:6px auto 0;max-width:560px;color:var(--ink-soft);font-size:12.5px;line-height:1.5;}
  .ai-capability-list{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:13px;}

  /* ---------- Global Bill Ai mascot ---------- */

  .bill-ai-chat-panel .ai-welcome{padding:21px 18px 12px;}.bill-ai-chat-panel .ai-suggestions{padding:0 15px 12px;}.bill-ai-chat-panel .ai-suggestion-grid{gap:6px;}.bill-ai-chat-panel .ai-suggestion{padding:6px 8px;font-size:10.5px;border-radius:8px;}.bill-ai-chat-panel .ai-chat{flex:1;min-height:120px;max-height:390px;padding:13px 15px 8px;}.bill-ai-chat-panel .ai-message{max-width:94%;padding:10px 11px;font-size:12px;}.bill-ai-chat-panel .ai-composer{padding:10px 12px 12px;}.bill-ai-chat-panel .ai-composer textarea{min-height:39px;max-height:100px;font-size:12px;}.bill-ai-chat-panel .ai-send{min-height:39px;padding:8px 11px;}.bill-ai-chat-panel .ai-loading{padding:7px 15px 9px;font-size:11px;}
  .bill-ai-chat-panel .ai-callout{margin:0 15px 10px;font-size:11px;}.bill-ai-chat-panel .ai-powered-note{padding:0 15px 9px;color:var(--ink-soft);font-size:9.5px;}
  .bill-ai-guest .bill-ai-chat-panel .ai-suggestions,.bill-ai-guest .bill-ai-chat-panel .ai-powered-note,.bill-ai-guest .bill-ai-chat-panel .ai-composer{display:none;}
  .bill-ai-guest .bill-ai-chat-panel::after{content:'Admin sign-in is required to ask business questions.';display:block;margin:0 15px 14px;padding:10px 11px;border-left:3px solid var(--status-info);border-radius:8px;background:var(--status-info-bg);color:var(--status-info);font-size:11px;font-weight:600;}

  @media (max-width:600px){.bill-ai-root{right:13px;bottom:14px;}.bill-ai-float{width:67px;height:67px;border-radius:22px;}.bill-ai-cat{inset:9px;}.bill-ai-label{font-size:9px;padding:3px 7px;}.bill-ai-panel:not(.bill-ai-chat-panel){right:-2px;width:min(304px,calc(100vw - 28px));}.bill-ai-chat-panel{width:calc(100vw - 26px);max-height:calc(100vh - 92px);}.bill-ai-chat-panel .ai-chat{max-height:calc(100vh - 300px);}}

  .stat-num{font-family:'IBM Plex Mono'; font-size:24px; font-weight:600;}
  .stat-label{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .stat-flag{display:inline-block; margin-top:8px; font-size:11px; padding:2px 7px; border-radius:9px;}
  .flag-warn{background:var(--stamp-bg); color:var(--stamp);}
  .flag-ok{background:var(--moss-bg); color:var(--moss);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-head{padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .card-head h3{margin:0; font-size:15px; font-weight:600;}
  .card-body{padding:16px 18px;}

  /* ---------- Table ---------- */
  table{width:100%; border-collapse:collapse;}
  th{
    text-align:left; font-size:11px; font-weight:600; color:var(--ink-soft);
    padding:9px 8px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono';
  }
  td{padding:11px 8px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .item-code{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft); background:var(--paper); padding:2px 6px; border-radius:8px;}
  .qty-badge{font-family:'IBM Plex Mono'; font-weight:600;}
  .qty-low{color:var(--stamp);}
  .qty-zero{color:var(--stamp); font-weight:700;}
  .row-actions{display:flex; gap:4px; justify-content:flex-end;}
  .search-input, .field-input{
    font-family:'IBM Plex Sans'; font-size:13.5px; padding:8px 11px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); color:var(--ink);
    width:100%;
  }
  .search-input:focus, .field-input:focus{outline:none; border-color:var(--brass);}

  /* ---------- Empty state ---------- */
  .empty{padding:46px 20px; text-align:center; color:var(--ink-soft);}
  .empty-title{color:var(--ink); font-weight:600; font-size:15px; margin-bottom:5px;}
  .empty p{font-size:13.5px; max-width:360px; margin:0 auto 16px auto; line-height:1.5;}

  /* ---------- Scan panel ---------- */
  .scan-zone{
    border:1.5px dashed var(--line); border-radius:6px; padding:18px 16px;
    text-align:center; cursor:pointer; background:var(--paper);
    transition:border-color .12s ease, background .12s ease;
  }
  .scan-zone:hover{border-color:var(--brass); background:var(--brass-bg);}
  .scan-zone-title{font-weight:600; font-size:14.5px; margin-top:8px;}
  .scan-zone-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

  .scan-preview{position:relative; width:100%; max-width:280px; margin:0 auto; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .scan-preview img{width:100%; display:block;}
  .scan-line{
    position:absolute; left:0; right:0; height:2px; background:var(--brass);
    box-shadow:0 0 10px 2px rgba(184,134,58,.7);
    animation:scan 1.3s ease-in-out infinite;
  }
  @keyframes scan{0%{top:4%;} 50%{top:94%;} 100%{top:4%;}}
  .scan-status{font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--brass-ink); margin-top:10px;}

  /* ---------- Review table (bill import) ---------- */
  .review-scroll{overflow-x:auto;}
  .review-row{display:grid; grid-template-columns:1.4fr 0.6fr 0.8fr 0.7fr 0.8fr 0.9fr 0.9fr auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); min-width:820px;}
  .review-row:last-child{border-bottom:none;}
  .review-head{font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono'; padding-bottom:6px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:1.4fr 0.6fr 0.8fr 0.7fr 0.8fr 0.9fr 0.9fr auto; gap:8px; min-width:820px;}
  .match-tag{font-size:10.5px; padding:2px 6px; border-radius:8px; white-space:nowrap;}
  .match-existing{background:var(--moss-bg); color:var(--moss);}
  .match-new{background:var(--brass-bg); color:var(--brass-ink);}
  .margin-toolbar{display:flex; align-items:center; gap:10px; padding:4px 0 16px 0; flex-wrap:wrap;}
  .margin-toolbar .field-input{width:80px;}
  .margin-toolbar label{font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}

  /* ---------- Admin / auth ---------- */
  .admin-badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-family:'IBM Plex Mono'; padding:3px 8px; border-radius:9px; background:var(--moss-bg); color:var(--moss);}
  .lock-dot{width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block;}
  .login-card{max-width:380px; margin:0 auto; overflow:visible;}
  .login-card .card-head{display:none;} /* the badge + title inside card-body replace it */
  .login-card p{font-size:13px; color:var(--ink-soft); margin:0 0 16px 0; line-height:1.5;}
  .login-badge{
    width:44px; height:44px; border-radius:50%; background:var(--brass-bg); color:var(--brass-ink);
    display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;
  }
  .login-shopname{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--ink-soft); text-align:center; margin-bottom:2px;}
  .login-title{font-size:19px; font-weight:700; text-align:center; margin-bottom:4px; letter-spacing:-0.01em;}
  .role-toggle{display:flex; gap:6px; margin-bottom:16px; background:var(--paper); padding:4px; border-radius:6px;}
  .role-toggle button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:8px 6px; font-size:13px; font-weight:600; border:none; background:transparent;
    border-radius:4px; cursor:pointer; color:var(--ink-soft);
  }
  .role-toggle button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(33,29,24,.1);}
  .login-page-wrap{min-height:calc(100vh - 120px); display:flex; align-items:center; justify-content:center; padding:20px 0;}
  .admin-gate{padding:48px 20px; text-align:center;}

  /* ---------- Sale / cart ---------- */
  .sale-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start;}
  .sale-tools{display:grid;grid-template-columns:minmax(170px,.36fr) minmax(0,1fr);gap:12px;align-items:stretch}
  .sale-tools .card{height:100%}
  .product-grid{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;scrollbar-width:thin;scroll-behavior:smooth}
  .product-tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;cursor:pointer;flex:0 0 148px;height:166px;display:flex;flex-direction:column;min-width:0;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease}
  .product-tile:hover{border-color:var(--brass);box-shadow:0 3px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
  .product-thumb{height:104px;width:100%;flex:0 0 104px;border-radius:6px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:8px;overflow:hidden}
  .product-thumb img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
  .product-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.product-price{font-family:'IBM Plex Mono';font-size:12px;margin-top:3px;color:var(--brass-ink)}
  .frequent-scroll{overflow:visible!important;max-height:none!important}
  .frequent-scroll .card-body{padding-bottom:6px}
  .sale-search-card .card-head{padding-bottom:8px}
  .sale-search-card .search-input{font-size:15px;padding:10px 12px}
  .sale-search-result{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;border-radius:5px}
  .sale-search-result:hover{background:var(--paper)}
  .sale-search-result[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
  .sale-search-result-thumb{width:38px;height:38px;flex:0 0 38px;border-radius:5px;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:18px}
  .sale-search-result-thumb img{width:100%;height:100%;object-fit:contain;object-position:center}
  @media (max-width:620px){.sale-tools{grid-template-columns:1fr}.product-tile{flex-basis:142px;height:158px}.product-thumb{height:96px;flex-basis:96px}}
  @media (max-width:920px){.sale-grid{grid-template-columns:1fr;}}
  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .cart-line:last-child{border-bottom:none;}
  .cart-name{font-weight:600; font-size:13.5px;}
  .cart-sub{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono';}
  .stepper{display:flex; align-items:center; gap:6px; margin-left:auto;}
  .stepper button{width:24px; height:24px; border-radius:4px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-family:'IBM Plex Mono'; font-size:14px; line-height:1;}
  .stepper button:hover{border-color:var(--brass);}
  .stepper span{font-family:'IBM Plex Mono'; font-weight:600; width:20px; text-align:center;}
  .cart-total{font-family:'IBM Plex Mono'; font-weight:600; width:64px; text-align:right;}
  .cart-empty{display:flex;align-items:center;gap:10px;padding:18px 4px;color:var(--ink-soft);font-size:13px;background:var(--paper);border-radius:6px}
  .cart-empty .empty-cart-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brass-bg);color:var(--brass-ink);flex:0 0 30px}
  .cart-footer{padding-top:14px; margin-top:8px; border-top:1.5px solid var(--ink); display:flex; align-items:center; justify-content:space-between;}
  .cart-total-num{font-family:'IBM Plex Mono'; font-size:20px; font-weight:700;}

  .banner{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:5px; font-size:13px; margin-bottom:14px;}
  .banner-warn{background:var(--stamp-bg); color:#7A2E26;}
  .banner-info{background:var(--brass-bg); color:var(--brass-ink);}
  .banner p{margin:0 0 6px 0;}
  .banner-actions{display:flex; gap:8px;}

  /* ---------- Receipt ---------- */
  .receipt-wrap{display:flex; justify-content:center;}
  .receipt-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    padding:26px 24px; font-family:'IBM Plex Mono'; font-size:12.5px;
    background-image: repeating-linear-gradient(transparent, transparent 27px, var(--paper) 28px);
  }
  .receipt-title{font-size:16px; font-weight:700; text-align:center; margin-bottom:2px;}
  .receipt-sub{text-align:center; color:var(--ink-soft); font-size:11px; margin-bottom:16px;}
  .receipt-divider{border-top:1px dashed var(--line); margin:12px 0;}
  .receipt-row{display:flex; justify-content:space-between; padding:3px 0;}
  .receipt-total-row{display:flex; justify-content:space-between; font-weight:700; font-size:14px; padding-top:8px;}
  .receipt-card.width-narrow{max-width:280px; font-size:11.5px;}
  .receipt-card.width-standard{max-width:360px;}
  .receipt-card.width-wide{max-width:480px; font-size:13.5px;}
  .receipt-footer-msg{text-align:center; margin-top:14px; font-style:italic; color:var(--ink-soft);}
  .receipt-policy{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:10.5px;line-height:1.45;color:var(--ink-soft)}
  .receipt-card.invoice-font-sm{font-size:11px}.receipt-card.invoice-font-md{font-size:12.5px}.receipt-card.invoice-font-lg{font-size:14px}
  .receipt-stamp{margin-top:18px; text-align:center; color:var(--moss); border:2px solid var(--moss); border-radius:4px; padding:5px; font-weight:700; letter-spacing:0.05em; transform:rotate(-1.5deg);}

  /* ---------- Modal / form ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:#fff;
    padding:12px 18px; border-radius:5px; font-size:13px; box-shadow:0 6px 18px rgba(0,0,0,.2);
    z-index:50; animation:toast-in .18s ease;
  }
  @keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Home page ---------- */
  .hero{ 
    position:relative; border-radius:6px; overflow:hidden; margin-bottom:20px;
    background:linear-gradient(135deg, var(--brass-bg), var(--paper));
    min-height:460px; border:1px solid var(--line);
  }
  .identity-letterhead{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,440px);justify-content:stretch;gap:18px;align-items:stretch}.identity-letterhead>div:first-child{display:flex;align-items:center;min-width:0}.identity-clock{justify-self:end;width:100%;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 11px;border:1px solid color-mix(in srgb,var(--brass) 30%,var(--line));border-radius:13px;background:linear-gradient(145deg,color-mix(in srgb,var(--brass-bg) 68%,var(--surface)),color-mix(in srgb,var(--surface) 78%,transparent));color:var(--brass-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 18px color-mix(in srgb,var(--brass) 11%,transparent);overflow:hidden}.flip-clock-date{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}.flip-clock-date strong{color:var(--brass-ink);font-size:10px;letter-spacing:.04em}.flip-clock-time{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:5px}.flip-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;min-width:0}.flip-digit{position:relative;display:grid;place-items:center;min-width:0;height:36px;border-radius:7px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,#fff) 0 49%,color-mix(in srgb,var(--surface) 72%,var(--paper)) 50% 100%);border:1px solid color-mix(in srgb,var(--brass) 22%,var(--line));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -5px 8px rgba(33,29,24,.07),0 2px 5px rgba(33,29,24,.08);perspective:180px}.flip-digit::before{content:'';position:absolute;inset:50% 0 auto;height:1px;background:color-mix(in srgb,var(--ink) 24%,transparent);z-index:2}.flip-digit::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25),transparent 65%);opacity:.55;pointer-events:none}.flip-digit-face{position:relative;z-index:1;font-family:'IBM Plex Mono',monospace;font-size:clamp(20px,2vw,26px);font-weight:700;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.55)}.flip-digit.is-flipping .flip-digit-face{animation:flip-clock-number .38s cubic-bezier(.2,.7,.3,1)}.flip-separator{font-family:'IBM Plex Mono',monospace;font-size:clamp(18px,1.9vw,24px);font-weight:700;color:var(--brass);line-height:1;transform:translateY(-1px);text-align:center}.flip-clock-zone{display:block;margin-top:0;text-align:right;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}@keyframes flip-clock-number{0%{transform:rotateX(-82deg);opacity:.35}55%{transform:rotateX(10deg);opacity:1}100%{transform:rotateX(0);opacity:1}}.carousel-tabs{position:absolute;top:16px;left:16px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;padding-right:100px}.carousel-tab{border:1px solid rgba(255,255,255,.4);background:rgba(33,29,24,.32);color:#fff;border-radius:20px;padding:6px 10px;cursor:pointer;font-size:11px}.carousel-tab.active{background:var(--brass);border-color:var(--brass)}.hero-noimg .carousel-tab{background:var(--surface);color:var(--ink);border-color:var(--line)}.insight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}.insight-card{padding:16px 18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.action-note{font-size:11.5px;color:var(--brass-ink);margin-top:8px;font-weight:600}.bar{height:8px;background:var(--paper);border-radius:5px;overflow:hidden;margin-top:7px}.bar>i{height:100%;display:block;background:var(--brass)}
  .hero-slides{position:absolute; inset:0;}
  .hero-slide{
    position:absolute; inset:0; background-size:cover; background-position:center;
    opacity:0; transition:opacity 900ms ease;
  }
  .hero-slide.active{opacity:1;}
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(33,29,24,.38) 0%, rgba(33,29,24,.06) 32%, rgba(33,29,24,.1) 55%, rgba(33,29,24,.82) 100%);
  }
  .hero-noimg .hero-scrim{display:none;}
  .hero-content{position:relative; z-index:2; min-height:460px; display:flex; flex-direction:column; justify-content:space-between; padding:30px 30px 22px 30px;}
  .hero-top{color:#fff; max-width:640px;}
  .hero-noimg .hero-top{color:var(--ink);}
  .hero-shop{font-size:30px; font-weight:700; letter-spacing:-0.015em; line-height:1.1;}
  .hero-welcome{font-size:15.5px; margin-top:8px; opacity:.95; max-width:520px; line-height:1.5;}
  .hero-meta{font-family:'IBM Plex Mono'; font-size:12px; margin-top:14px; opacity:.9; display:flex; gap:16px; flex-wrap:wrap;}
  .hero-edit-btn{
    position:absolute; top:16px; right:16px; z-index:3;
    background:rgba(255,253,249,.22); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.4); color:#fff;
    font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:5px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .hero-edit-btn:hover{background:rgba(255,253,249,.34);}
  .hero-noimg .hero-edit-btn{background:rgba(255,253,249,.6); border-color:rgba(33,29,24,.18); color:var(--ink);}
  .hero-noimg .hero-edit-btn:hover{background:rgba(255,253,249,.85);}
  .hero-arrow{
    position:absolute; top:50%; transform:translateY(-50%); z-index:3;
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:rgba(255,253,249,.2); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.38); color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .hero-arrow:hover{background:rgba(255,253,249,.34);}
  .hero-arrow.prev{left:16px;}
  .hero-arrow.next{right:16px;}
  .hero-dots{display:flex; gap:7px; margin-bottom:14px;}
  .hero-dot{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4); border:none; cursor:pointer; padding:0;}
  .hero-dot.active{background:#fff; width:18px; border-radius:4px;}
  .hero-noimg .hero-dot{background:rgba(33,29,24,.22);}
  .hero-noimg .hero-dot.active{background:var(--brass-ink);}

  .home-quick{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .home-quick-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; text-align:center; cursor:pointer; transition:border-color .12s ease, background .12s ease;}
  .home-quick-card:hover{border-color:var(--brass);}
  .home-quick-card .icon-wrap{display:flex; justify-content:center; margin-bottom:8px; color:var(--brass-ink);}
  .home-quick-card div.label{font-weight:600; font-size:14px;}
  .home-quick.glass .home-quick-card{
    background:rgba(255,253,249,.14);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
  }
  .home-quick.glass .home-quick-card:hover{background:rgba(255,253,249,.26); border-color:rgba(255,255,255,.5);}
  .home-quick.glass .home-quick-card .icon-wrap{color:#fff;}
  .hero-noimg .home-quick.glass .home-quick-card{
    background:rgba(255,253,249,.6); border:1px solid rgba(33,29,24,.14); color:var(--ink);
  }
  .hero-noimg .home-quick.glass .home-quick-card:hover{background:rgba(255,253,249,.88);}
  .hero-noimg .home-quick.glass .home-quick-card .icon-wrap{color:var(--brass-ink);}
  .bg-thumb{width:100%; max-width:220px; border-radius:5px; border:1px solid var(--line); display:block; margin-top:8px;}
  .bg-thumb-grid{display:flex; flex-wrap:wrap; gap:10px; margin-top:8px;}
  .bg-thumb-item{position:relative; width:96px; height:72px; border-radius:5px; overflow:hidden; border:1px solid var(--line);}
  .bg-thumb-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .bg-thumb-remove{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%;
    background:rgba(33,29,24,.65); color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .bg-thumb-remove:hover{background:var(--stamp);}
  .bg-thumb-add{
    width:96px; height:72px; border-radius:5px; border:1.5px dashed var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
    background:var(--paper);
  }
  .bg-thumb-add:hover{border-color:var(--brass); color:var(--brass-ink);}

  /* ---------- Category card ---------- */
  .category-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .category-tile{background:var(--paper); border:1px solid var(--line); border-radius:5px; padding:12px 14px;}
  .category-tile .cat-name{font-size:13px; font-weight:600;}
  .category-tile .cat-count{font-family:'IBM Plex Mono'; font-size:20px; margin-top:3px; color:var(--brass-ink);}
  .category-tile .cat-sub{font-size:11px; color:var(--ink-soft);}

  /* ---------- Discount & payment (checkout) ---------- */
  .discount-toggle{display:flex; gap:6px; margin-bottom:10px;}
  .discount-toggle button{
    flex:1; padding:7px 8px; font-size:12.5px; border:1px solid var(--line); background:var(--surface);
    border-radius:4px; cursor:pointer; color:var(--ink-soft);
  }
  .discount-toggle button.active{background:var(--brass); color:#fff; border-color:var(--brass);}
  .pay-toggle{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px;}
  .pay-toggle button{padding:9px 6px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--surface); border-radius:4px; cursor:pointer; color:var(--ink-soft);}
  .pay-toggle button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .due-badge{font-size:10.5px; padding:2px 6px; border-radius:8px; background:var(--stamp-bg); color:var(--stamp); font-family:'IBM Plex Mono';}
  .paid-badge{font-size:10.5px; padding:2px 6px; border-radius:8px; background:var(--moss-bg); color:var(--moss); font-family:'IBM Plex Mono';}
  .summary-line{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--ink-soft);}
  .summary-line.total{color:var(--ink); font-weight:700; font-size:14.5px; border-top:1px dashed var(--line); margin-top:4px; padding-top:8px;}

  /* ---------- Item descriptions ---------- */
  .desc-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px; font-weight:400;}
  .edited-badge{font-size:10px; padding:1px 6px; border-radius:8px; background:var(--brass-bg); color:var(--brass-ink); font-family:'IBM Plex Mono'; margin-left:6px;}
  .expanded-row td{border-bottom:none !important; background:var(--paper);}

  /* ---------- Manager approval / discount limit ---------- */
  .manager-gate{background:var(--stamp-bg); border:1px solid #E4C9C4; border-radius:5px; padding:12px 14px; margin:10px 0;}
  .manager-gate p{font-size:12.5px; color:#7A2E26; margin:0 0 8px 0; line-height:1.5;}

  /* ---------- Return items ---------- */
  .return-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .return-row:last-child{border-bottom:none;}

  /* ---------- Payment history ---------- */
  .pay-history-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); padding:2px 0;}

  /* ---------- Appearance / settings ---------- */
  .size-toggle{display:flex; gap:6px; margin-bottom:4px;}
  .size-toggle button{flex:1; padding:8px; font-size:12.5px; border:1px solid var(--line); background:var(--surface); border-radius:4px; cursor:pointer; color:var(--ink-soft);}
  .size-toggle button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .swatch-row{display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .swatch{width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
  .swatch.active{border-color:var(--ink);}

  @media print{
    .sidebar, .page-head, .no-print{display:none !important;}
    .main{padding:0;}
    html,body{height:auto;overflow:visible;}
    body{background:#fff;}
    .receipt-card{border:none; max-width:100%;}
  }

  /* ---------- Responsive: tablet & phone ---------- */
  @media (max-width:860px){
    #app{flex-direction:column; height:100vh; height:100dvh; min-height:0;}
    .sidebar{
      width:100%; flex:0 0 auto; height:auto; position:relative; top:auto; z-index:20;
      flex-direction:row; align-items:center; padding:8px 10px; overflow:visible;
      border-right:none; border-bottom:1px solid var(--line);
    }
    .brand{padding:0 12px 0 2px; border-bottom:none; margin-bottom:0; flex:0 0 auto;}
    .brand-sub{display:none;}
    .nav{flex-direction:row; margin-top:0; flex:1 1 auto; min-width:0; overflow-x:auto; scrollbar-width:none;}
    .nav::-webkit-scrollbar{display:none;}
    .nav-item{padding:8px 12px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap;}
    .nav-item.active{border-left:none; border-bottom:3px solid var(--brass);}
    .nav-item span{display:none;}
    .nav-item > span:first-of-type{display:inline;}
    .nav-count{display:inline-flex; margin-left:4px !important;}
    #app.sidebar-collapsed .nav-item > span:first-of-type{display:none;}
    .sidebar-foot{display:none;}
    .main{height:auto; flex:1 1 auto; overflow-y:auto; padding:18px 14px 40px 14px;}

    .hero, .hero-content{min-height:340px;}
    .hero-shop{font-size:23px;}
    .hero-content{padding:20px 18px 16px 18px;}
    .home-quick{grid-template-columns:repeat(3,1fr); gap:8px;}
    .home-quick-card{padding:12px 6px;}
    .home-quick-card div.label{font-size:12px;}
    .hero-arrow{width:32px; height:32px;}

    .stat-row{grid-template-columns:repeat(2,1fr);}
    .analytics-kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .analytics-kpi--lead{grid-column:1/-1;}
    .analytics-kpi--primary,.analytics-kpi--expense,.analytics-kpi--compact,.analytics-kpi--dashboard-stock{grid-column:span 1;}
    .closing-hero{grid-template-columns:1fr;}
    .expense-hero{grid-template-columns:1fr;}
    .margin-flow{grid-template-columns:1fr;gap:14px;}
    .margin-flow-symbol{display:none;}
    .margin-flow-profit{border-left:none;border-top:1px solid color-mix(in srgb,var(--status-success) 25%,var(--line));padding:14px 0 0;}
    .margin-product-grid,.margin-summary-grid{grid-template-columns:1fr;}
    .sale-grid{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    .home-quick{grid-template-columns:1fr;}
    .hero-shop{font-size:20px;}
    .stat-row{grid-template-columns:1fr;}
    .analytics-kpi-grid{grid-template-columns:1fr;}
    .analytics-kpi--lead,.analytics-kpi--primary,.analytics-kpi--expense,.analytics-kpi--compact,.analytics-kpi--dashboard-stock{grid-column:1;}
    .analytics-kpi--lead{display:block;}
    .analytics-kpi-signal{display:none;}
    .analytics-kpi--lead .analytics-kpi-value{font-size:32px;}
    .closing-summary-grid{grid-template-columns:1fr;}
    .closing-payment-row{grid-template-columns:30px minmax(82px,1fr) minmax(70px,1fr) minmax(80px,100px);gap:8px;}
    .closing-hero-value{font-size:32px;}
    .expense-hero-value{font-size:32px;}
    .identity-letterhead{grid-template-columns:1fr;padding:14px;gap:12px;}
    .identity-clock{min-width:100%;padding:9px 10px;gap:5px;}
    .flip-clock-date{font-size:10px;letter-spacing:.08em;}
    .flip-clock-date strong{font-size:11px;letter-spacing:.05em;}
    .flip-clock-time{gap:5px;}
    .flip-group{gap:4px;}
    .flip-digit{height:46px;border-radius:8px;}
    .flip-digit-face{font-size:clamp(22px,8vw,30px);}
    .flip-separator{font-size:24px;}
  }

  /* ---------- Premium glass UI layer ---------- */
  :root{
    --glass-bg:rgba(255,255,255,.58);
    --glass-strong:rgba(255,255,255,.76);
    --glass-border:rgba(255,255,255,.7);
    --glass-shadow:0 16px 40px rgba(37,31,24,.09), 0 2px 8px rgba(37,31,24,.04);
    --radius:14px;
    --shadow:var(--glass-shadow);
    --transition:200ms cubic-bezier(.2,.75,.25,1);
  }
  body,button,input,select,textarea{font-family:'Inter',sans-serif;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--brass) 12%,transparent),transparent 34%),linear-gradient(135deg,var(--paper),color-mix(in srgb,var(--paper) 65%,#fff 35%));
    background-attachment:fixed;
  }
  #app{isolation:isolate;}

  const palettes=dark ? {general:['#0d1422','#172235'],grocery:['#0d1a19','#142824'],footwear:['#111827','#1b2638'],fashion:['#1c1522','#2a1c30']} : {general:['#EFEAE1','#FFFDF9'],grocery:['#EDF2E8','#FEFFFC'],footwear:['#ECE9E4','#FFFEFC'],fashion:['#F4E9EF','#FFF9FC']}; const palette=palettes[s.theme]||palettes.general;
  document.documentElement.style.setProperty('--paper',palette[0]); document.documentElement.style.setProperty('--surface',palette[1]);

  Object.entries(tone).forEach(([key,value])=>document.documentElement.style.setProperty(key,value));

/* ============ HOME HERO CAROUSEL ============ */
// Auto-advance updates the DOM directly (not via the app's usual full
// render()) so the CSS opacity transition actually gets to animate — a
// full innerHTML rebuild would replace the slide nodes each tick and the
// crossfade would never have a "before" state to interpolate from.
function getHeroImages(){
  const s = state.settings;
  if(Array.isArray(s.backgroundImages) && s.backgroundImages.length) return s.backgroundImages;
  return [];
}
function themeLabels(){ return {general:['Storefront','Display wall','Window','Counter'],grocery:['Fresh produce','Aisle','Pantry wall','Checkout'],footwear:['New arrivals','Shoe wall','Try-on area','Counter'],fashion:['Collection','Display rail','Window','Styling desk']}[state.settings.theme]||['Storefront','Display wall','Window','Counter']; }
function updateHeroSlideDOM(){
  document.querySelectorAll('.hero-slide').forEach((el,i) => el.classList.toggle('active', i === state.carouselIndex));
  document.querySelectorAll('.hero-dot').forEach((el,i) => el.classList.toggle('active', i === state.carouselIndex));
}
function goToSlide(i){
  const imgs = getHeroImages();
  if(!imgs.length) return;
  state.carouselIndex = ((i % imgs.length) + imgs.length) % imgs.length;
}
let heroInterval = null;
function stopHeroCarousel(){ if(heroInterval){ clearInterval(heroInterval); heroInterval = null; } }
function ensureHeroCarousel(){
  if(state.view !== 'home' || state.homeEditing){ stopHeroCarousel(); return; }
  const imgs = getHeroImages();
  if(imgs.length < 2){ stopHeroCarousel(); return; }
  if(heroInterval) return; // already running — don't reset the timer on every render
  heroInterval = setInterval(() => {
    goToSlide(state.carouselIndex + 1);
    updateHeroSlideDOM();
  }, 5000);
}
function formatLiveClock(d){ const pad=n=>String(n).padStart(2,'0'); const names=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY']; return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${names[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function renderLiveClockPanel(d=new Date()){
  const pad=n=>String(n).padStart(2,'0');
  const names=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const dateLabel=`${pad(d.getDate())} ${d.toLocaleString(undefined,{month:'short'}).toUpperCase()} ${d.getFullYear()}`;
  const time=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

function updateLiveClock(){
  const el=document.getElementById('live-clock');
  if(!el) return;
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const names=['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const time=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const dateLabel=`${pad(d.getDate())} ${d.toLocaleString(undefined,{month:'short'}).toUpperCase()} ${d.getFullYear()}`;
  const dateNode=el.querySelector('.clock-date-value');
  const dayNode=el.querySelector('.clock-day');
  const timeNode=el.querySelector('.clock-time-value');
  if(dateNode) dateNode.textContent=dateLabel;
  if(dayNode) dayNode.textContent=names[d.getDay()];
  if(timeNode && timeNode.textContent!==time){ timeNode.textContent=time; timeNode.classList.remove('is-ticking'); void timeNode.offsetWidth; timeNode.classList.add('is-ticking'); window.setTimeout(()=>timeNode.classList.remove('is-ticking'),260); }
  el.setAttribute('aria-label',formatLiveClock(d));
}

function darkenHex(hex, amount){
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.max(0, Math.round(((n>>16)&255) * (1-amount)));
  const g = Math.max(0, Math.round(((n>>8)&255) * (1-amount)));
  const b = Math.max(0, Math.round((n&255) * (1-amount)));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lightenHex(hex, amount){
  const n = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.round(((n>>16)&255) + (255-((n>>16)&255))*amount));
  const g = Math.min(255, Math.round(((n>>8)&255) + (255-((n>>8)&255))*amount));
  const b = Math.min(255, Math.round((n&255) + (255-(n&255))*amount));
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ============ API ============ */
async function api(method, url, body){
  const opts = { method, credentials: 'same-origin' };
  if(body !== undefined){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  let res;
  try{
    res = await fetch(url, opts);
  }catch(e){
    throw new Error('Could not reach the local server — make sure it is running.');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    if(data) Object.assign(err, data);
    throw err;
  }
  return data;
}

function formatCopilotText(text){
  const safe = escapeHtml(text || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const lines = safe.split(/\r?\n/); let html = ''; let inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  lines.forEach(line => {
    const trimmed = line.trim();
    if(!trimmed){ closeList(); return; }
    const bullet = trimmed.match(/^[-*]\s+(.+)/);
    if(bullet){ if(!inList){ html += '<ul>'; inList = true; } html += `<li>${bullet[1]}</li>`; return; }
    closeList(); html += `<p>${trimmed}</p>`;
  });
  closeList(); return html || '<p>No explanation was returned.</p>';
}
function copilotTone(message){
  if(!message || !message.success) return 'neutral';
  const data = message.data || {};
  if(message.intent === 'LOW_STOCK' && (data.products || []).some(p => p.status === 'critical')) return 'danger';
  if(message.intent === 'BUSINESS_FOCUS' && (data.alerts || []).some(a => a.type === 'Attention')) return 'danger';
  if(['LOW_MARGIN_PRODUCTS','SLOW_MOVING_PRODUCTS','EXPENSE_SUMMARY','RESTOCK_RECOMMENDATIONS'].includes(message.intent)) return 'warning';
  if(['TOP_PRODUCTS','SALES_SUMMARY','SALES_COMPARISON'].includes(message.intent)) return 'success';
  return 'info';
}
function copilotErrorMessage(error){
  if(error?.code === 'OLLAMA_UNAVAILABLE') return 'SmartRetail AI is currently offline. Start Ollama to continue.';
  if(error?.code === 'OLLAMA_TIMEOUT') return 'The analysis is taking longer than expected. Please try again.';
  if(error?.code === 'UNKNOWN') return 'I currently specialize in SmartRetail business analysis. Try asking about sales, products, inventory, profit, or expenses.';
  return error?.message || 'SmartRetail AI could not complete that analysis. Please try again.';
}

/* ============ MATCHING ============ */
function findMatch(extracted){
  if(!extracted) return null;
  if(extracted.code){
    const c = String(extracted.code).trim().toLowerCase();
    const byCode = state.inventory.find(it => it.code && String(it.code).trim().toLowerCase() === c);
    if(byCode) return byCode;
  }
  const name = normalize(extracted.name);
  if(!name) return null;
  let exact = state.inventory.find(it => normalize(it.name) === name);
  if(exact) return exact;
  const words = name.split(' ').filter(Boolean);
  let best = null, bestScore = 0;
  state.inventory.forEach(it => {
    const itWords = normalize(it.name).split(' ').filter(Boolean);
    if(!itWords.length) return;
    const overlap = words.filter(w => itWords.includes(w)).length;
    const score = overlap / Math.max(words.length, itWords.length);
    if(score > bestScore){ bestScore = score; best = it; }
  });
  return bestScore >= 0.5 ? best : null;
}

/* ============ CART / CHECKOUT ============ */
function effectiveMaxStock(invId){
  const inv = state.inventory.find(it => it.id === invId);
  const base = inv ? Number(inv.quantity||0) : 0;
  // While editing a past bill, the original line's stock was already
  // deducted — so it's available again for this same edit.
  const original = state.editingSaleId && state.editingSaleOriginal ? (state.editingSaleOriginal[invId] || 0) : 0;
  return base + original;
}
function addToCart(item, qty=1){
  const line = state.cart.find(c => c.invId === item.id);
  const stock = effectiveMaxStock(item.id);
  if(line){
    line.qty = Math.min(line.qty + qty, Math.max(stock, line.qty));
  }else{
    state.cart.push({ invId: item.id, name: item.name, price: item.price, qty: Math.min(qty, Math.max(stock,1)) });
  }
  render();
}
function changeCartQty(invId, delta){
  const line = state.cart.find(c => c.invId === invId);
  if(!line) return;
  const max = effectiveMaxStock(invId) || 999;
  line.qty = Math.max(1, Math.min(max, line.qty + delta));
  render();
}
function removeCartLine(invId){
  state.cart = state.cart.filter(c => c.invId !== invId);
  render();
}
function resetCheckout(){
  state.checkout = { discountMode: 'none', discountValue: 0, paymentMethod: 'cash', amountPaid: 0, customerName: '', customerPhone: '', customerAddress: '', managerPassword: '' };
  state.managerApprovalNeeded = null;
}
function cartSubtotal(){ return roundMoney(state.cart.reduce((s,c)=> s + c.price*c.qty, 0)); }
function checkoutPreview(){
  const subtotal = cartSubtotal();
  const { discountMode, discountValue } = state.checkout;
  let discountAmount = 0, total = subtotal;
  if(discountMode === 'percent'){
    discountAmount = roundMoney(subtotal * (Number(discountValue||0)/100));
    total = roundMoney(subtotal - discountAmount);
  }else if(discountMode === 'finalPrice'){
    total = roundMoney(Math.max(0, Math.min(Number(discountValue||0), subtotal)));
    discountAmount = roundMoney(subtotal - total);
  }
  const discountPercent = subtotal > 0 ? roundMoney((discountAmount/subtotal)*100) : 0;
  return { subtotal, discountAmount, discountPercent, total };
}

/* ============ SCAN / IMAGE UPLOAD FLOW ============ */
function triggerUpload(target){
  uploadTarget = target;
  document.getElementById('file-input').click();
}
function fileToResizedBase64(file, maxDim=1100){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width, height} = img;
        if(width > height && width > maxDim){ height = Math.round(height*(maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width*(maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve({ base64: canvas.toDataURL('image/jpeg', 0.85).split(',')[1], previewSrc: canvas.toDataURL('image/jpeg', 0.7) });
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const target = uploadTarget;

  if(target === 'background'){
    try{
      const { previewSrc } = await fileToResizedBase64(file, 1400);
      if(!state.homeDraft) state.homeDraft = { backgroundImages: [] };
      if(!state.homeDraft.backgroundImages) state.homeDraft.backgroundImages = [];
      if(state.homeDraft.backgroundImages.length >= 8){ showToast('Up to 8 photos — remove one to add another'); return; }
      state.homeDraft.backgroundImages.push(previewSrc);
      render();
    }catch(err){ showToast("Couldn't read that image"); }
    return;
  }
  if(target === 'inventory-image'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 700); state.inventoryImageDraft=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that image"); }
    return;
  }
  if(target === 'store-logo'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 500); if(!state.homeDraft) state.homeDraft={}; state.homeDraft.storeLogo=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that logo"); }
    return;
  }
  if(target === 'settings-logo'){
    try{ const { previewSrc } = await fileToResizedBase64(file, 500); state.settingsLogoDraft=previewSrc; render(); }
    catch(err){ showToast("Couldn't read that logo"); }
    return;
  }

  try{
    const { base64, previewSrc } = await fileToResizedBase64(file);
    state.scanning = { for: target, previewSrc };
    render();
    const result = target === 'bill'
      ? await api('POST', '/api/vision/bill', { imageBase64: base64 })
      : await api('POST', '/api/vision/tag', { imageBase64: base64 });
    state.scanning = null;
    if(target === 'bill'){
      const margin = state.settings.defaultMarginPercent;
      const rows = (result.items || []).map(it => {
        const cost = it.price ?? 0;
        return { name: it.name || '', quantity: it.quantity ?? 1, cost, margin, sell: sellFromMargin(cost, margin), code: it.code ?? null, category: it.category || '' };
      });
      if(!rows.length){ showToast('No items recognized in that photo — try a clearer shot'); render(); return; }
      state.billReview = rows;
      render();
    }else{
      const extracted = { name: result.name || '', price: result.price ?? 0, code: result.code ?? null };
      const match = findMatch(extracted);
      if(match){
        if(Number(match.quantity||0) <= 0){ showToast(`${match.name} is out of stock`); }
        else{ addToCart(match, 1); showToast(`Added ${match.name}`); }
        state.unmatched = null;
      }else{
        state.unmatched = extracted;
      }
      render();
    }
  }catch(err){
    console.error(err);
    state.scanning = null;
    showToast(err.message || "Couldn't read that image — try again with better light/focus");
    render();
  }
});

  };
  if(payload.businessPinCode && !/^\d{6}$/.test(payload.businessPinCode)){ showToast('PIN code must contain 6 digits'); return; }

async function loadData(){
  try{
    const authStatus = await api('GET', '/api/auth/status');
    state.role = authStatus.role || null;
    state.isAdmin = authStatus.role === 'admin';
    state.isStaff = authStatus.role === 'admin' || authStatus.role === 'employee';
    state.staffName = authStatus.name || '';
    state.adminConfigured = authStatus.configured;
  }catch(e){ showToast(e.message); }
  await Promise.all([
    refreshInventory(),
    (async () => { try{ state.settings = Object.assign(state.settings, await api('GET','/api/settings')); }catch(e){} })(),
    refreshSales(),
    refreshDiscountApprovals(),
    refreshExpenses(),
    refreshAnalytics(),
  ]);
  state.loaded = true;
  render();
}

function renderLoginCard(opts){

  const asEmployee = showToggle && state.loginRole === 'employee';
  const title = asEmployee ? 'Employee login' : (state.adminConfigured ? 'Admin login' : 'Set up admin access');
  const sub = asEmployee
    ? 'Enter your username and password.'
    : (state.adminConfigured
      ? 'Enter the admin password to continue.'
      : 'Choose a password to protect cost prices, sales reports, and settings — you\'ll enter it whenever you want to manage those.');
  const card = `
    <div class="card login-card">
      <div class="card-body">
        <div class="login-badge">${ic.lock}</div>
        ${state.settings.shopName ? `<div class="login-shopname">${escapeHtml(state.settings.shopName)}</div>` : ''}

        ${asEmployee ? `<div class="field"><label>Username</label><input class="field-input" id="login-username" placeholder="e.g. priya" autocomplete="username"></div>` : ''}
        <div class="field">
          <label>${asEmployee ? 'Password' : (state.adminConfigured ? 'Password' : 'Choose a password')}</label>
          <input class="field-input" type="password" id="login-password" placeholder="••••••" autocomplete="current-password">
        </div>
        ${state.loginError ? `<div style="color:var(--stamp); font-size:12.5px; margin-bottom:10px;">${escapeHtml(state.loginError)}</div>` : ''}
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" style="flex:1; justify-content:center;" data-action="submit-login">${ic.check} ${asEmployee ? 'Log in' : (state.adminConfigured ? 'Log in' : 'Set password')}</button>

    </div>`;
  return fullPage ? `<div class="login-page-wrap">${card}</div>` : card;
}

/* ============ RENDER: BUSINESS INTELLIGENCE ============ */
function analyticsCompactMoney(n){
  const value=Number(n)||0, abs=Math.abs(value), symbol=state.settings.currencySymbol||'₹';
  if(abs>=10000000) return `${symbol}${(value/10000000).toFixed(2)}Cr`;
  if(abs>=100000) return `${symbol}${(value/100000).toFixed(2)}L`;
  if(abs>=1000) return `${symbol}${(value/1000).toFixed(2)}K`;
  return fmt(value);
}
function analyticsKpiCard(label, metric, icon, variant, compact=false, periodNote='Net sales after returns · selected analysis period'){
  const current=Number(metric?.current||0), previous=Number(metric?.previous||0), isCount=compact;
  const hasBaseline=metric?.percentage!==null&&metric?.percentage!==undefined;
  const direction=metric?.direction==='up'?'up':metric?.direction==='down'?'down':'flat';
  const arrow=direction==='up'?'↑':direction==='down'?'↓':'→';
  const comparison=hasBaseline?`${arrow} ${Math.abs(Number(metric.percentage)||0).toFixed(1)}% ${direction==='up'?'higher':direction==='down'?'lower':'no change'} than previous period`:'Not enough data for comparison';
  const currentText=isCount?current.toLocaleString():analyticsCompactMoney(current), previousText=isCount?previous.toLocaleString():fmt(previous);
  const exact=isCount?current.toLocaleString():fmt(current);
  const previousLine=hasBaseline?`Previous period: ${previousText}`:'Previous period: no baseline';
  const title=isCount?exact:fmt(current);
  return `<article class="analytics-kpi analytics-kpi--${variant}${compact?' analytics-kpi--compact':''}" aria-label="${label}: ${exact}"><div><div class="analytics-kpi-head"><span class="analytics-kpi-icon">${icon}</span><span>${label}</span></div><div class="analytics-kpi-value" title="${title}">${currentText}</div><div class="analytics-kpi-compare is-${hasBaseline?direction:'none'}">${comparison}</div><div class="analytics-kpi-previous">${previousLine}</div>${variant==='lead'?`<div class="analytics-kpi-period">${periodNote}</div>`:''}</div>${variant==='lead'?`<div class="analytics-kpi-signal"><div class="analytics-kpi-signal-label">Performance signal</div><div class="analytics-kpi-signal-value">${hasBaseline?(direction==='up'?'Improving':direction==='down'?'Needs attention':'Holding steady'):'Building baseline'}</div><div class="analytics-kpi-signal-note">${hasBaseline?'Based on the previous equivalent period':'More history will unlock comparison'}</div></div>`:''}</article>`;
}
function biProductTone(status, trend){
  if(status==='declining') return Number(trend)<=-50?'danger':'warning';
  return ({'fast-moving':'success','trending-up':'info','slow-moving':'warning','non-moving':'danger'})[status]||'neutral';
}
function biInsightTone(type){ return ({Positive:'success',Information:'info',Warning:'warning',Attention:'danger',Critical:'danger'})[type]||'neutral'; }
function biInventoryTone(label){ return ({'HEALTHY STOCK':'success','LOW STOCK':'warning','CRITICAL STOCK':'danger','NON-MOVING':'danger','CAPITAL LOCKED':'warning'})[label]||'neutral'; }
function biGrowthTone(value){ return value===null||value===undefined?'neutral':Number(value)>0?'success':Number(value)<0?'warning':'info'; }
function biCustomerTone(status){ return ({new:'info',repeat:'success',inactive:'danger','one-time':'neutral'})[status]||'neutral'; }

function dashboardRange(period){
  const now=new Date(); const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(period==='today') return {start:startToday,end:startToday+86400000,label:'Today'};
  if(period==='week'){ const d=new Date(startToday); const day=d.getDay()||7; const start=startToday-(day-1)*86400000; return {start,end:start+7*86400000,label:'This week'}; }
  if(period==='lastMonth'){ const start=new Date(now.getFullYear(),now.getMonth()-1,1).getTime(); return {start,end:new Date(now.getFullYear(),now.getMonth(),1).getTime(),label:'Last month'}; }
  if(period==='custom'){ const start=new Date(state.dashboardStart).getTime(), end=new Date(state.dashboardEnd).getTime(); if(Number.isFinite(start)&&Number.isFinite(end)&&end>=start) return {start,end:end+1,label:'Custom'}; return null; }
  return {start:new Date(now.getFullYear(),now.getMonth(),1).getTime(),end:new Date(now.getFullYear(),now.getMonth()+1,1).getTime(),label:'This month'};
}
function dashboardExpenseTotal(start,end){ return state.expenses.filter(e=>{const t=Date.parse(`${e.date}T00:00:00`);return t>=start&&t<end;}).reduce((n,e)=>n+Number(e.amount||0),0); }
function saleRevenue(sale){ return Number(sale.total||0); }
function saleCogsNet(sale){ const base=(sale.items||[]).reduce((n,i)=>n+Number(i.costPriceAtSale||0)*Number(i.qty||0),0); const returned=(sale.returns||[]).reduce((n,r)=>n+(r.items||[]).reduce((x,i)=>{const line=(sale.items||[]).find(l=>l.id===i.id);return x+(line?Number(line.costPriceAtSale||0)*Number(i.qty||0):0)},0),0); return base-returned; }
function saleReturns(sale){ return (sale.returns||[]).reduce((n,r)=>n+Number(r.refundAmount||0),0); }
function saleGrossProfitNet(sale){ return saleRevenue(sale)-saleCogsNet(sale)-saleReturns(sale); }
function dashboardPeriodSales(start,end){ return state.sales.filter(s=>Number(s.timestamp)>=start&&Number(s.timestamp)<end); }
function dashboardKpis(start,end){ const rows=dashboardPeriodSales(start,end); const revenue=rows.reduce((n,s)=>n+saleRevenue(s),0), cogs=rows.reduce((n,s)=>n+saleCogsNet(s),0), returns=rows.reduce((n,s)=>n+saleReturns(s),0), grossProfit=revenue-cogs-returns, expenses=dashboardExpenseTotal(start,end); return {rows,revenue,cogs,returns,grossProfit,expenses,netProfit:grossProfit-expenses,netSales:rows.reduce((n,s)=>n+saleNet(s),0)}; }
function dashboardMoneyCard(label,value,note,action,extra=''){ return `<div class="insight-card" ${action?`data-nav="${action}" style="cursor:pointer"`:''}><div class="mono" style="font-size:11px">${label}</div><div style="font-size:22px;font-weight:700;margin-top:4px">${value}</div><div class="action-note">${note}</div>${extra}</div>`; }
function dashboardComparison(current, previous, label){
  if(Number(previous)===0) return `<div style="font-size:11px;color:var(--ink-soft);margin-top:4px">No previous-period baseline</div>`;
  const pct=(Number(current)-Number(previous))/Math.abs(Number(previous))*100;
  const up=pct>=0;
  return `<div style="font-size:11px;color:${up?'var(--moss)':'var(--stamp)'};margin-top:4px">${up?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% vs ${label}</div>`;
}
function dashboardMetric(current, previous){
  const value=Number(current)||0, prior=Number(previous)||0;
  if(prior===0) return {current:value,previous:prior,percentage:null,direction:'flat'};
  const difference=value-prior, percentage=(difference/Math.abs(prior))*100;
  return {current:value,previous:prior,percentage,direction:difference>0?'up':difference<0?'down':'flat'};
}

}

function renderSalesGraph(){
